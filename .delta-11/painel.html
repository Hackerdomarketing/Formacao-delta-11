<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Δ-11 · Centro de Comando</title>
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   PAINEL v8 · Centro de Comando Δ-11
   Paleta: preto + vermelho + tons de cinza + branco
   Verde: exclusivo para tarefas concluídas
   Linhas mais grossas · Grade de operativos · Drawer lateral
   ═══════════════════════════════════════════════════════════════ */

:root {
  /* ─── SUPERFÍCIES (preto profundo) ─── */
  --surface-0: #020202;
  --surface-1: #060606;
  --surface-2: #0c0c0c;
  --surface-3: #131313;
  --surface-4: #1a1414;

  /* ─── LINHAS (com tint vermelho sutil para reforçar identidade) ─── */
  --line-1: rgba(255, 32, 32, 0.08);
  --line-2: rgba(255, 32, 32, 0.18);
  --line-3: rgba(255, 32, 32, 0.32);
  --line-neutral: rgba(255, 255, 255, 0.08);

  /* ─── VERMELHO Δ-11 (dominante) ─── */
  --brand: #ff2020;
  --brand-strong: #ff3838;
  --brand-deep: #a01818;
  --brand-wine: #6b1414;
  --brand-glow: rgba(255, 32, 32, 0.55);
  --brand-glow-soft: rgba(255, 32, 32, 0.15);
  --brand-glow-strong: rgba(255, 32, 32, 0.75);
  --brand-wash: rgba(255, 32, 32, 0.06);
  --brand-wash-strong: rgba(255, 32, 32, 0.12);

  /* ─── VERDE (SÓ CONCLUÍDO — detalhe discreto) ─── */
  --done: #5ce68a;
  --done-soft: rgba(92, 230, 138, 0.10);
  --done-line: rgba(92, 230, 138, 0.28);

  /* ─── TEXTO (contraste AA verificado) ─── */
  --ink-100: #f8f8f8;
  --ink-80: #c8c8c8;
  --ink-60: #8a8a8a;
  --ink-40: #5c5c5c;
  --ink-20: #2e2e2e;

  /* ─── TIPOGRAFIA (fontes masculinas) ─── */
  --font-display: 'Bebas Neue', 'Impact', sans-serif;
  --font-body: 'Chakra Petch', 'Rajdhani', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  --t-2xs: 0.6875rem;
  --t-xs: 0.75rem;
  --t-sm: 0.875rem;
  --t-md: 1rem;
  --t-lg: 1.25rem;
  --t-xl: 1.5625rem;
  --t-2xl: 1.953rem;
  --t-3xl: 2.441rem;
  --t-hero: 4.25rem;

  --ls-display: 0.02em;
  --ls-body: -0.005em;
  --ls-mono: 0.15em;
  --ls-mono-wide: 0.28em;
  --ls-military: 0.35em;

  --s-1: 4px;  --s-2: 8px;   --s-3: 12px;  --s-4: 16px;
  --s-5: 20px; --s-6: 24px;  --s-8: 32px;  --s-10: 40px;
  --s-12: 48px; --s-16: 64px; --s-20: 80px; --s-24: 96px;

  --border-thin: 1.5px;
  --border-md: 2px;
  --border-strong: 3px;
  --border-heavy: 4px;

  --r-sm: 2px;
  --r-md: 4px;
  --r-lg: 6px;

  --ease-out: cubic-bezier(0, 0, 0.2, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1);
  --ease-both: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-military: cubic-bezier(0.16, 1, 0.3, 1);
  --d-fast: 150ms;
  --d-base: 250ms;
  --d-slow: 400ms;

  --container: 800px;
  --drawer-w: 440px;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  font-size: var(--t-md);
  line-height: 1.5;
  background: var(--surface-1);
  color: var(--ink-100);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  letter-spacing: var(--ls-body);
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 12%, rgba(255,32,32,0.055), transparent 55%),
    linear-gradient(180deg, rgba(3,3,3,0.94), rgba(3,3,3,0.98)),
    url('bg-delta11.png') center center / cover no-repeat;
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,32,32,0.010) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,32,32,0.010) 1px, transparent 1px);
  background-size: 120px 120px;
  pointer-events: none;
  z-index: 0;
}

/* PROGRESSO GERAL DA MISSÃO (bloco de destaque) */
.mission-progress {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: var(--s-8);
  padding: var(--s-6) var(--s-8);
  margin-bottom: var(--s-8);
  background: linear-gradient(180deg, rgba(0,0,0,0.6), rgba(0,0,0,0.35));
  border: var(--border-md) solid var(--line-2);
  border-left: var(--border-heavy) solid var(--brand);
  border-radius: 4px;
  animation: rise 500ms var(--ease-military) 60ms both;
}
.mp-num {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  min-width: 120px;
}
.mp-pct {
  font-family: var(--font-display);
  font-size: 4.5rem;
  font-weight: 400;
  color: var(--brand);
  line-height: 0.9;
  letter-spacing: var(--ls-display);
  text-shadow: 0 0 24px var(--brand-glow-soft);
}
.mp-label {
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 600;
  color: var(--ink-60);
  letter-spacing: var(--ls-military);
  text-transform: uppercase;
  margin-top: var(--s-2);
}
.mp-right {
  display: flex;
  flex-direction: column;
  gap: var(--s-3);
}
.mp-bar {
  height: 14px;
  background: var(--surface-3);
  border: var(--border-thin) solid var(--line-2);
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}
.mp-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--brand-deep), var(--brand), var(--brand-strong));
  transition: width var(--d-slow) var(--ease-military);
  box-shadow: 0 0 12px var(--brand-glow);
  position: relative;
}
.mp-bar-fill::after {
  content: '';
  position: absolute;
  right: -4px;
  top: -3px;
  bottom: -3px;
  width: 3px;
  background: var(--brand-strong);
  box-shadow: 0 0 8px var(--brand-glow);
}
.mp-meta {
  display: flex;
  gap: var(--s-4);
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 500;
  color: var(--ink-60);
  letter-spacing: var(--ls-mono);
  text-transform: uppercase;
  flex-wrap: wrap;
}
.mp-meta strong {
  color: var(--ink-100);
  font-weight: 700;
}
.mp-meta .m-done { color: var(--done); }
.mp-meta .m-live { color: var(--brand); }
.mp-meta .m-todo { color: var(--ink-80); }
@media (max-width: 720px) {
  .mission-progress { grid-template-columns: 1fr; gap: var(--s-4); }
  .mp-num { align-items: center; }
  .mp-pct { font-size: 3.5rem; }
}

.skip {
  position: absolute;
  top: -100px;
  left: var(--s-4);
  z-index: 999;
  padding: var(--s-3) var(--s-5);
  background: var(--brand);
  color: white;
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: var(--ls-mono);
  text-transform: uppercase;
  text-decoration: none;
  border-radius: 3px;
  transition: top var(--d-base) var(--ease-military);
}
.skip:focus { top: var(--s-4); }

:focus-visible {
  outline: var(--border-md) solid var(--brand-strong);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* CABEÇALHO */
.top {
  position: relative;
  z-index: 2;
  padding: var(--s-5) var(--s-8);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-6);
  border-bottom: var(--border-md) solid var(--line-2);
  background: linear-gradient(180deg, rgba(6,6,6,0.9), rgba(6,6,6,0.6));
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 600;
  letter-spacing: var(--ls-military);
  text-transform: uppercase;
  color: var(--ink-40);
}
.brand-mark {
  font-family: var(--font-display);
  font-size: 1.75rem;
  font-weight: 400;
  color: var(--brand);
  text-shadow: 0 0 22px var(--brand-glow-soft);
  line-height: 0.9;
  letter-spacing: 0.02em;
}
.brand-mark .num { color: var(--ink-80); }
.brand-divider {
  width: var(--border-md);
  height: 22px;
  background: linear-gradient(180deg, transparent, var(--brand), transparent);
  box-shadow: 0 0 6px var(--brand-glow-soft);
}

.pulso {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 500;
  letter-spacing: var(--ls-mono);
  color: var(--ink-40);
  text-transform: uppercase;
}
.pulso-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--done);
  box-shadow: 0 0 10px rgba(92,230,138,0.6);
  animation: dot-pulse 2s ease-in-out infinite;
}
.pulso[data-old="1"] .pulso-dot {
  background: var(--brand);
  box-shadow: 0 0 10px var(--brand-glow);
}
@keyframes dot-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

/* MAIN */
.main {
  position: relative;
  z-index: 1;
  max-width: var(--container);
  margin: 0 auto;
  padding: var(--s-10) var(--s-6) var(--s-24);
}

/* PROJETO */
.project {
  text-align: center;
  margin-bottom: var(--s-8);
  animation: rise 500ms var(--ease-military) both;
}
.project-tag {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 600;
  letter-spacing: var(--ls-military);
  text-transform: uppercase;
  color: var(--brand);
  text-shadow: 0 0 12px var(--brand-glow-soft);
  margin-bottom: var(--s-4);
  display: inline-flex;
  align-items: center;
  gap: var(--s-3);
}
.project-tag::before,
.project-tag::after {
  content: '';
  display: inline-block;
  width: 32px;
  height: var(--border-md);
  background: linear-gradient(90deg, transparent, var(--brand), transparent);
}
.project-name {
  font-family: var(--font-display);
  font-size: var(--t-hero);
  font-weight: 400;
  color: var(--ink-100);
  line-height: 0.95;
  letter-spacing: var(--ls-display);
  text-transform: uppercase;
}

/* SELO BINÁRIO */
.verdict {
  margin-bottom: var(--s-10);
  animation: rise 500ms var(--ease-military) 80ms both;
}

.verdict-card {
  position: relative;
  padding: var(--s-6) var(--s-8);
  background: linear-gradient(180deg, rgba(20,10,10,0.78), rgba(12,8,8,0.78));
  border: var(--border-md) solid;
  clip-path: polygon(
    0 0, calc(100% - 18px) 0, 100% 18px,
    100% 100%, 18px 100%, 0 calc(100% - 18px)
  );
  transition: all var(--d-base) var(--ease-military);
}
.verdict-card[data-state="ok"] {
  border-color: var(--done-line);
  background:
    linear-gradient(180deg, rgba(92,230,138,0.04), rgba(92,230,138,0.02)),
    linear-gradient(180deg, rgba(15,15,15,0.78), rgba(10,10,10,0.78));
}
.verdict-card[data-state="watch"] {
  border-color: var(--brand);
  background:
    linear-gradient(180deg, rgba(255,32,32,0.06), rgba(255,32,32,0.02)),
    linear-gradient(180deg, rgba(20,10,10,0.78), rgba(12,8,8,0.78));
  animation: watch-breath 2.6s ease-in-out infinite;
}
.verdict-card[data-state="critical"] {
  border-color: var(--brand-strong);
  background:
    linear-gradient(180deg, rgba(255,32,32,0.10), rgba(255,32,32,0.04)),
    linear-gradient(180deg, rgba(28,8,8,0.85), rgba(18,4,4,0.85));
  animation: critical-breath 1.2s ease-in-out infinite;
}
@keyframes watch-breath {
  0%, 100% { box-shadow: 0 0 0 0 var(--brand-glow-soft); }
  50% { box-shadow: 0 0 44px 0 var(--brand-glow-soft); }
}
@keyframes critical-breath {
  0%, 100% { box-shadow: 0 0 0 0 var(--brand-glow); }
  50% { box-shadow: 0 0 56px 0 var(--brand-glow-strong); }
}

.verdict-top {
  display: flex;
  align-items: center;
  gap: var(--s-4);
  margin-bottom: var(--s-4);
}
.verdict-icon-box {
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1;
  border: var(--border-md) solid;
  clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 7px 100%, 0 calc(100% - 7px));
  flex-shrink: 0;
}
.verdict-card[data-state="ok"] .verdict-icon-box {
  color: var(--done);
  border-color: var(--done-line);
  background: var(--done-soft);
  text-shadow: 0 0 12px rgba(92,230,138,0.6);
}
.verdict-card[data-state="watch"] .verdict-icon-box,
.verdict-card[data-state="critical"] .verdict-icon-box {
  color: var(--brand);
  border-color: var(--brand);
  background: var(--brand-wash);
  text-shadow: 0 0 14px var(--brand-glow);
}

.verdict-label {
  font-family: var(--font-body);
  font-size: var(--t-lg);
  font-weight: 700;
  letter-spacing: var(--ls-military);
  text-transform: uppercase;
  line-height: 1;
}
.verdict-card[data-state="ok"] .verdict-label {
  color: var(--done);
  text-shadow: 0 0 14px rgba(92,230,138,0.5);
}
.verdict-card[data-state="watch"] .verdict-label,
.verdict-card[data-state="critical"] .verdict-label {
  color: var(--brand);
  text-shadow: 0 0 16px var(--brand-glow);
}

.verdict-line {
  font-family: var(--font-body);
  font-size: var(--t-lg);
  font-weight: 400;
  color: var(--ink-80);
  line-height: 1.45;
  padding-left: calc(48px + var(--s-4));
}

/* TRANSMISSÃO CRONOS */
.transmission {
  position: relative;
  padding: var(--s-6) var(--s-8);
  margin-bottom: var(--s-10);
  background: linear-gradient(180deg, rgba(28,14,14,0.7), rgba(18,10,10,0.7));
  border: var(--border-thin) solid var(--line-2);
  animation: rise 500ms var(--ease-military) 160ms both;
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
}
.transmission::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: var(--border-heavy);
  background: var(--brand);
  box-shadow: 0 0 14px var(--brand-glow-soft);
}
.transmission-label {
  display: block;
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 700;
  letter-spacing: var(--ls-military);
  text-transform: uppercase;
  color: var(--brand);
  text-shadow: 0 0 10px var(--brand-glow-soft);
  margin-bottom: var(--s-4);
}
.transmission-text {
  font-family: var(--font-body);
  font-size: var(--t-xl);
  font-weight: 400;
  color: var(--ink-100);
  line-height: 1.5;
}
.transmission-sign {
  margin-top: var(--s-5);
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 500;
  color: var(--ink-40);
  letter-spacing: var(--ls-mono);
  text-transform: uppercase;
}
.transmission[data-state="empty"] {
  opacity: 0.55;
  padding: var(--s-4) var(--s-8);
}
.transmission[data-state="empty"]::before { background: var(--ink-20); box-shadow: none; }
.transmission[data-state="empty"] .transmission-label { color: var(--ink-40); text-shadow: none; }
.transmission[data-state="empty"] .transmission-text {
  font-size: var(--t-md);
  font-style: italic;
  color: var(--ink-40);
}

/* SECTION HEADER */
.section {
  margin-bottom: var(--s-10);
  animation: rise 500ms var(--ease-military) 240ms both;
}
.section-header {
  position: relative;
  display: flex;
  align-items: baseline;
  gap: var(--s-4);
  padding: var(--s-4) 0;
  margin-bottom: var(--s-5);
  border-top: var(--border-md) solid var(--line-2);
}
.section-header::before {
  content: '';
  position: absolute;
  top: calc(var(--border-md) * -1);
  left: 0;
  width: 56px;
  height: var(--border-strong);
  background: var(--brand);
  box-shadow: 0 0 10px var(--brand-glow-soft);
}
.section-arrow {
  color: var(--brand);
  font-family: var(--font-mono);
  font-size: var(--t-sm);
  line-height: 1;
  font-weight: 700;
}
.section-title {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: var(--ls-military);
  text-transform: uppercase;
  color: var(--ink-80);
}
.section-meta {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 500;
  color: var(--ink-40);
  letter-spacing: var(--ls-mono-wide);
  text-transform: uppercase;
}

/* GRADE DE OPERATIVOS */
.operatives {
  margin-bottom: var(--s-10);
  animation: rise 500ms var(--ease-military) 300ms both;
}
.op-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: var(--s-3);
  padding: var(--s-5);
  background: rgba(0,0,0,0.35);
  border: var(--border-thin) solid var(--line-1);
  border-radius: 6px;
}

.op-cell {
  position: relative;
  padding: var(--s-3);
  background: var(--surface-2);
  border: var(--border-md) solid var(--ink-20);
  border-radius: 4px;
  cursor: pointer;
  transition: all var(--d-fast) var(--ease-military);
  text-align: left;
  min-height: 88px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: var(--s-2);
}
.op-cell:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.op-cell:focus-visible { outline-offset: 2px; }

.op-cell[data-state="active"] {
  border-color: var(--brand);
  background: linear-gradient(180deg, rgba(255,32,32,0.10), rgba(255,32,32,0.03));
  box-shadow: 0 0 12px var(--brand-glow-soft);
  animation: op-active-pulse 2s ease-in-out infinite;
}
@keyframes op-active-pulse {
  0%, 100% { border-color: var(--brand); }
  50% { border-color: var(--brand-strong); box-shadow: 0 0 20px var(--brand-glow); }
}

.op-cell[data-state="stalled"] {
  border: var(--border-md) dashed var(--brand);
  background: linear-gradient(180deg, rgba(255,32,32,0.05), rgba(255,32,32,0.02));
  opacity: 0.85;
}
.op-cell[data-state="blocked"] {
  border-color: var(--brand-strong);
  background: linear-gradient(180deg, rgba(255,32,32,0.16), rgba(255,32,32,0.06));
  box-shadow: 0 0 20px var(--brand-glow-strong);
  animation: op-blocked-pulse 1.1s ease-in-out infinite;
}
@keyframes op-blocked-pulse {
  0%, 100% { border-color: var(--brand-strong); }
  50% { border-color: #ff5a5a; }
}
.op-cell[data-state="review"] {
  border-color: var(--brand-wine);
  background: linear-gradient(180deg, rgba(107,20,20,0.14), rgba(107,20,20,0.04));
}
.op-cell[data-state="done"] {
  border-color: var(--done-line);
  background: linear-gradient(180deg, rgba(92,230,138,0.06), rgba(92,230,138,0.02));
}
.op-cell[data-state="idle"] {
  border-color: var(--ink-20);
  opacity: 0.45;
}

.op-cell-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--s-2);
}
.op-cell-name {
  font-family: var(--font-body);
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: var(--ls-mono-wide);
  text-transform: uppercase;
  color: var(--ink-100);
  line-height: 1;
}
.op-cell[data-state="active"] .op-cell-name,
.op-cell[data-state="blocked"] .op-cell-name,
.op-cell[data-state="stalled"] .op-cell-name {
  color: var(--brand);
  text-shadow: 0 0 10px var(--brand-glow-soft);
}
.op-cell[data-state="done"] .op-cell-name { color: var(--done); }
.op-cell[data-state="idle"] .op-cell-name { color: var(--ink-60); }

.op-cell-role {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 500;
  color: var(--ink-40);
  letter-spacing: var(--ls-mono);
  text-transform: uppercase;
  margin-top: 2px;
}

.op-cell-pct {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 700;
  color: var(--ink-80);
  letter-spacing: 0;
}
.op-cell[data-state="active"] .op-cell-pct,
.op-cell[data-state="blocked"] .op-cell-pct { color: var(--brand); }
.op-cell[data-state="done"] .op-cell-pct { color: var(--done); }
.op-cell[data-state="idle"] .op-cell-pct { color: var(--ink-40); }

.op-cell-bar {
  height: var(--border-strong);
  background: var(--surface-3);
  overflow: hidden;
  position: relative;
}
.op-cell-bar-fill {
  height: 100%;
  background: var(--brand);
  box-shadow: 0 0 6px var(--brand-glow-soft);
  transition: width var(--d-slow) var(--ease-military);
}
.op-cell[data-state="done"] .op-cell-bar-fill {
  background: var(--done);
  box-shadow: 0 0 6px rgba(92,230,138,0.5);
}
.op-cell[data-state="idle"] .op-cell-bar-fill {
  background: var(--ink-40);
  box-shadow: none;
}

.op-cell-meta {
  display: flex;
  gap: var(--s-2);
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--ink-40);
  letter-spacing: var(--ls-mono);
  text-transform: uppercase;
  flex-wrap: wrap;
}
.op-cell-meta span[data-live="1"] { color: var(--brand); font-weight: 700; }
.op-cell-meta span[data-done="1"] { color: var(--done); }

.op-cell-badge {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--brand);
  box-shadow: 0 0 8px var(--brand-glow);
  animation: dot-pulse 1.4s ease-in-out infinite;
}
.op-cell[data-state="idle"] .op-cell-badge,
.op-cell[data-state="done"] .op-cell-badge { display: none; }
.op-cell[data-state="blocked"] .op-cell-badge {
  background: var(--brand-strong);
  animation: dot-pulse 0.7s ease-in-out infinite;
}

/* TRILHA DE ONDAS */
.wave-track {
  padding: var(--s-5) var(--s-6);
  margin-bottom: var(--s-6);
  background: rgba(255,255,255,0.018);
  border: var(--border-thin) solid var(--line-1);
  border-radius: 6px;
}
.wave-line {
  display: flex;
  align-items: center;
  gap: var(--s-3);
}
.wave-node {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  flex-shrink: 0;
}
.wave-square {
  width: 14px;
  height: 14px;
  background: transparent;
  border: var(--border-md) solid var(--ink-20);
  transform: rotate(45deg);
  transition: all var(--d-base) var(--ease-military);
  flex-shrink: 0;
}
.wave-square[data-state="done"] {
  background: var(--done);
  border-color: var(--done);
  box-shadow: 0 0 12px rgba(92,230,138,0.5);
}
.wave-square[data-state="current"] {
  background: var(--brand);
  border-color: var(--brand);
  box-shadow: 0 0 16px var(--brand-glow);
  animation: current-pulse 1.6s ease-in-out infinite;
}
.wave-connector {
  flex: 1;
  height: var(--border-md);
  background: var(--ink-20);
  transition: background var(--d-base) var(--ease-military);
}
.wave-connector[data-state="done"] {
  background: linear-gradient(90deg, var(--done) 0%, var(--brand) 100%);
  box-shadow: 0 0 4px var(--brand-glow-soft);
}
.wave-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  color: var(--ink-40);
  letter-spacing: var(--ls-mono);
  text-transform: uppercase;
  white-space: nowrap;
}
.wave-label[data-state="current"] {
  color: var(--brand);
  font-weight: 700;
}
.wave-label[data-state="done"] { color: var(--done); }
@keyframes current-pulse {
  0%, 100% { transform: rotate(45deg) scale(1); box-shadow: 0 0 16px var(--brand-glow); }
  50% { transform: rotate(45deg) scale(1.3); box-shadow: 0 0 24px var(--brand-glow-strong); }
}

/* LINHAS DE OPERAÇÃO */
.ops {
  display: flex;
  flex-direction: column;
}
.op-line {
  display: grid;
  grid-template-columns: 32px 110px 1fr auto;
  gap: var(--s-4);
  align-items: baseline;
  padding: var(--s-4) var(--s-3);
  border-bottom: var(--border-thin) solid var(--line-1);
  transition: background var(--d-fast) var(--ease-out);
  position: relative;
}
.op-line:last-child { border-bottom: none; }
.op-line:hover { background: rgba(255,32,32,0.03); }
.op-line[data-state="stalled"] {
  background: rgba(255,32,32,0.04);
  border-left: var(--border-md) dashed var(--brand);
  padding-left: var(--s-3);
}
.op-line[data-state="blocked"] {
  background: var(--brand-wash-strong);
  border-left: var(--border-strong) solid var(--brand-strong);
  padding-left: var(--s-4);
  animation: block-breath 2s ease-in-out infinite;
}

.op-num {
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 500;
  color: var(--ink-20);
  letter-spacing: var(--ls-mono);
}
.op-agent {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: var(--ls-mono-wide);
  text-transform: uppercase;
  color: var(--brand);
  text-shadow: 0 0 8px var(--brand-glow-soft);
}
.op-line[data-state="stalled"] .op-agent {
  color: var(--brand);
  opacity: 0.85;
}
.op-line[data-state="blocked"] .op-agent {
  color: var(--brand-strong);
  text-shadow: 0 0 12px var(--brand-glow);
}
.op-line[data-state="review"] .op-agent {
  color: var(--ink-60);
  text-shadow: none;
}
.op-marker {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brand);
  box-shadow: 0 0 8px var(--brand-glow);
  animation: dot-pulse 2s ease-in-out infinite;
  flex-shrink: 0;
}
.op-line[data-state="stalled"] .op-marker {
  background: var(--brand);
  box-shadow: 0 0 6px var(--brand-glow-soft);
  animation: dot-pulse 3s ease-in-out infinite;
  opacity: 0.7;
}
.op-line[data-state="blocked"] .op-marker {
  background: var(--brand-strong);
  box-shadow: 0 0 12px var(--brand-glow);
  animation: dot-pulse 0.8s ease-in-out infinite;
}
.op-line[data-state="review"] .op-marker {
  background: var(--ink-60);
  box-shadow: none;
  animation: none;
}

.op-action {
  font-family: var(--font-body);
  font-size: var(--t-md);
  font-weight: 500;
  color: var(--ink-100);
  line-height: 1.4;
}
.op-time {
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 500;
  color: var(--ink-40);
  letter-spacing: var(--ls-mono);
  text-transform: uppercase;
  white-space: nowrap;
}
.op-line[data-state="stalled"] .op-time {
  color: var(--brand);
  font-weight: 700;
}
.op-line[data-state="blocked"] .op-time {
  color: var(--brand-strong);
  font-weight: 700;
}

.op-blocked-reason {
  grid-column: 2 / 5;
  font-family: var(--font-body);
  font-size: var(--t-sm);
  font-weight: 400;
  color: var(--brand);
  font-style: italic;
  margin-top: var(--s-2);
  padding-top: var(--s-2);
  border-top: var(--border-thin) solid rgba(255,32,32,0.20);
}

@keyframes block-breath {
  0%, 100% { box-shadow: inset 0 0 0 0 rgba(0,0,0,0); }
  50% { box-shadow: inset 0 0 32px var(--brand-wash-strong); }
}

.ops-empty {
  padding: var(--s-6);
  text-align: center;
  font-family: var(--font-body);
  font-size: var(--t-md);
  color: var(--ink-40);
  font-style: italic;
}

/* OPERAÇÕES CONCLUÍDAS */
.history {
  margin-bottom: var(--s-8);
  animation: rise 500ms var(--ease-military) 380ms both;
}
.history-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-4);
  width: 100%;
  padding: var(--s-4) var(--s-5);
  background: transparent;
  border: var(--border-md) solid var(--line-2);
  color: var(--ink-60);
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 600;
  letter-spacing: var(--ls-military);
  text-transform: uppercase;
  cursor: pointer;
  transition: all var(--d-fast) var(--ease-military);
  text-align: left;
  min-height: 46px;
  border-radius: 4px;
}
.history-toggle:hover {
  background: var(--done-soft);
  border-color: var(--done-line);
  color: var(--done);
}
.history-toggle .count { color: var(--done); font-weight: 700; }
.history-toggle .chevron { transition: transform var(--d-base) var(--ease-military); }
.history-toggle[aria-expanded="true"] .chevron { transform: rotate(180deg); }

.history-content {
  display: none;
  margin-top: var(--s-3);
  max-height: 480px;
  overflow-y: auto;
  padding-right: var(--s-2);
}
.history-content[data-open="1"] {
  display: block;
  animation: rise 300ms var(--ease-out) both;
}
.history-item {
  display: grid;
  grid-template-columns: 20px 1fr auto;
  gap: var(--s-3);
  align-items: baseline;
  padding: var(--s-3) var(--s-4);
  border-bottom: var(--border-thin) solid var(--line-1);
  font-family: var(--font-body);
  font-size: var(--t-sm);
  color: var(--ink-60);
}
.history-item:last-child { border-bottom: none; }
.history-item .check {
  color: var(--done);
  font-weight: 700;
  line-height: 1;
}
.history-item .who {
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 500;
  color: var(--ink-40);
  letter-spacing: var(--ls-mono);
  text-transform: uppercase;
}

/* DADOS TÉCNICOS */
.engineer {
  padding-top: var(--s-8);
  border-top: var(--border-md) solid var(--line-1);
  animation: rise 500ms var(--ease-military) 460ms both;
}
.engineer-toggle {
  display: block;
  width: 100%;
  padding: var(--s-3) var(--s-4);
  background: transparent;
  border: none;
  color: var(--ink-40);
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 500;
  letter-spacing: var(--ls-military);
  text-transform: uppercase;
  cursor: pointer;
  text-align: center;
  transition: color var(--d-fast) var(--ease-military);
  min-height: 44px;
}
.engineer-toggle:hover { color: var(--ink-80); }
.engineer-content {
  display: none;
  margin-top: var(--s-4);
  background: var(--surface-0);
  border: var(--border-thin) solid var(--line-1);
  padding: var(--s-5);
  border-radius: 4px;
}
.engineer-content[data-open="1"] {
  display: block;
  animation: rise 300ms var(--ease-out) both;
}
.engineer-title {
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 600;
  color: var(--ink-40);
  letter-spacing: var(--ls-military);
  text-transform: uppercase;
  margin-bottom: var(--s-4);
  display: flex;
  justify-content: space-between;
}
.engineer-row {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  color: var(--ink-60);
  padding: var(--s-2) 0;
  border-bottom: var(--border-thin) solid var(--line-1);
  word-break: break-all;
  line-height: 1.6;
}
.engineer-row .key { color: var(--brand); font-weight: 700; }
.engineer-row .val { color: var(--ink-80); }

/* FAB */
.fab {
  position: fixed;
  right: var(--s-6);
  bottom: var(--s-6);
  z-index: 90;
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-3) var(--s-5);
  background: var(--surface-3);
  border: var(--border-md) solid var(--brand);
  color: var(--ink-100);
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: var(--ls-military);
  text-transform: uppercase;
  cursor: pointer;
  transition: all var(--d-fast) var(--ease-military);
  border-radius: 6px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.5), 0 0 20px var(--brand-glow-soft);
  min-height: 48px;
}
.fab:hover {
  background: var(--brand);
  transform: translateY(-2px);
  box-shadow: 0 10px 32px rgba(0,0,0,0.6), 0 0 28px var(--brand-glow);
}
.fab-icon {
  display: inline-flex;
  flex-direction: column;
  gap: 3px;
}
.fab-icon span {
  display: block;
  width: 16px;
  height: 2px;
  background: var(--brand);
  transition: background var(--d-fast);
}
.fab:hover .fab-icon span { background: white; }
.fab-kbd {
  padding: 2px 5px;
  background: var(--surface-0);
  border: 1px solid var(--line-2);
  color: var(--ink-60);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0;
}
.fab:hover .fab-kbd { color: white; border-color: white; }

/* DRAWER */
.backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--d-slow) var(--ease-military);
  z-index: 95;
}
.backdrop[data-open="1"] { opacity: 1; pointer-events: auto; }

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  height: 100vh;
  width: var(--drawer-w);
  max-width: 100vw;
  background: linear-gradient(180deg, rgba(4,4,4,0.98), rgba(2,2,2,0.98));
  border-left: var(--border-strong) solid var(--brand);
  box-shadow: -12px 0 40px rgba(0,0,0,0.6);
  transform: translateX(100%);
  transition: transform var(--d-slow) var(--ease-military);
  z-index: 100;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.drawer[data-open="1"] { transform: translateX(0); }

.drawer-header {
  padding: var(--s-6) var(--s-6) var(--s-4);
  border-bottom: var(--border-md) solid var(--line-2);
  background: linear-gradient(180deg, rgba(20,10,10,0.5), transparent);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s-4);
  flex-shrink: 0;
  position: relative;
}
.drawer-header::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 80px;
  height: var(--border-strong);
  background: var(--brand);
  box-shadow: 0 0 12px var(--brand-glow-soft);
}
.drawer-title {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 400;
  color: var(--ink-100);
  letter-spacing: var(--ls-display);
  text-transform: uppercase;
  line-height: 1;
}
.drawer-close {
  width: 36px;
  height: 36px;
  background: transparent;
  border: var(--border-md) solid var(--line-2);
  color: var(--ink-60);
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--d-fast) var(--ease-military);
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.drawer-close:hover {
  border-color: var(--brand);
  color: var(--brand);
  background: var(--brand-wash);
}

.drawer-summary {
  padding: var(--s-3) var(--s-6);
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 500;
  color: var(--ink-40);
  letter-spacing: var(--ls-mono);
  text-transform: uppercase;
  border-bottom: var(--border-thin) solid var(--line-1);
  flex-shrink: 0;
}

.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: var(--s-4) var(--s-4) var(--s-8);
}

.drawer-agent {
  margin-bottom: var(--s-3);
  border: var(--border-md) solid var(--line-1);
  background: rgba(255,255,255,0.02);
  transition: all var(--d-fast) var(--ease-military);
  border-radius: 4px;
  overflow: hidden;
}
.drawer-agent[data-state="active"] {
  border-color: var(--brand);
  background: rgba(255,32,32,0.06);
}
.drawer-agent[data-state="blocked"] {
  border-color: var(--brand-strong);
  background: rgba(255,32,32,0.12);
}
.drawer-agent[data-state="stalled"] { border: var(--border-md) dashed var(--brand); }
.drawer-agent[data-state="done"] { border-color: var(--done-line); }
.drawer-agent[data-state="idle"] { opacity: 0.6; }

.drawer-agent-head {
  display: block;
  width: 100%;
  padding: var(--s-4) var(--s-10) var(--s-4) var(--s-4);
  background: transparent;
  border: none;
  cursor: pointer;
  text-align: left;
  color: inherit;
  font: inherit;
  transition: background var(--d-fast) var(--ease-military);
  position: relative;
}
.drawer-agent-head:hover { background: rgba(255,255,255,0.04); }
.drawer-agent-head[aria-expanded="true"] { background: rgba(255,255,255,0.04); }

.drawer-agent-chevron {
  position: absolute;
  right: var(--s-5);
  top: 50%;
  transform: translateY(-50%);
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  color: var(--ink-60);
  transition: transform var(--d-base) var(--ease-military), color var(--d-fast);
  line-height: 1;
  pointer-events: none;
  opacity: 0.9;
}
.drawer-agent-head:hover .drawer-agent-chevron {
  color: var(--brand);
  opacity: 1;
  transform: translateY(-50%) translateX(3px);
}
.drawer-agent-head[aria-expanded="true"] .drawer-agent-chevron {
  transform: translateY(-50%) rotate(90deg);
  color: var(--brand);
  opacity: 1;
}
.drawer-agent-head:hover[aria-expanded="true"] .drawer-agent-chevron {
  transform: translateY(-50%) rotate(90deg) translateY(-3px);
}
.drawer-agent[data-state="done"] .drawer-agent-chevron { color: var(--done); }
.drawer-agent[data-state="done"] .drawer-agent-head:hover .drawer-agent-chevron { color: var(--done); }

.drawer-agent-line-1 {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s-3);
  margin-bottom: var(--s-2);
}
.drawer-agent-nome {
  font-family: var(--font-body);
  font-size: var(--t-md);
  font-weight: 700;
  letter-spacing: var(--ls-mono-wide);
  text-transform: uppercase;
  color: var(--ink-100);
}
.drawer-agent[data-state="active"] .drawer-agent-nome,
.drawer-agent[data-state="blocked"] .drawer-agent-nome,
.drawer-agent[data-state="stalled"] .drawer-agent-nome {
  color: var(--brand);
}
.drawer-agent[data-state="done"] .drawer-agent-nome { color: var(--done); }
.drawer-agent[data-state="idle"] .drawer-agent-nome { color: var(--ink-60); }

.drawer-agent-role {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  color: var(--ink-40);
  letter-spacing: var(--ls-mono);
  text-transform: uppercase;
}
.drawer-agent-pct {
  font-family: var(--font-mono);
  font-size: var(--t-sm);
  font-weight: 700;
  color: var(--ink-80);
}
.drawer-agent[data-state="active"] .drawer-agent-pct,
.drawer-agent[data-state="blocked"] .drawer-agent-pct { color: var(--brand); }
.drawer-agent[data-state="done"] .drawer-agent-pct { color: var(--done); }
.drawer-agent[data-state="idle"] .drawer-agent-pct { color: var(--ink-40); }

.drawer-agent-bar {
  height: var(--border-strong);
  background: var(--surface-3);
  margin-bottom: var(--s-3);
  position: relative;
  overflow: hidden;
}
.drawer-agent-bar-fill {
  height: 100%;
  background: var(--brand);
  transition: width var(--d-slow) var(--ease-military);
  box-shadow: 0 0 6px var(--brand-glow-soft);
}
.drawer-agent[data-state="done"] .drawer-agent-bar-fill {
  background: var(--done);
  box-shadow: 0 0 6px rgba(92,230,138,0.5);
}
.drawer-agent[data-state="idle"] .drawer-agent-bar-fill {
  background: var(--ink-40);
  box-shadow: none;
}

.drawer-agent-meta {
  display: flex;
  gap: var(--s-3);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  color: var(--ink-40);
  letter-spacing: var(--ls-mono);
  text-transform: uppercase;
  flex-wrap: wrap;
}
.drawer-agent-meta .m-live { color: var(--brand); font-weight: 700; }
.drawer-agent-meta .m-done { color: var(--done); }
.drawer-agent-meta .m-todo { color: var(--ink-60); }

.drawer-agent-tasks {
  display: none;
  padding: 0 var(--s-4) var(--s-4);
  border-top: var(--border-thin) solid var(--line-1);
  animation: rise 300ms var(--ease-out) both;
}
.drawer-agent-tasks[data-open="1"] { display: block; }

.drawer-task-group { padding-top: var(--s-4); }
.drawer-task-item {
  display: grid;
  grid-template-columns: 16px 1fr auto;
  gap: var(--s-2);
  padding: var(--s-2) 0;
  font-family: var(--font-body);
  font-size: var(--t-sm);
  color: var(--ink-80);
  border-bottom: var(--border-thin) solid var(--line-1);
  align-items: baseline;
}
.drawer-task-item:last-child { border-bottom: none; }
.drawer-task-icon {
  color: var(--ink-40);
  font-family: var(--font-mono);
  font-weight: 700;
  line-height: 1;
}
.drawer-task-item[data-tipo="fazendo"] .drawer-task-icon {
  color: var(--brand);
  animation: dot-pulse 2s ease-in-out infinite;
}
.drawer-task-item[data-tipo="bloqueado"] .drawer-task-icon { color: var(--brand-strong); }
.drawer-task-item[data-tipo="revisao"] .drawer-task-icon { color: var(--ink-60); }
.drawer-task-item[data-tipo="concluido"] .drawer-task-icon { color: var(--done); }
.drawer-task-item[data-tipo="a_fazer"] .drawer-task-icon { color: var(--ink-40); }
.drawer-task-meta {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--ink-40);
  letter-spacing: var(--ls-mono);
  text-transform: uppercase;
}

/* ESTADO VAZIO */
.empty {
  min-height: calc(100vh - 200px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--s-10);
}
.empty-icon {
  font-family: var(--font-display);
  font-size: 8rem;
  font-weight: 400;
  color: var(--brand);
  opacity: 0.12;
  line-height: 1;
  margin-bottom: var(--s-6);
}
.empty-title {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: var(--ls-military);
  text-transform: uppercase;
  color: var(--ink-40);
  margin-bottom: var(--s-4);
}
.empty-desc {
  font-family: var(--font-body);
  font-size: var(--t-md);
  color: var(--ink-60);
  max-width: 400px;
  line-height: 1.6;
  margin-bottom: var(--s-6);
}
.empty-code {
  display: inline-block;
  padding: var(--s-3) var(--s-6);
  background: var(--surface-3);
  border: var(--border-md) solid var(--line-2);
  font-family: var(--font-mono);
  font-size: var(--t-sm);
  color: var(--brand);
  letter-spacing: var(--ls-mono);
  border-radius: 4px;
}

/* SKELETON */
.skel {
  animation: skel-pulse 1.5s ease-in-out infinite;
  background: linear-gradient(90deg,
    var(--surface-2) 25%,
    var(--surface-3) 50%,
    var(--surface-2) 75%);
  background-size: 200% 100%;
  border-radius: var(--r-sm);
}
.skel-h1 { height: 68px; width: 60%; margin: 0 auto var(--s-4); }
.skel-tag { height: 12px; width: 200px; margin: 0 auto var(--s-4); }
.skel-verdict { height: 130px; margin-bottom: var(--s-10); }
.skel-block { height: 80px; margin-bottom: var(--s-6); }
@keyframes skel-pulse {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--brand-wine); }
::-webkit-scrollbar-thumb:hover { background: var(--brand); }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

@media (max-width: 720px) {
  .top { padding: var(--s-4); flex-wrap: wrap; }
  .main { padding: var(--s-6) var(--s-4) var(--s-16); }
  .project-name { font-size: 2.5rem; }
  .verdict-card { padding: var(--s-5); }
  .verdict-icon-box { width: 40px; height: 40px; font-size: 1.4rem; }
  .verdict-label { font-size: var(--t-md); }
  .verdict-line { padding-left: 0; margin-top: var(--s-3); font-size: var(--t-md); }
  .verdict-top { flex-wrap: wrap; }
  .transmission-text { font-size: var(--t-lg); }
  .op-line { grid-template-columns: 24px 84px 1fr auto; gap: var(--s-2); }
  .wave-label { font-size: 9px; }
  .op-grid { grid-template-columns: repeat(2, 1fr); }
  .drawer { width: 100vw; border-left: none; }
  .fab { right: var(--s-4); bottom: var(--s-4); }
}
</style>
</head>
<body>

<a href="#main" class="skip">Pular para o painel</a>

<header class="top" role="banner">
  <div class="brand" aria-label="Formação Delta-11">
    <span class="brand-mark">Δ<span class="num">-11</span></span>
    <span class="brand-divider" aria-hidden="true"></span>
    Centro de comando
  </div>
  <div class="pulso" id="pulso" aria-label="Última sincronização">
    <span class="pulso-dot" aria-hidden="true"></span>
    <span id="pulso-text">—</span>
  </div>
</header>

<main id="main" class="main">
  <div class="skel skel-tag"></div>
  <div class="skel skel-h1"></div>
  <div class="skel skel-verdict"></div>
  <div class="skel skel-block"></div>
</main>

<button class="fab" type="button" aria-label="Abrir sala de operativos" onclick="openDrawer()" id="fab">
  <span class="fab-icon" aria-hidden="true"><span></span><span></span><span></span></span>
  <span>Operativos</span>
  <span class="fab-kbd">O</span>
</button>

<div class="backdrop" id="backdrop" onclick="closeDrawer()" aria-hidden="true"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
  <header class="drawer-header">
    <h2 class="drawer-title" id="drawer-title">SALA DE OPERATIVOS</h2>
    <button class="drawer-close" type="button" onclick="closeDrawer()" aria-label="Fechar">×</button>
  </header>
  <div class="drawer-summary" id="drawer-summary">Carregando...</div>
  <div class="drawer-body" id="drawer-body">Carregando...</div>
</aside>

<script src="kanban-data.js"></script>
<script>
const AGENTES = ['ATLAS','CRONOS','FRONT','PIXEL','FORM','BACK','ENGINE','VAULT','SHIELD','SCOUT'];
const AGENT_ROLES = {
  ATLAS: 'Arquiteto', CRONOS: 'Gerente', FRONT: 'Interface',
  PIXEL: 'Visual', FORM: 'Formulários', BACK: 'Servidor',
  ENGINE: 'Motor', VAULT: 'Banco', SHIELD: 'Qualidade', SCOUT: 'Diagnóstico'
};
const HB_STALE_MIN = 5;
const TASK_OLD_MIN = 30;
const PULSE_STALE_S = 30;
const REFRESH_MS = 5000;

function parseTS(iso) { if (!iso) return null; const d = new Date(iso); return isNaN(d) ? null : d; }
function tempoRel(iso) {
  const d = parseTS(iso); if (!d) return null;
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 30) return 'agora';
  if (s < 60) return `há ${s}s`;
  const m = Math.floor(s / 60); if (m < 60) return `há ${m} min`;
  const h = Math.floor(m / 60); if (h < 24) return `há ${h}h`;
  return `há ${Math.floor(h / 24)}d`;
}
function minSince(iso) { const d = parseTS(iso); if (!d) return null; return Math.floor((Date.now() - d.getTime()) / 60000); }

const PADROES = [
  { re: /\[IMPACTO-MUDANCA\]/i, fala: 'Fazendo uma mudança de impacto' },
  { re: /migration|migração|migrations/i, fala: 'Mexendo no banco de dados' },
  { re: /webhook/i, fala: 'Configurando integração externa' },
  { re: /rota|route|api\//i, fala: 'Criando rota do servidor' },
  { re: /contract test|contract-tester/i, fala: 'Testando contratos' },
  { re: /tabela|table|schema/i, fala: 'Trabalhando na estrutura do banco' },
  { re: /componente|component|tela|page\.tsx/i, fala: 'Construindo uma tela' },
  { re: /formulário|formulario|form|validation/i, fala: 'Fazendo formulário' },
  { re: /auth|autenticação|login/i, fala: 'Trabalhando na autenticação' },
  { re: /orquestrar|orquestração/i, fala: 'Coordenando os agentes' },
  { re: /merge|revisão/i, fala: 'Consolidando trabalho' },
  { re: /bug|error|erro|corrigir/i, fala: 'Corrigindo um problema' },
  { re: /teste|test|spec/i, fala: 'Testando o sistema' }
];
function traduzir(t) {
  if (t.resumo_humano) return t.resumo_humano;
  const texto = (t.desc || '').toString();
  for (const p of PADROES) if (p.re.test(texto)) return p.fala;
  const clean = texto.replace(/\[[^\]]+\]/g, '').replace(/`[^`]+`/g, '').replace(/T-[A-Z0-9-]+/gi, '').replace(/\s+/g, ' ').trim();
  const dot = clean.indexOf('.');
  return (dot > 0 && dot < 80 ? clean.substring(0, dot) : clean.substring(0, 80)).trim() || 'Trabalhando';
}
function esc(str) {
  if (str == null) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function agentProgress(agente, data) {
  const todo = ((data.a_fazer || {})[agente] || []).length;
  const doing = (data.fazendo || []).filter(t => t.agente === agente).length;
  const rev = (data.revisao || []).filter(t => (t.por || t.agente) === agente).length;
  const done = (data.concluido || []).filter(t => (t.por || t.agente) === agente).length;
  const blocked = (data.bloqueado || []).filter(t => t.agente === agente).length;
  const total = todo + doing + rev + done + blocked;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  return { todo, doing, rev, done, blocked, total, pct };
}

function agentState(agente, data, prog) {
  if (prog.blocked > 0) return 'blocked';
  const hb = (data.heartbeats || []).find(h => h.agente === agente);
  if (prog.doing > 0) {
    if (hb) {
      const m = minSince(hb.ultima_atividade);
      if (m !== null && m > HB_STALE_MIN) return 'stalled';
    }
    return 'active';
  }
  if (prog.rev > 0) return 'review';
  if (prog.total > 0 && prog.pct === 100) return 'done';
  return 'idle';
}

function verdictOf(data) {
  if (!data) return { state: 'ok', icon: '●', text: 'AGUARDANDO', line: 'Nenhuma missão em execução.' };
  const blocked = data.bloqueado || [];
  const doing = data.fazendo || [];
  const hbs = data.heartbeats || [];
  if (blocked.length > 0) {
    return { state: 'critical', icon: '⚠', text: blocked.length > 1 ? `${blocked.length} TRAVADOS` : `${blocked.length} TRAVADO`,
      line: `${blocked.length > 1 ? 'Agentes' : 'Um agente'} precisa da sua decisão para destravar.` };
  }
  for (const t of doing) {
    const hb = hbs.find(h => h.agente === t.agente);
    if (hb) {
      const m = minSince(hb.ultima_atividade);
      if (m !== null && m > HB_STALE_MIN) {
        return { state: 'watch', icon: '!', text: 'AGENTE SEM SINAL',
          line: `${t.agente} não dá sinal há ${m} minutos. Verifique se travou.` };
      }
    }
  }
  for (const t of doing) {
    const m = minSince(t.inicio);
    if (m !== null && m > TASK_OLD_MIN) {
      return { state: 'watch', icon: '!', text: 'TAREFA DEMORANDO',
        line: `Uma tarefa está aberta há mais de ${TASK_OLD_MIN} minutos. Talvez precise de você.` };
    }
  }
  if (data.mensagem_cronos && data.mensagem_cronos.precisa_comandante) {
    return { state: 'watch', icon: '!', text: 'PRECISA DE VOCÊ', line: data.mensagem_cronos.precisa_comandante };
  }
  if (doing.length > 0) {
    const nomes = doing.map(t => t.agente).filter(Boolean);
    const q = nomes.length;
    return { state: 'ok', icon: '●', text: 'SEGURO FECHAR',
      line: q === 1 ? `${nomes[0]} está no comando. Nada requer você agora.` : `${q} agentes coordenados. Nada requer você agora.` };
  }
  return { state: 'ok', icon: '●', text: 'DESCANSANDO', line: 'Todos os agentes concluíram suas tarefas.' };
}

function progressOf(data) {
  if (!data) return { done: 0, total: 0, pct: 0 };
  const done = (data.concluido || []).length;
  let todo = 0;
  Object.values(data.a_fazer || {}).forEach(a => todo += a.length);
  const doing = (data.fazendo || []).length;
  const rev = (data.revisao || []).length;
  const bl = (data.bloqueado || []).length;
  const total = done + todo + doing + rev + bl;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  return { done, total, pct, todo, doing, rev };
}
function wavesOf(data) {
  const fc = (data && data.fase_atual) || '';
  const s = fc.toString();
  const m1 = s.match(/onda\s*(\d+)\s*de\s*(\d+)/i);
  if (m1) return { curr: parseInt(m1[1]), total: parseInt(m1[2]) };
  const m2 = s.match(/onda\s*(\d+)/i);
  if (m2) { if (data && data.total_ondas) return { curr: parseInt(m2[1]), total: parseInt(data.total_ondas) }; return { curr: parseInt(m2[1]), total: null }; }
  return null;
}
function faseTag(fc) {
  if (!fc) return 'AGUARDANDO';
  const s = fc.toString();
  const c = s.match(/ciclo\s*([A-Z0-9]+)/i);
  const o = s.match(/onda\s*(\d+)/i);
  const f = s.match(/fase\s*(\d+)/i);
  if (c && o) return `CICLO ${c[1].toUpperCase()} · ONDA ${o[1]}`;
  if (o) return `ONDA ${o[1]}`;
  if (c) return `CICLO ${c[1].toUpperCase()}`;
  if (f) return `FASE ${f[1]}`;
  return s.substring(0, 40).toUpperCase();
}

function renderEmpty() {
  return `
    <div class="empty">
      <div class="empty-icon" aria-hidden="true">Δ</div>
      <div class="empty-title">Aguardando missão</div>
      <p class="empty-desc">Nenhum projeto ativo. Abra o Claude Code e inicie com:</p>
      <div class="empty-code">d11 + descrição do projeto</div>
    </div>
  `;
}

function renderWaveTrack(waves) {
  if (!waves) return '';
  if (!waves.total) {
    return `<div class="wave-track"><div class="wave-line"><div class="wave-node"><span class="wave-square" data-state="current" aria-hidden="true"></span><span class="wave-label" data-state="current">Onda ${esc(waves.curr)}</span></div></div></div>`;
  }
  let nodes = '';
  for (let i = 1; i <= waves.total; i++) {
    let state = '';
    if (i < waves.curr) state = 'done'; else if (i === waves.curr) state = 'current';
    const lbl = state === 'done' ? 'concluída' : state === 'current' ? 'em execução' : 'pendente';
    nodes += `<div class="wave-node"><span class="wave-square" data-state="${state}" aria-hidden="true"></span><span class="wave-label" data-state="${state}">Onda ${i} · ${lbl}</span></div>`;
    if (i < waves.total) { const cs = i < waves.curr ? 'done' : ''; nodes += `<span class="wave-connector" data-state="${cs}" aria-hidden="true"></span>`; }
  }
  return `<div class="wave-track" role="progressbar" aria-valuenow="${waves.curr}" aria-valuemin="1" aria-valuemax="${waves.total}"><div class="wave-line">${nodes}</div></div>`;
}

function renderOperatives(data) {
  const cells = AGENTES.map(a => {
    const prog = agentProgress(a, data);
    const state = agentState(a, data, prog);
    const meta = [];
    if (prog.doing > 0) meta.push(`<span data-live="1">${prog.doing}▸</span>`);
    if (prog.rev > 0) meta.push(`<span>${prog.rev}◇</span>`);
    if (prog.done > 0) meta.push(`<span data-done="1">${prog.done}✓</span>`);
    if (meta.length === 0 && prog.todo > 0) meta.push(`<span>${prog.todo}○</span>`);
    if (meta.length === 0) meta.push(`<span>—</span>`);

    return `
      <button class="op-cell" data-state="${state}" data-agente="${a}"
              onclick="openDrawer('${a}')"
              aria-label="Operativo ${a}, ${prog.pct}% concluído, ${prog.doing} em execução">
        ${state === 'active' || state === 'blocked' ? '<span class="op-cell-badge" aria-hidden="true"></span>' : ''}
        <div class="op-cell-top">
          <div>
            <div class="op-cell-name">${a}</div>
            <div class="op-cell-role">${esc(AGENT_ROLES[a] || '')}</div>
          </div>
          <div class="op-cell-pct">${prog.total > 0 ? prog.pct + '%' : '—'}</div>
        </div>
        <div class="op-cell-bar" aria-hidden="true"><div class="op-cell-bar-fill" style="width: ${prog.pct}%"></div></div>
        <div class="op-cell-meta">${meta.join('')}</div>
      </button>
    `;
  }).join('');

  return `
    <section class="operatives" aria-labelledby="op-lbl">
      <div class="section-header">
        <span class="section-arrow" aria-hidden="true">▸</span>
        <span id="op-lbl" class="section-title">Progresso por operativo</span>
        <span class="section-meta">clique para detalhes</span>
      </div>
      <div class="op-grid" role="list">${cells}</div>
    </section>
  `;
}

function renderOpLine(t, hbs, index, forcedState) {
  const agent = t.agente || t.por || '?';
  const state = forcedState || (function() {
    const hb = hbs.find(h => h.agente === agent);
    if (!hb) return 'active';
    const m = minSince(hb.ultima_atividade);
    if (m !== null && m > HB_STALE_MIN) return 'stalled';
    return 'active';
  })();
  const hb = hbs.find(h => h.agente === agent);
  const tempo = tempoRel(hb ? hb.ultima_atividade : t.inicio) || '—';
  const acao = traduzir(t);
  const motivo = t.motivo ? `<div class="op-blocked-reason">⚠ ${esc(t.motivo)}</div>` : '';
  const num = String(index + 1).padStart(2, '0');
  return `
    <div class="op-line" data-state="${state}">
      <div class="op-num">${num}</div>
      <div class="op-agent"><span class="op-marker" aria-hidden="true"></span>${esc(agent)}</div>
      <div class="op-action">${esc(acao)}</div>
      <div class="op-time">${state === 'stalled' ? 'SEM SINAL · ' + esc(tempo) : esc(tempo)}</div>
      ${motivo}
    </div>
  `;
}

function renderMain(data) {
  const main = document.getElementById('main');
  if (!data || !data.projeto) { main.innerHTML = renderEmpty(); return; }

  const verdict = verdictOf(data);
  const progress = progressOf(data);
  const waves = wavesOf(data);
  const cronos = data.mensagem_cronos;
  const doing = data.fazendo || [];
  const rev = data.revisao || [];
  const blocked = data.bloqueado || [];
  const done = data.concluido || [];
  const hbs = data.heartbeats || [];

  let html = `
    <section class="project" aria-label="Projeto ativo">
      <div class="project-tag">${esc(faseTag(data.fase_atual))}</div>
      <h1 class="project-name">${esc(data.projeto)}</h1>
    </section>
    <section class="verdict" aria-label="Estado da missão">
      <div class="verdict-card" data-state="${verdict.state}">
        <div class="verdict-top">
          <div class="verdict-icon-box" aria-hidden="true">${verdict.icon}</div>
          <div class="verdict-label" role="status" aria-live="polite">${esc(verdict.text)}</div>
        </div>
        <p class="verdict-line">${esc(verdict.line)}</p>
      </div>
    </section>
    <section class="mission-progress" aria-label="Progresso geral da missão">
      <div class="mp-num">
        <span class="mp-pct">${progress.pct}%</span>
        <span class="mp-label">da missão</span>
      </div>
      <div class="mp-right">
        <div class="mp-bar" role="progressbar" aria-valuenow="${progress.pct}" aria-valuemin="0" aria-valuemax="100">
          <div class="mp-bar-fill" style="width: ${progress.pct}%"></div>
        </div>
        <div class="mp-meta">
          <span><strong class="m-done">${progress.done}</strong> concluídas</span>
          <span><strong class="m-live">${progress.doing}</strong> em curso</span>
          <span><strong>${progress.rev}</strong> em revisão</span>
          <span><strong class="m-todo">${progress.todo}</strong> pendentes</span>
          <span>de <strong>${progress.total}</strong> no total</span>
        </div>
      </div>
    </section>
  `;

  if (cronos && cronos.texto) {
    html += `
      <section class="transmission" aria-labelledby="tr-lbl">
        <span id="tr-lbl" class="transmission-label">CRONOS · Transmissão</span>
        <p class="transmission-text">${esc(cronos.texto)}</p>
        <div class="transmission-sign">${esc(tempoRel(cronos.timestamp) || 'sem carimbo')}</div>
      </section>
    `;
  } else {
    html += `
      <section class="transmission" data-state="empty">
        <span class="transmission-label">CRONOS · Transmissão</span>
        <p class="transmission-text">Sem transmissão recente.</p>
      </section>
    `;
  }

  html += renderOperatives(data);

  html += `
    <section class="section" aria-labelledby="ops-lbl">
      <div class="section-header">
        <span class="section-arrow" aria-hidden="true">▸</span>
        <span id="ops-lbl" class="section-title">Operações em curso</span>
        <span class="section-meta">${progress.done}/${progress.total} · ${progress.pct}%</span>
      </div>
      ${renderWaveTrack(waves)}
      <div class="ops" role="list">
  `;

  let opIdx = 0;
  blocked.forEach(t => { html += renderOpLine(t, hbs, opIdx++, 'blocked'); });
  if (doing.length === 0 && blocked.length === 0) {
    html += `<div class="ops-empty">Nenhum agente em ação no momento.</div>`;
  } else {
    doing.forEach(t => { html += renderOpLine(t, hbs, opIdx++); });
  }
  html += `</div>`;

  if (rev.length > 0) {
    html += `
      <div class="section-header" style="margin-top:var(--s-6)">
        <span class="section-arrow" aria-hidden="true">▸</span>
        <span class="section-title">Em revisão do SHIELD</span>
        <span class="section-meta">${rev.length}</span>
      </div>
      <div class="ops" role="list">
    `;
    let ri = 0;
    rev.forEach(t => { html += renderOpLine(t, hbs, ri++, 'review'); });
    html += `</div>`;
  }
  html += `</section>`;

  if (done.length > 0) {
    html += `
      <section class="history">
        <button class="history-toggle" type="button" aria-expanded="false" aria-controls="hist-content" onclick="toggleHistory(this)">
          <span>Operações concluídas · <span class="count">${done.length}</span></span>
          <span class="chevron" aria-hidden="true">▾</span>
        </button>
        <div id="hist-content" class="history-content">
          ${done.slice().reverse().map(t => `
            <div class="history-item">
              <span class="check" aria-hidden="true">✓</span>
              <span>${esc(traduzir(t))}</span>
              <span class="who">${esc(t.por || '')}${t.data ? ' · ' + esc(t.data) : ''}</span>
            </div>
          `).join('')}
        </div>
      </section>
    `;
  }

  html += `
    <section class="engineer">
      <button class="engineer-toggle" type="button" aria-expanded="false" aria-controls="eng-content" onclick="toggleEngineer(this)">
        · dados técnicos ·
      </button>
      <div id="eng-content" class="engineer-content">
        <div class="engineer-title"><span>Kanban bruto</span><span>kanban-data.js</span></div>
        ${renderEngineerRaw(data)}
      </div>
    </section>
  `;

  main.innerHTML = html;
}

function renderEngineerRaw(data) {
  let html = '';
  ['projeto','complexidade','fase_atual','ultima_atualizacao','agente_atualizador'].forEach(k => {
    if (data[k]) html += `<div class="engineer-row"><span class="key">${esc(k)}:</span> <span class="val">${esc(data[k])}</span></div>`;
  });
  const doing = data.fazendo || [];
  if (doing.length > 0) {
    html += `<div class="engineer-row" style="margin-top:8px"><span class="key">FAZENDO (${doing.length}):</span></div>`;
    doing.forEach(t => html += `<div class="engineer-row" style="padding-left:12px">${esc(t.id || '?')} · ${esc(t.agente || '?')} · ${esc((t.desc || '').substring(0,120))}</div>`);
  }
  const hbs = data.heartbeats || [];
  if (hbs.length > 0) {
    html += `<div class="engineer-row" style="margin-top:8px"><span class="key">HEARTBEATS:</span></div>`;
    hbs.forEach(h => html += `<div class="engineer-row" style="padding-left:12px">${esc(h.agente)} · ${esc(h.ultima_atividade)} · ${esc(h.tarefa_atual || '')}</div>`);
  }
  return html;
}

// DRAWER
function renderDrawer(data) {
  const summary = document.getElementById('drawer-summary');
  const body = document.getElementById('drawer-body');
  if (!data || !data.projeto) {
    summary.textContent = 'nenhum projeto ativo';
    body.innerHTML = `<div style="padding:32px; text-align:center; color:var(--ink-40); font-style:italic;">Sem operativos ativos no momento.</div>`;
    return;
  }

  // Preserva quais agentes estavam expandidos antes de re-renderizar
  const previousOpen = new Set();
  body.querySelectorAll('.drawer-agent-head[aria-expanded="true"]').forEach(el => {
    const wrap = el.closest('.drawer-agent');
    if (wrap && wrap.dataset.agente) previousOpen.add(wrap.dataset.agente);
  });

  summary.textContent = `${data.projeto} · ${faseTag(data.fase_atual)}`;

  let html = '';
  AGENTES.forEach(a => {
    const prog = agentProgress(a, data);
    const state = agentState(a, data, prog);
    const role = AGENT_ROLES[a] || '';

    const tasksList = [];
    (data.bloqueado || []).filter(t => t.agente === a).forEach(t =>
      tasksList.push({ tipo: 'bloqueado', label: traduzir(t), meta: t.motivo || 'travado', prefix: '⚠' })
    );
    (data.fazendo || []).filter(t => t.agente === a).forEach(t =>
      tasksList.push({ tipo: 'fazendo', label: traduzir(t), meta: tempoRel(t.inicio) || '—', prefix: '●' })
    );
    (data.revisao || []).filter(t => (t.por || t.agente) === a).forEach(t =>
      tasksList.push({ tipo: 'revisao', label: traduzir(t), meta: 'aguarda SHIELD', prefix: '◇' })
    );
    ((data.a_fazer || {})[a] || []).forEach(t =>
      tasksList.push({ tipo: 'a_fazer', label: traduzir(t), meta: 'pendente', prefix: '○' })
    );
    (data.concluido || []).filter(t => (t.por || t.agente) === a).slice(-4).reverse().forEach(t =>
      tasksList.push({ tipo: 'concluido', label: traduzir(t), meta: t.data || 'ok', prefix: '✓' })
    );

    const metaLine = [];
    if (prog.blocked > 0) metaLine.push(`<span class="m-live">${prog.blocked}⚠</span>`);
    if (prog.doing > 0) metaLine.push(`<span class="m-live">${prog.doing} fazendo</span>`);
    if (prog.rev > 0) metaLine.push(`<span>${prog.rev} revisão</span>`);
    if (prog.todo > 0) metaLine.push(`<span class="m-todo">${prog.todo} pendente</span>`);
    if (prog.done > 0) metaLine.push(`<span class="m-done">${prog.done} concluído</span>`);
    if (metaLine.length === 0) metaLine.push(`<span>sem tarefas atribuídas</span>`);

    let tasksHtml = '';
    if (tasksList.length === 0) {
      tasksHtml = `<div class="drawer-task-group"><div style="padding:12px 0; font-family:var(--font-mono); font-size:10px; color:var(--ink-40); letter-spacing:var(--ls-mono); text-transform:uppercase;">Sem tarefas atribuídas</div></div>`;
    } else {
      tasksHtml = `<div class="drawer-task-group">
        ${tasksList.map(t => `
          <div class="drawer-task-item" data-tipo="${t.tipo}">
            <span class="drawer-task-icon">${t.prefix}</span>
            <span>${esc(t.label)}</span>
            <span class="drawer-task-meta">${esc(t.meta)}</span>
          </div>
        `).join('')}
      </div>`;
    }

    const wasOpen = previousOpen.has(a);
    html += `
      <div class="drawer-agent" data-state="${state}" data-agente="${a}">
        <button class="drawer-agent-head" type="button" aria-expanded="${wasOpen ? 'true' : 'false'}" onclick="toggleAgentTasks(this)" aria-controls="agent-tasks-${a}">
          <span class="drawer-agent-chevron" aria-hidden="true">▸</span>
          <div class="drawer-agent-line-1">
            <div>
              <div class="drawer-agent-nome">${a}</div>
              <div class="drawer-agent-role">${esc(role)}</div>
            </div>
            <div class="drawer-agent-pct">${prog.total > 0 ? prog.pct + '%' : '—'}</div>
          </div>
          <div class="drawer-agent-bar" aria-hidden="true"><div class="drawer-agent-bar-fill" style="width: ${prog.pct}%"></div></div>
          <div class="drawer-agent-meta">${metaLine.join(' · ')}</div>
        </button>
        <div class="drawer-agent-tasks" id="agent-tasks-${a}" data-open="${wasOpen ? '1' : '0'}">${tasksHtml}</div>
      </div>
    `;
  });
  body.innerHTML = html;
}

function toggleAgentTasks(btn) {
  const wrap = btn.parentElement;
  const tasks = wrap.querySelector('.drawer-agent-tasks');
  const open = tasks.dataset.open !== '1';
  tasks.dataset.open = open ? '1' : '0';
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}

let lastFocused = null;
function openDrawer(focusAgent) {
  const drawer = document.getElementById('drawer');
  const backdrop = document.getElementById('backdrop');
  lastFocused = document.activeElement;
  renderDrawer(window.KANBAN_DATA);
  drawer.dataset.open = '1';
  drawer.setAttribute('aria-hidden', 'false');
  backdrop.dataset.open = '1';
  document.body.style.overflow = 'hidden';
  setTimeout(() => {
    if (focusAgent) {
      const target = drawer.querySelector(`.drawer-agent[data-agente="${focusAgent}"] .drawer-agent-head`);
      if (target) {
        target.focus();
        toggleAgentTasks(target);
        target.scrollIntoView({ block: 'start', behavior: 'smooth' });
      } else {
        drawer.querySelector('.drawer-close').focus();
      }
    } else {
      drawer.querySelector('.drawer-close').focus();
    }
  }, 260);
}
function closeDrawer() {
  const drawer = document.getElementById('drawer');
  const backdrop = document.getElementById('backdrop');
  drawer.dataset.open = '0';
  drawer.setAttribute('aria-hidden', 'true');
  backdrop.dataset.open = '0';
  document.body.style.overflow = '';
  if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
}

function toggleHistory(btn) {
  const c = document.getElementById('hist-content'); if (!c) return;
  const open = c.dataset.open !== '1';
  c.dataset.open = open ? '1' : '0';
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}
function toggleEngineer(btn) {
  const c = document.getElementById('eng-content'); if (!c) return;
  const open = c.dataset.open !== '1';
  c.dataset.open = open ? '1' : '0';
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}

document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  const drawerOpen = document.getElementById('drawer').dataset.open === '1';
  if (e.key === 'Escape' && drawerOpen) { closeDrawer(); e.preventDefault(); return; }
  if (e.key === 'o' || e.key === 'O') {
    if (drawerOpen) closeDrawer(); else openDrawer();
    e.preventDefault();
  }
});

let lastRefresh = Date.now();
function updatePulse() {
  const s = Math.floor((Date.now() - lastRefresh) / 1000);
  const txt = s < 5 ? 'sincronizado agora' : s < 60 ? `sincronizado há ${s}s` : `sincronizado há ${Math.floor(s/60)}min`;
  const el = document.getElementById('pulso-text');
  const wrap = document.getElementById('pulso');
  if (el) el.textContent = txt;
  if (wrap) wrap.dataset.old = s > PULSE_STALE_S ? '1' : '0';
}

let lastHash = '';
function hash(d) { try { return JSON.stringify(d); } catch { return String(Date.now()); } }
function reload() {
  document.querySelectorAll('script[src^="kanban-data.js"]').forEach(s => s.remove());
  const s = document.createElement('script');
  s.src = 'kanban-data.js?t=' + Date.now();
  s.onload = () => {
    const h = hash(window.KANBAN_DATA);
    if (h !== lastHash) {
      lastHash = h;
      renderMain(window.KANBAN_DATA);
      if (document.getElementById('drawer').dataset.open === '1') {
        renderDrawer(window.KANBAN_DATA);
      }
    }
    lastRefresh = Date.now();
    updatePulse();
  };
  document.head.appendChild(s);
}

if (window.KANBAN_DATA) { lastHash = hash(window.KANBAN_DATA); renderMain(window.KANBAN_DATA); }
else { setTimeout(() => renderMain(null), 400); }

setInterval(reload, REFRESH_MS);
setInterval(updatePulse, 1000);
setInterval(() => { if (window.KANBAN_DATA) renderMain(window.KANBAN_DATA); }, 30000);
</script>
</body>
</html>
