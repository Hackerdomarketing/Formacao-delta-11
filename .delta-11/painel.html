<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Δ-11 · Score de Vantagem V3.0</title>
<meta name="theme-color" content="#080808">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   PAINEL v7 · SALA DE OPERAÇÕES · Formação Δ-11
   Fontes masculinas + paleta radar sem amarelo
   7 camadas aplicadas como bagagem sênior
   ═══════════════════════════════════════════════════════════════ */

:root {
  /* ─── SUPERFÍCIES (paleta Δ-11 preservada) ─── */
  --surface-0: #050505;
  --surface-1: #0a0a0a;
  --surface-2: #101010;
  --surface-3: #161616;
  --surface-4: #1c1815;

  --line-1: rgba(255,255,255,0.06);
  --line-2: rgba(255,255,255,0.10);
  --line-3: rgba(255,255,255,0.16);

  /* ─── Δ-11 VERMELHO (preservado) ─── */
  --brand: #ff2020;
  --brand-strong: #ff3535;
  --brand-glow: rgba(255,32,32,0.55);
  --brand-glow-soft: rgba(255,32,32,0.12);
  --brand-wash: rgba(255,32,32,0.04);

  /* ─── SEMÂNTICA (sem amarelo, radar-style) ─── */
  --calm: #5ce68a;                        /* verde Δ-11 v4 preservado */
  --calm-soft: rgba(92,230,138,0.08);
  --calm-line: rgba(92,230,138,0.22);

  --alert: #4ac4ff;                       /* cyan radar/sonar militar */
  --alert-soft: rgba(74,196,255,0.08);
  --alert-line: rgba(74,196,255,0.35);
  --alert-glow: rgba(74,196,255,0.55);

  --danger: #ff2020;                      /* vermelho Δ-11 */
  --danger-soft: rgba(255,32,32,0.08);

  /* ─── TEXTO (contraste AA verificado em #0a0a0a) ─── */
  --ink-100: #f5f5f5;                     /* 18.7:1 */
  --ink-80: #d4d4d4;                      /* 13:1 */
  --ink-60: #a0a0a0;                      /* 7.3:1 */
  --ink-40: #6b6b6b;                      /* 4.5:1 limite AA */
  --ink-20: #3a3a3a;                      /* decorativo */

  /* ─── TIPOGRAFIA ─── */
  --font-display: 'Bebas Neue', 'Impact', sans-serif;
  --font-body: 'Chakra Petch', 'Rajdhani', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  /* Escala 1.250 Major Third */
  --t-2xs: 0.6875rem;   /* 11px */
  --t-xs: 0.75rem;      /* 12px */
  --t-sm: 0.875rem;     /* 14px */
  --t-md: 1rem;         /* 16px */
  --t-lg: 1.25rem;      /* 20px */
  --t-xl: 1.5625rem;    /* 25px */
  --t-2xl: 1.953rem;    /* 31px */
  --t-3xl: 2.441rem;    /* 39px */
  --t-hero: 4.25rem;    /* 68px · display cinema */

  /* Letter spacing por família (Chakra Petch tem tracking natural) */
  --ls-display: 0.02em;
  --ls-body: -0.005em;
  --ls-mono: 0.15em;
  --ls-mono-wide: 0.28em;
  --ls-military: 0.35em;

  /* ─── ESPAÇAMENTO ─── */
  --s-1: 4px;  --s-2: 8px;   --s-3: 12px;  --s-4: 16px;
  --s-5: 20px; --s-6: 24px;  --s-8: 32px;  --s-10: 40px;
  --s-12: 48px; --s-16: 64px; --s-20: 80px; --s-24: 96px;

  /* ─── RAIOS (mínimos — cantos militares) ─── */
  --r-sm: 2px;
  --r-md: 4px;
  --r-lg: 6px;
  --r-full: 999px;

  /* ─── TIMING ─── */
  --ease-out: cubic-bezier(0, 0, 0.2, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1);
  --ease-both: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-military: cubic-bezier(0.16, 1, 0.3, 1);
  --d-fast: 150ms;
  --d-base: 250ms;
  --d-slow: 400ms;

  /* ─── GLOWS ─── */
  --glow-brand: 0 0 24px var(--brand-glow-soft);
  --glow-alert: 0 0 24px rgba(74,196,255,0.15);

  /* ─── LAYOUT ─── */
  --container: 780px;
}

/* ─── RESET ─── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  font-size: var(--t-md);
  line-height: 1.5;
  background: var(--surface-1);
  color: var(--ink-100);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  letter-spacing: var(--ls-body);
}

/* Fundo bg-delta11.png preservado, rebaixado */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 15%, rgba(255,32,32,0.045), transparent 55%),
    linear-gradient(180deg, rgba(5,5,5,0.94), rgba(5,5,5,0.98)),
    url('bg-delta11.png') center center / cover no-repeat;
  pointer-events: none;
  z-index: 0;
}

/* Grid militar sutil */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 80px 80px;
  pointer-events: none;
  z-index: 0;
}

/* Skip-link */
.skip {
  position: absolute;
  top: -100px;
  left: var(--s-4);
  z-index: 999;
  padding: var(--s-3) var(--s-5);
  background: var(--brand);
  color: white;
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: var(--ls-mono);
  text-transform: uppercase;
  text-decoration: none;
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
  transition: top var(--d-base) var(--ease-military);
}
.skip:focus { top: var(--s-4); }

:focus-visible {
  outline: 2px solid var(--brand-strong);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ═══════════════════════════════════════════════════════════════
   CABEÇALHO — mínimo, militar
   ═══════════════════════════════════════════════════════════════ */
.top {
  position: relative;
  z-index: 2;
  padding: var(--s-5) var(--s-8);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-6);
  border-bottom: 1px solid var(--line-1);
  background: linear-gradient(180deg, rgba(8,8,8,0.85), rgba(8,8,8,0.6));
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 600;
  letter-spacing: var(--ls-military);
  text-transform: uppercase;
  color: var(--ink-40);
}
.brand-mark {
  font-family: var(--font-display);
  font-size: 1.75rem;
  font-weight: 400;
  color: var(--brand);
  text-shadow: 0 0 18px var(--brand-glow-soft);
  line-height: 0.9;
  letter-spacing: 0.02em;
}
.brand-mark .num { color: var(--ink-80); }
.brand-divider {
  width: 1px;
  height: 22px;
  background: linear-gradient(180deg, transparent, var(--line-3), transparent);
}

.pulso {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 500;
  letter-spacing: var(--ls-mono);
  color: var(--ink-40);
  text-transform: uppercase;
}
.pulso-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--calm);
  box-shadow: 0 0 8px rgba(92,230,138,0.6);
  animation: dot-pulse 2s ease-in-out infinite;
}
.pulso[data-old="1"] .pulso-dot {
  background: var(--alert);
  box-shadow: 0 0 8px var(--alert-glow);
}
@keyframes dot-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

/* ═══════════════════════════════════════════════════════════════
   MAIN
   ═══════════════════════════════════════════════════════════════ */
.main {
  position: relative;
  z-index: 1;
  max-width: var(--container);
  margin: 0 auto;
  padding: var(--s-10) var(--s-6) var(--s-24);
}

/* ═══════════════════════════════════════════════════════════════
   BLOCO 1 · PROJETO (identificação editorial)
   ═══════════════════════════════════════════════════════════════ */
.project {
  text-align: center;
  margin-bottom: var(--s-8);
  animation: rise 500ms var(--ease-military) both;
}
.project-tag {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 600;
  letter-spacing: var(--ls-military);
  text-transform: uppercase;
  color: var(--brand);
  text-shadow: 0 0 12px var(--brand-glow-soft);
  margin-bottom: var(--s-4);
  display: inline-flex;
  align-items: center;
  gap: var(--s-3);
}
.project-tag::before,
.project-tag::after {
  content: '';
  display: inline-block;
  width: 24px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--brand), transparent);
}
.project-name {
  font-family: var(--font-display);
  font-size: var(--t-hero);
  font-weight: 400;
  color: var(--ink-100);
  line-height: 0.95;
  letter-spacing: var(--ls-display);
  text-transform: uppercase;
}

/* ═══════════════════════════════════════════════════════════════
   BLOCO 2 · SELO BINÁRIO (o momento de arrepio)
   Card com cantos cortados militares — feel painel F1/aviação
   ═══════════════════════════════════════════════════════════════ */
.verdict {
  margin-bottom: var(--s-10);
  animation: rise 500ms var(--ease-military) 100ms both;
}

.verdict-card {
  position: relative;
  padding: var(--s-6) var(--s-8);
  background: linear-gradient(180deg, rgba(20,20,20,0.75), rgba(14,14,14,0.75));
  border: 1.5px solid;
  clip-path: polygon(
    0 0, calc(100% - 16px) 0, 100% 16px,
    100% 100%, 16px 100%, 0 calc(100% - 16px)
  );
  transition: all var(--d-base) var(--ease-military);
}
.verdict-card[data-state="calm"] {
  border-color: var(--calm-line);
  background:
    linear-gradient(180deg, rgba(92,230,138,0.04), rgba(92,230,138,0.02)),
    linear-gradient(180deg, rgba(20,20,20,0.75), rgba(14,14,14,0.75));
}
.verdict-card[data-state="alert"] {
  border-color: var(--alert-line);
  background:
    linear-gradient(180deg, rgba(74,196,255,0.05), rgba(74,196,255,0.02)),
    linear-gradient(180deg, rgba(20,20,20,0.75), rgba(14,14,14,0.75));
  animation: alert-breath 2.6s ease-in-out infinite;
}
.verdict-card[data-state="danger"] {
  border-color: rgba(255,32,32,0.6);
  background:
    linear-gradient(180deg, rgba(255,32,32,0.05), rgba(255,32,32,0.02)),
    linear-gradient(180deg, rgba(20,20,20,0.75), rgba(14,14,14,0.75));
  animation: danger-breath 1.4s ease-in-out infinite;
}
@keyframes alert-breath {
  0%, 100% { box-shadow: 0 0 0 0 rgba(74,196,255,0.28); }
  50% { box-shadow: 0 0 40px 0 rgba(74,196,255,0.2); }
}
@keyframes danger-breath {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,32,32,0.4); }
  50% { box-shadow: 0 0 48px 0 rgba(255,32,32,0.28); }
}

.verdict-top {
  display: flex;
  align-items: center;
  gap: var(--s-4);
  margin-bottom: var(--s-4);
}
.verdict-icon-box {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1;
  border: 1.5px solid;
  clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
  flex-shrink: 0;
}
.verdict-card[data-state="calm"] .verdict-icon-box {
  color: var(--calm);
  border-color: var(--calm-line);
  background: var(--calm-soft);
  text-shadow: 0 0 12px rgba(92,230,138,0.6);
}
.verdict-card[data-state="alert"] .verdict-icon-box {
  color: var(--alert);
  border-color: var(--alert-line);
  background: var(--alert-soft);
  text-shadow: 0 0 12px var(--alert-glow);
}
.verdict-card[data-state="danger"] .verdict-icon-box {
  color: var(--danger);
  border-color: rgba(255,32,32,0.6);
  background: var(--danger-soft);
  text-shadow: 0 0 14px var(--brand-glow);
}

.verdict-label {
  font-family: var(--font-body);
  font-size: var(--t-lg);
  font-weight: 700;
  letter-spacing: var(--ls-military);
  text-transform: uppercase;
  line-height: 1;
}
.verdict-card[data-state="calm"] .verdict-label {
  color: var(--calm);
  text-shadow: 0 0 14px rgba(92,230,138,0.5);
}
.verdict-card[data-state="alert"] .verdict-label {
  color: var(--alert);
  text-shadow: 0 0 14px var(--alert-glow);
}
.verdict-card[data-state="danger"] .verdict-label {
  color: var(--danger);
  text-shadow: 0 0 16px var(--brand-glow);
}

.verdict-line {
  font-family: var(--font-body);
  font-size: var(--t-lg);
  font-weight: 400;
  color: var(--ink-80);
  line-height: 1.45;
  padding-left: calc(44px + var(--s-4));
}

/* ═══════════════════════════════════════════════════════════════
   BLOCO 3 · TRANSMISSÃO DO CRONOS
   ═══════════════════════════════════════════════════════════════ */
.transmission {
  position: relative;
  padding: var(--s-6) var(--s-8);
  margin-bottom: var(--s-10);
  background: linear-gradient(180deg, rgba(28,20,20,0.6), rgba(20,16,16,0.6));
  border: 1px solid var(--line-1);
  animation: rise 500ms var(--ease-military) 200ms both;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
}
.transmission::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 3px;
  background: var(--brand);
  box-shadow: 0 0 12px var(--brand-glow-soft);
}
.transmission-label {
  display: block;
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 700;
  letter-spacing: var(--ls-military);
  text-transform: uppercase;
  color: var(--brand);
  text-shadow: 0 0 10px var(--brand-glow-soft);
  margin-bottom: var(--s-4);
}
.transmission-text {
  font-family: var(--font-body);
  font-size: var(--t-xl);
  font-weight: 400;
  color: var(--ink-100);
  line-height: 1.5;
}
.transmission-sign {
  margin-top: var(--s-5);
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 500;
  color: var(--ink-40);
  letter-spacing: var(--ls-mono);
  text-transform: uppercase;
}
.transmission[data-state="empty"] {
  opacity: 0.55;
  padding: var(--s-4) var(--s-8);
}
.transmission[data-state="empty"]::before { background: var(--ink-20); box-shadow: none; }
.transmission[data-state="empty"] .transmission-label { color: var(--ink-40); text-shadow: none; }
.transmission[data-state="empty"] .transmission-text {
  font-size: var(--t-md);
  font-style: italic;
  color: var(--ink-40);
}

/* ═══════════════════════════════════════════════════════════════
   SECTION HEADER (overline vermelha + título mono uppercase)
   ═══════════════════════════════════════════════════════════════ */
.section {
  margin-bottom: var(--s-10);
  animation: rise 500ms var(--ease-military) 300ms both;
}
.section-header {
  position: relative;
  display: flex;
  align-items: baseline;
  gap: var(--s-4);
  padding: var(--s-4) 0 var(--s-4);
  margin-bottom: var(--s-5);
  border-top: 1px solid var(--line-2);
}
.section-header::before {
  content: '';
  position: absolute;
  top: -1px;
  left: 0;
  width: 40px;
  height: 2px;
  background: var(--brand);
  box-shadow: 0 0 8px var(--brand-glow-soft);
}
.section-arrow {
  color: var(--brand);
  font-family: var(--font-mono);
  font-size: var(--t-sm);
  line-height: 1;
  font-weight: 700;
}
.section-title {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: var(--ls-military);
  text-transform: uppercase;
  color: var(--ink-80);
}
.section-meta {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 500;
  color: var(--ink-40);
  letter-spacing: var(--ls-mono-wide);
  text-transform: uppercase;
}

/* ═══════════════════════════════════════════════════════════════
   TRILHA DE ONDAS — quadrados angulares em vez de círculos
   ═══════════════════════════════════════════════════════════════ */
.wave-track {
  padding: var(--s-5) var(--s-6);
  margin-bottom: var(--s-6);
  background: rgba(255,255,255,0.015);
  border: 1px solid var(--line-1);
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
}
.wave-line {
  display: flex;
  align-items: center;
  gap: var(--s-3);
}
.wave-node {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  flex-shrink: 0;
}
.wave-square {
  width: 12px;
  height: 12px;
  background: transparent;
  border: 1.5px solid var(--ink-20);
  transform: rotate(45deg);
  transition: all var(--d-base) var(--ease-military);
  flex-shrink: 0;
}
.wave-square[data-state="done"] {
  background: var(--calm);
  border-color: var(--calm);
  box-shadow: 0 0 10px rgba(92,230,138,0.5);
}
.wave-square[data-state="current"] {
  background: var(--brand);
  border-color: var(--brand);
  box-shadow: 0 0 14px var(--brand-glow);
  animation: current-pulse 1.6s ease-in-out infinite;
}
.wave-connector {
  flex: 1;
  height: 1.5px;
  background: var(--ink-20);
  transition: background var(--d-base) var(--ease-military);
}
.wave-connector[data-state="done"] {
  background: linear-gradient(90deg, var(--calm) 0%, var(--brand) 100%);
}
.wave-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  color: var(--ink-40);
  letter-spacing: var(--ls-mono);
  text-transform: uppercase;
  white-space: nowrap;
}
.wave-label[data-state="current"] {
  color: var(--brand);
  font-weight: 700;
}
.wave-label[data-state="done"] { color: var(--calm); }
@keyframes current-pulse {
  0%, 100% { transform: rotate(45deg) scale(1); box-shadow: 0 0 14px var(--brand-glow); }
  50% { transform: rotate(45deg) scale(1.3); box-shadow: 0 0 22px rgba(255,32,32,0.75); }
}

/* ═══════════════════════════════════════════════════════════════
   LINHAS DE OPERAÇÃO — numeração militar
   ═══════════════════════════════════════════════════════════════ */
.ops {
  display: flex;
  flex-direction: column;
}
.op-line {
  display: grid;
  grid-template-columns: 28px 100px 1fr auto;
  gap: var(--s-4);
  align-items: baseline;
  padding: var(--s-4) var(--s-3);
  border-bottom: 1px solid var(--line-1);
  transition: background var(--d-fast) var(--ease-out);
  position: relative;
}
.op-line:last-child { border-bottom: none; }
.op-line:hover { background: rgba(255,255,255,0.02); }
.op-line[data-state="stalled"] { background: rgba(74,196,255,0.03); }
.op-line[data-state="blocked"] {
  background: var(--danger-soft);
  border-left: 3px solid var(--brand);
  padding-left: var(--s-4);
  animation: block-breath 2s ease-in-out infinite;
}

.op-num {
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 500;
  color: var(--ink-20);
  letter-spacing: var(--ls-mono);
}
.op-agent {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: var(--ls-mono-wide);
  text-transform: uppercase;
  color: var(--brand);
  text-shadow: 0 0 8px var(--brand-glow-soft);
}
.op-line[data-state="stalled"] .op-agent {
  color: var(--alert);
  text-shadow: 0 0 8px var(--alert-glow);
}
.op-line[data-state="blocked"] .op-agent {
  color: var(--brand);
  text-shadow: 0 0 10px var(--brand-glow);
}
.op-marker {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--brand);
  box-shadow: 0 0 6px var(--brand-glow);
  animation: dot-pulse 2s ease-in-out infinite;
  flex-shrink: 0;
}
.op-line[data-state="stalled"] .op-marker {
  background: var(--alert);
  box-shadow: 0 0 6px var(--alert-glow);
  animation: none;
}
.op-line[data-state="blocked"] .op-marker {
  background: var(--brand);
  box-shadow: 0 0 8px var(--brand-glow);
}

.op-action {
  font-family: var(--font-body);
  font-size: var(--t-md);
  font-weight: 500;
  color: var(--ink-100);
  line-height: 1.4;
}
.op-time {
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 500;
  color: var(--ink-40);
  letter-spacing: var(--ls-mono);
  text-transform: uppercase;
  white-space: nowrap;
}
.op-line[data-state="stalled"] .op-time {
  color: var(--alert);
  font-weight: 700;
}
.op-line[data-state="blocked"] .op-time {
  color: var(--brand);
  font-weight: 700;
}

.op-blocked-reason {
  grid-column: 2 / 5;
  font-family: var(--font-body);
  font-size: var(--t-sm);
  font-weight: 400;
  color: var(--brand);
  font-style: italic;
  margin-top: var(--s-2);
  padding-top: var(--s-2);
  border-top: 1px solid rgba(255,32,32,0.15);
}

@keyframes block-breath {
  0%, 100% { box-shadow: inset 0 0 0 0 rgba(0,0,0,0); }
  50% { box-shadow: inset 0 0 24px rgba(255,32,32,0.08); }
}

.ops-empty {
  padding: var(--s-6);
  text-align: center;
  font-family: var(--font-body);

  color: var(--ink-40);

/* ═══════════════════════════════════════════════════════════════
   OPERAÇÕES CONCLUÍDAS (histórico)
   ═══════════════════════════════════════════════════════════════ */
.history {
  margin-bottom: var(--s-8);
  animation: rise 500ms var(--ease-military) 400ms both;
}
.history-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-4);
  width: 100%;
  padding: var(--s-4) var(--s-5);
  background: transparent;
  border: 1px solid var(--line-1);
  color: var(--ink-60);
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 600;
  letter-spacing: var(--ls-military);
  text-transform: uppercase;
  cursor: pointer;
  transition: all var(--d-fast) var(--ease-military);
  text-align: left;
  min-height: 44px;
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
}
.history-toggle:hover {
  background: var(--calm-soft);
  border-color: var(--calm-line);
  color: var(--calm);
}
.history-toggle .count { color: var(--calm); font-weight: 700; }
.history-toggle .chevron { transition: transform var(--d-base) var(--ease-military); }
.history-toggle[aria-expanded="true"] .chevron { transform: rotate(180deg); }

.history-content {
  display: none;
  margin-top: var(--s-3);
  max-height: 480px;
  overflow-y: auto;
  padding-right: var(--s-2);
}
.history-content[data-open="1"] {
  display: block;
  animation: rise 300ms var(--ease-out) both;
}
.history-item {
  display: grid;
  grid-template-columns: 20px 1fr auto;
  gap: var(--s-3);
  align-items: baseline;
  padding: var(--s-3) var(--s-4);
  border-bottom: 1px solid var(--line-1);
  font-family: var(--font-body);
  font-size: var(--t-sm);
  color: var(--ink-60);
}
.history-item:last-child { border-bottom: none; }
.history-item .check {
  color: var(--calm);
  font-weight: 700;
  line-height: 1;
}
.history-item .who {
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 500;
  color: var(--ink-40);
  letter-spacing: var(--ls-mono);
  text-transform: uppercase;
}

/* ═══════════════════════════════════════════════════════════════
   DADOS TÉCNICOS (modo engenheiro)
   ═══════════════════════════════════════════════════════════════ */
.engineer {
  padding-top: var(--s-8);
  border-top: 1px solid var(--line-1);
  animation: rise 500ms var(--ease-military) 500ms both;
}
.engineer-toggle {
  display: block;
  width: 100%;
  padding: var(--s-3) var(--s-4);
  background: transparent;
  border: none;
  color: var(--ink-40);
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 500;
  letter-spacing: var(--ls-military);
  text-transform: uppercase;
  cursor: pointer;
  text-align: center;
  transition: color var(--d-fast) var(--ease-military);
  min-height: 44px;
}
.engineer-toggle:hover { color: var(--ink-80); }
.engineer-content {
  display: none;
  margin-top: var(--s-4);
  background: var(--surface-0);
  border: 1px solid var(--line-1);
  padding: var(--s-5);
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
}
.engineer-content[data-open="1"] {
  display: block;
  animation: rise 300ms var(--ease-out) both;
}
.engineer-title {
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 600;
  color: var(--ink-40);
  letter-spacing: var(--ls-military);
  text-transform: uppercase;

}
.engineer-row {

.engineer-row .key { color: var(--brand); font-weight: 700; }
.engineer-row .val { color: var(--ink-80); }

/* ═══════════════════════════════════════════════════════════════
   ESTADO INICIAL VAZIO
   ═══════════════════════════════════════════════════════════════ */
.empty {
  min-height: calc(100vh - 200px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--s-10);
}
.empty-icon {
  font-family: var(--font-display);
  font-size: 8rem;
  font-weight: 400;
  color: var(--brand);
  opacity: 0.12;
  line-height: 1;
  margin-bottom: var(--s-6);
}
.empty-title {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: var(--ls-military);
  text-transform: uppercase;
  color: var(--ink-40);
  margin-bottom: var(--s-4);
}
.empty-desc {
  font-family: var(--font-body);
  font-size: var(--t-md);
  color: var(--ink-60);
  max-width: 400px;
  line-height: 1.6;
  margin-bottom: var(--s-6);
}
.empty-code {
  display: inline-block;
  padding: var(--s-3) var(--s-6);
  background: var(--surface-3);
  border: 1px solid var(--line-2);
  font-family: var(--font-mono);
  font-size: var(--t-sm);
  color: var(--brand);
  letter-spacing: var(--ls-mono);
  clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
}

/* ═══════════════════════════════════════════════════════════════
   SKELETON (Camada 5 · performance percebida)
   ═══════════════════════════════════════════════════════════════ */
.skel {
  animation: skel-pulse 1.5s ease-in-out infinite;
  background: linear-gradient(90deg,
    var(--surface-2) 25%,
    var(--surface-3) 50%,
    var(--surface-2) 75%);
  background-size: 200% 100%;
  border-radius: var(--r-sm);
}
.skel-h1 { height: 68px; width: 60%; margin: 0 auto var(--s-4); }
.skel-tag { height: 12px; width: 200px; margin: 0 auto var(--s-4); }
.skel-verdict { height: 120px; margin-bottom: var(--s-10); }
.skel-block { height: 80px; margin-bottom: var(--s-6); }
@keyframes skel-pulse {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ═══════════════════════════════════════════════════════════════
   ANIMAÇÕES
   ═══════════════════════════════════════════════════════════════ */
@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-3); }
::-webkit-scrollbar-thumb:hover { background: var(--brand); }

/* SR-only */
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* Responsive */
@media (max-width: 640px) {
  .top { padding: var(--s-4); flex-wrap: wrap; }
  .main { padding: var(--s-6) var(--s-4) var(--s-16); }
  .project-name { font-size: 2.5rem; }
  .verdict-card { padding: var(--s-5); }
  .verdict-icon-box { width: 36px; height: 36px; font-size: 1.4rem; }
  .verdict-label { font-size: var(--t-md); }
  .verdict-line { padding-left: 0; margin-top: var(--s-3); font-size: var(--t-md); }
  .verdict-top { flex-wrap: wrap; }
  .transmission-text { font-size: var(--t-lg); }
  .op-line { grid-template-columns: 24px 78px 1fr auto; gap: var(--s-2); }
  .wave-label { font-size: 9px; }
}
</style>
</head>
<body>

<a href="#main" class="skip">Pular para o painel</a>

<header class="top" role="banner">
  <div class="brand" aria-label="Formação Delta-11">
    <span class="brand-mark">Δ<span class="num">-11</span></span>
    <span class="brand-divider" aria-hidden="true"></span>
    Centro de comando
  </div>
  <div class="pulso" id="pulso" aria-label="Última sincronização">
    <span class="pulso-dot" aria-hidden="true"></span>
    <span id="pulso-text">—</span>
  </div>
</header>

<main id="main" class="main">
  <!-- Skeleton inicial -->
  <div class="skel skel-tag"></div>
  <div class="skel skel-h1"></div>
  <div class="skel skel-verdict"></div>
  <div class="skel skel-block"></div>
</main>

<script src="kanban-data.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// PAINEL v7 — Sala de Operações Δ-11
// ═══════════════════════════════════════════════════════════════

const AGENT_ROLES = {
  ATLAS: 'Arquiteto', CRONOS: 'Gerente', FRONT: 'Interface',
  PIXEL: 'Visual', FORM: 'Formulários', BACK: 'Servidor',
  ENGINE: 'Motor', VAULT: 'Banco', SHIELD: 'Qualidade', SCOUT: 'Diagnóstico'
};

const HB_STALE_MIN = 5;
const TASK_OLD_MIN = 30;
const PULSE_STALE_S = 30;
const REFRESH_MS = 5000;

function parseTS(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  return isNaN(d) ? null : d;
}
function tempoRel(iso) {
  const d = parseTS(iso);
  if (!d) return null;
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 30) return 'agora';
  if (s < 60) return `há ${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `há ${m} min`;
  const h = Math.floor(m / 60);
  if (h < 24) return `há ${h}h`;
  return `há ${Math.floor(h / 24)}d`;
}
function minSince(iso) {
  const d = parseTS(iso);
  if (!d) return null;
  return Math.floor((Date.now() - d.getTime()) / 60000);
}

const PADROES = [
  { re: /\[IMPACTO-MUDANCA\]/i, fala: 'Fazendo uma mudança de impacto' },
  { re: /migration|migração|migrations/i, fala: 'Mexendo no banco de dados' },
  { re: /webhook/i, fala: 'Configurando integração externa' },
  { re: /rota|route|api\//i, fala: 'Criando rota do servidor' },
  { re: /contract test|contract-tester/i, fala: 'Testando contratos' },
  { re: /tabela|table|schema/i, fala: 'Trabalhando na estrutura do banco' },
  { re: /componente|component|tela|page\.tsx/i, fala: 'Construindo uma tela' },
  { re: /formulário|formulario|form|validation/i, fala: 'Fazendo formulário' },
  { re: /auth|autenticação|login/i, fala: 'Trabalhando na autenticação' },
  { re: /orquestrar|orquestração/i, fala: 'Coordenando os agentes' },
  { re: /merge|revisão/i, fala: 'Consolidando trabalho' },
  { re: /bug|error|erro|corrigir/i, fala: 'Corrigindo um problema' },
  { re: /teste|test|spec/i, fala: 'Testando o sistema' }
];
function traduzir(t) {
  if (t.resumo_humano) return t.resumo_humano;
  const texto = (t.desc || '').toString();
  for (const p of PADROES) if (p.re.test(texto)) return p.fala;
  const clean = texto
    .replace(/\[[^\]]+\]/g, '').replace(/`[^`]+`/g, '')
    .replace(/T-[A-Z0-9-]+/gi, '').replace(/\s+/g, ' ').trim();
  const dot = clean.indexOf('.');
  return (dot > 0 && dot < 80 ? clean.substring(0, dot) : clean.substring(0, 80)).trim() || 'Trabalhando';
}
function esc(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function verdictOf(data) {
  if (!data) return {
    state: 'calm', icon: '●', text: 'AGUARDANDO',
    line: 'Nenhuma missão em execução.'
  };
  const blocked = data.bloqueado || [];
  const doing = data.fazendo || [];
  const hbs = data.heartbeats || [];

  if (blocked.length > 0) {
    return {
      state: 'danger', icon: '⚠',
      text: blocked.length > 1 ? `${blocked.length} TRAVADOS` : `${blocked.length} TRAVADO`,
      line: `${blocked.length > 1 ? 'Agentes' : 'Um agente'} precisa da sua decisão para destravar.`
    };
  }
  for (const t of doing) {
    const hb = hbs.find(h => h.agente === t.agente);
    if (hb) {
      const m = minSince(hb.ultima_atividade);
      if (m !== null && m > HB_STALE_MIN) {
        return { state: 'alert', icon: '!', text: 'AGENTE SEM SINAL',
          line: `${t.agente} não dá sinal há ${m} minutos. Verifique se travou.` };
      }
    }
  }
  for (const t of doing) {
    const m = minSince(t.inicio);
    if (m !== null && m > TASK_OLD_MIN) {
      return { state: 'alert', icon: '!', text: 'TAREFA DEMORANDO',
        line: `Uma tarefa está aberta há mais de ${TASK_OLD_MIN} minutos. Talvez precise de você.` };
    }
  }
  if (data.mensagem_cronos && data.mensagem_cronos.precisa_comandante) {
    return { state: 'alert', icon: '!', text: 'PRECISA DE VOCÊ',
      line: data.mensagem_cronos.precisa_comandante };
  }
  if (doing.length > 0) {
    const nomes = doing.map(t => t.agente).filter(Boolean);
    const q = nomes.length;
    return { state: 'calm', icon: '●', text: 'SEGURO FECHAR',
      line: q === 1
        ? `${nomes[0]} está no comando. Nada requer você agora.`
        : `${q} agentes coordenados. Nada requer você agora.` };
  }
  return { state: 'calm', icon: '●', text: 'DESCANSANDO',
    line: 'Todos os agentes concluíram suas tarefas.' };
}

function progressOf(data) {
  if (!data) return { done: 0, total: 0, pct: 0 };
  const done = (data.concluido || []).length;
  let todo = 0;
  Object.values(data.a_fazer || {}).forEach(a => todo += a.length);
  const doing = (data.fazendo || []).length;
  const rev = (data.revisao || []).length;
  const bl = (data.bloqueado || []).length;
  const total = done + todo + doing + rev + bl;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  return { done, total, pct, todo, doing, rev };
}
function wavesOf(data) {
  const fc = (data && data.fase_atual) || '';
  const s = fc.toString();
  const m1 = s.match(/onda\s*(\d+)\s*de\s*(\d+)/i);
  if (m1) return { curr: parseInt(m1[1]), total: parseInt(m1[2]) };
  const m2 = s.match(/onda\s*(\d+)/i);
  if (m2) {
    if (data && data.total_ondas) return { curr: parseInt(m2[1]), total: parseInt(data.total_ondas) };
    return { curr: parseInt(m2[1]), total: null };
  }
  return null;
}
function faseTag(fc) {
  if (!fc) return 'AGUARDANDO';
  const s = fc.toString();
  const c = s.match(/ciclo\s*([A-Z0-9]+)/i);
  const o = s.match(/onda\s*(\d+)/i);
  const f = s.match(/fase\s*(\d+)/i);
  if (c && o) return `CICLO ${c[1].toUpperCase()} · ONDA ${o[1]}`;
  if (o) return `ONDA ${o[1]}`;
  if (c) return `CICLO ${c[1].toUpperCase()}`;
  if (f) return `FASE ${f[1]}`;
  return s.substring(0, 40).toUpperCase();
}

function opStatus(agent, hbs) {
  const hb = hbs.find(h => h.agente === agent);
  if (!hb) return 'active';
  const m = minSince(hb.ultima_atividade);
  if (m !== null && m > HB_STALE_MIN) return 'stalled';
  return 'active';
}

// ── RENDER ─────────────────────────────────────
function renderEmpty() {
  return `
    <div class="empty">
      <div class="empty-icon" aria-hidden="true">Δ</div>
      <div class="empty-title">Aguardando missão</div>
      <p class="empty-desc">Nenhum projeto ativo. Abra o Claude Code e inicie com:</p>
      <div class="empty-code">d11 + descrição do projeto</div>
    </div>
  `;
}

function renderWaveTrack(waves) {
  if (!waves) return '';
  if (!waves.total) {
    return `
      <div class="wave-track">
        <div class="wave-line">
          <div class="wave-node">
            <span class="wave-square" data-state="current" aria-hidden="true"></span>
            <span class="wave-label" data-state="current">Onda ${esc(waves.curr)}</span>
          </div>
        </div>
      </div>
    `;
  }
  let nodes = '';
  for (let i = 1; i <= waves.total; i++) {
    let state = '';
    if (i < waves.curr) state = 'done';
    else if (i === waves.curr) state = 'current';
    const lbl = state === 'done' ? 'concluída'
              : state === 'current' ? 'em execução'
              : 'pendente';
    nodes += `
      <div class="wave-node">
        <span class="wave-square" data-state="${state}" aria-hidden="true"></span>
        <span class="wave-label" data-state="${state}">Onda ${i} · ${lbl}</span>
      </div>
    `;
    if (i < waves.total) {
      const cs = i < waves.curr ? 'done' : '';
      nodes += `<span class="wave-connector" data-state="${cs}" aria-hidden="true"></span>`;
    }
  }
  return `
    <div class="wave-track" role="progressbar" aria-valuenow="${waves.curr}" aria-valuemin="1" aria-valuemax="${waves.total}">
      <div class="wave-line">${nodes}</div>
    </div>
  `;
}

function renderOpLine(t, hbs, index, forcedState) {
  const agent = t.agente || t.por || '?';
  const role = AGENT_ROLES[agent] || '';
  const state = forcedState || opStatus(agent, hbs);
  const hb = hbs.find(h => h.agente === agent);
  const tempo = tempoRel(hb ? hb.ultima_atividade : t.inicio) || '—';
  const acao = traduzir(t);
  const motivo = t.motivo ? `<div class="op-blocked-reason">⚠ ${esc(t.motivo)}</div>` : '';
  const num = String(index + 1).padStart(2, '0');

  return `
    <div class="op-line" data-state="${state}">
      <div class="op-num">${num}</div>
      <div class="op-agent">
        <span class="op-marker" aria-hidden="true"></span>
        ${esc(agent)}
      </div>
      <div class="op-action">
        ${esc(acao)}
        <span class="sr-only"> — ${esc(role)}</span>
      </div>
      <div class="op-time">${esc(tempo)}</div>
      ${motivo}
    </div>
  `;
}

function renderMain(data) {
  const main = document.getElementById('main');
  if (!data || !data.projeto) {
    main.innerHTML = renderEmpty();
    return;
  }

  const verdict = verdictOf(data);
  const progress = progressOf(data);
  const waves = wavesOf(data);
  const cronos = data.mensagem_cronos;
  const doing = data.fazendo || [];
  const rev = data.revisao || [];
  const blocked = data.bloqueado || [];
  const done = data.concluido || [];
  const hbs = data.heartbeats || [];

  let html = '';

  html += `
    <section class="project" aria-label="Projeto ativo">
      <div class="project-tag">${esc(faseTag(data.fase_atual))}</div>
      <h1 class="project-name">${esc(data.projeto)}</h1>
    </section>

    <section class="verdict" aria-label="Estado da missão">
      <div class="verdict-card" data-state="${verdict.state}">
        <div class="verdict-top">
          <div class="verdict-icon-box" aria-hidden="true">${verdict.icon}</div>
          <div class="verdict-label" role="status" aria-live="polite">${esc(verdict.text)}</div>
        </div>
        <p class="verdict-line">${esc(verdict.line)}</p>
      </div>
    </section>
  `;

  if (cronos && cronos.texto) {
    html += `
      <section class="transmission" aria-labelledby="tr-lbl">
        <span id="tr-lbl" class="transmission-label">CRONOS · Transmissão</span>
        <p class="transmission-text">${esc(cronos.texto)}</p>
        <div class="transmission-sign">${esc(tempoRel(cronos.timestamp) || 'sem carimbo')}</div>
      </section>
    `;
  } else {
    html += `
      <section class="transmission" data-state="empty">
        <span class="transmission-label">CRONOS · Transmissão</span>
        <p class="transmission-text">Sem transmissão recente.</p>
      </section>
    `;
  }

  html += `
    <section class="section" aria-labelledby="ops-lbl">
      <div class="section-header">
        <span class="section-arrow" aria-hidden="true">▸</span>
        <span id="ops-lbl" class="section-title">Operações em curso</span>
        <span class="section-meta">${progress.done}/${progress.total} · ${progress.pct}%</span>
      </div>
      ${renderWaveTrack(waves)}
      <div class="ops" role="list">
  `;

  let opIdx = 0;
  blocked.forEach(t => { html += renderOpLine(t, hbs, opIdx++, 'blocked'); });
  if (doing.length === 0 && blocked.length === 0) {
    html += `<div class="ops-empty">Nenhum agente em ação no momento.</div>`;
  } else {
    doing.forEach(t => { html += renderOpLine(t, hbs, opIdx++); });
  }
  html += `</div>`;

  if (rev.length > 0) {
    html += `
      <div class="section-header" style="margin-top:var(--s-6)">
        <span class="section-arrow" aria-hidden="true">▸</span>
        <span class="section-title">Em revisão do SHIELD</span>
        <span class="section-meta">${rev.length}</span>
      </div>
      <div class="ops" role="list">
    `;
    let ri = 0;
    rev.forEach(t => { html += renderOpLine(t, hbs, ri++, 'review'); });
    html += `</div>`;
  }
  html += `</section>`;

  if (done.length > 0) {
    html += `
      <section class="history">
        <button class="history-toggle" type="button" aria-expanded="false" aria-controls="hist-content" onclick="toggleHistory(this)">
          <span>Operações concluídas · <span class="count">${done.length}</span></span>
          <span class="chevron" aria-hidden="true">▾</span>
        </button>
        <div id="hist-content" class="history-content">
          ${done.slice().reverse().map(t => `
            <div class="history-item">
              <span class="check" aria-hidden="true">✓</span>
              <span>${esc(traduzir(t))}</span>
              <span class="who">${esc(t.por || '')}${t.data ? ' · ' + esc(t.data) : ''}</span>
            </div>
          `).join('')}
        </div>
      </section>
    `;
  }

  html += `
    <section class="engineer">
      <button class="engineer-toggle" type="button" aria-expanded="false" aria-controls="eng-content" onclick="toggleEngineer(this)">
        · dados técnicos ·
      </button>
      <div id="eng-content" class="engineer-content">
        <div class="engineer-title">
          <span>Kanban bruto</span>
          <span>kanban-data.js</span>
        </div>
        ${renderEngineerRaw(data)}
      </div>
    </section>
  `;

  main.innerHTML = html;
}

function renderEngineerRaw(data) {
  let html = '';
  ['projeto','complexidade','fase_atual','ultima_atualizacao','agente_atualizador'].forEach(k => {
    if (data[k]) html += `<div class="engineer-row"><span class="key">${esc(k)}:</span> <span class="val">${esc(data[k])}</span></div>`;
  });
  const doing = data.fazendo || [];
  if (doing.length > 0) {
    html += `<div class="engineer-row" style="margin-top:8px"><span class="key">FAZENDO (${doing.length}):</span></div>`;
    doing.forEach(t => html += `<div class="engineer-row" style="padding-left:12px">${esc(t.id || '?')} · ${esc(t.agente || '?')} · ${esc((t.desc || '').substring(0,120))}</div>`);
  }
  const hbs = data.heartbeats || [];
  if (hbs.length > 0) {
    html += `<div class="engineer-row" style="margin-top:8px"><span class="key">HEARTBEATS:</span></div>`;
    hbs.forEach(h => html += `<div class="engineer-row" style="padding-left:12px">${esc(h.agente)} · ${esc(h.ultima_atividade)} · ${esc(h.tarefa_atual || '')}</div>`);
  }
  return html;
}

function toggleHistory(btn) {
  const c = document.getElementById('hist-content');
  if (!c) return;
  const open = c.dataset.open !== '1';
  c.dataset.open = open ? '1' : '0';
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}
function toggleEngineer(btn) {
  const c = document.getElementById('eng-content');
  if (!c) return;
  const open = c.dataset.open !== '1';
  c.dataset.open = open ? '1' : '0';
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}

let lastRefresh = Date.now();
function updatePulse() {
  const s = Math.floor((Date.now() - lastRefresh) / 1000);
  const txt = s < 5 ? 'sincronizado agora'
            : s < 60 ? `sincronizado há ${s}s`
            : `sincronizado há ${Math.floor(s/60)}min`;
  const el = document.getElementById('pulso-text');
  const wrap = document.getElementById('pulso');
  if (el) el.textContent = txt;
  if (wrap) wrap.dataset.old = s > PULSE_STALE_S ? '1' : '0';
}

let lastHash = '';
function hash(d) { try { return JSON.stringify(d); } catch { return String(Date.now()); } }
function reload() {
  document.querySelectorAll('script[src^="kanban-data.js"]').forEach(s => s.remove());
  const s = document.createElement('script');
  s.src = 'kanban-data.js?t=' + Date.now();
  s.onload = () => {
    const h = hash(window.KANBAN_DATA);
    if (h !== lastHash) {
      lastHash = h;
      renderMain(window.KANBAN_DATA);
    }
    lastRefresh = Date.now();
    updatePulse();
  };
  document.head.appendChild(s);
}

if (window.KANBAN_DATA) {
  lastHash = hash(window.KANBAN_DATA);
  renderMain(window.KANBAN_DATA);
} else {
  setTimeout(() => renderMain(null), 400);
}

setInterval(reload, REFRESH_MS);
setInterval(updatePulse, 1000);
setInterval(() => { if (window.KANBAN_DATA) renderMain(window.KANBAN_DATA); }, 30000);
</script>
</body>
</html>
