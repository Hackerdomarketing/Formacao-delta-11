<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Comando — Formação Δ-11</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a0a0a;
    --bg-panel: #131313;
    --bg-card: #1a1a1a;
    --bg-card-hover: #202020;
    --border: #2a2a2a;
    --border-strong: #3a3a3a;

    --text-primary: #f5f5f5;
    --text-secondary: #b0b0b0;
    --text-muted: #707070;
    --text-dim: #4a4a4a;

    --calm: #4ade80;
    --calm-soft: rgba(74, 222, 128, 0.12);
    --alert: #fbbf24;
    --alert-soft: rgba(251, 191, 36, 0.12);
    --emergency: #ef4444;
    --emergency-soft: rgba(239, 68, 68, 0.12);
    --neutral: #60a5fa;

    --font-body: 'Outfit', sans-serif;
    --font-humano: 'Fraunces', serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(10,10,10,0.94) 0%, rgba(10,10,10,0.97) 40%, rgba(10,10,10,0.99) 100%),
      url('bg-delta11.png') center center / cover no-repeat;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  /* BARRA DE COMANDO — topo */
  .barra-comando {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
    gap: 20px;
    flex-wrap: wrap;
  }

  .projeto-nome {
    font-family: var(--font-humano);
    font-size: 22px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.3px;
  }

  .projeto-nome .delta {
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    display: block;
    margin-bottom: 4px;
  }

  .selo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-radius: 999px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.5px;
    transition: all 0.3s;
    border: 1px solid transparent;
  }

  .selo.calmo {
    background: var(--calm-soft);
    color: var(--calm);
    border-color: rgba(74, 222, 128, 0.3);
  }

  .selo.atencao {
    background: var(--alert-soft);
    color: var(--alert);
    border-color: rgba(251, 191, 36, 0.4);
    animation: pulse-atencao 2s ease-in-out infinite;
  }

  .selo.emergencia {
    background: var(--emergency-soft);
    color: var(--emergency);
    border-color: rgba(239, 68, 68, 0.5);
    animation: pulse-emergencia 1s ease-in-out infinite;
  }

  .selo-icone {
    font-size: 16px;
    line-height: 1;
  }

  /* PROGRESSO HONESTO */
  .progresso {
    margin-bottom: 32px;
    padding: 24px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 16px;
  }

  .progresso-topo {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .progresso-fase {
    font-family: var(--font-humano);
    font-size: 20px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.3px;
  }

  .progresso-percent {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 600;
    color: var(--calm);
  }

  .progresso-barra {
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .progresso-barra-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--calm) 0%, #22c55e 100%);
    border-radius: 4px;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
  }

  .progresso-info {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--text-secondary);
  }

  .progresso-info strong {
    color: var(--text-primary);
    font-weight: 600;
  }

  /* VOZ DO CRONOS */
  .voz-cronos {
    margin-bottom: 32px;
    padding: 28px 30px;
    background: var(--bg-panel);
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    position: relative;
  }

  .voz-cronos::before {
    content: '';
    position: absolute;
    left: 0;
    top: 20px;
    bottom: 20px;
    width: 3px;
    background: var(--calm);
    border-radius: 0 3px 3px 0;
  }

  .voz-cronos-texto {
    font-family: var(--font-humano);
    font-size: 18px;
    font-weight: 400;
    color: var(--text-primary);
    line-height: 1.55;
    letter-spacing: -0.1px;
  }

  .voz-cronos-assinatura {
    margin-top: 14px;
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.3px;
  }

  .voz-cronos-assinatura strong {
    color: var(--text-secondary);
    font-weight: 600;
  }

  /* CONVOCAÇÃO — só aparece quando precisa */
  .convocacao {
    margin-bottom: 32px;
    padding: 24px 28px;
    background: var(--alert-soft);
    border: 2px solid rgba(251, 191, 36, 0.4);
    border-radius: 16px;
    animation: pulse-atencao 2s ease-in-out infinite;
  }

  .convocacao-titulo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 700;
    color: var(--alert);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .convocacao-texto {
    font-family: var(--font-humano);
    font-size: 17px;
    color: var(--text-primary);
    line-height: 1.5;
  }

  /* SEÇÃO */
  .secao {
    margin-bottom: 32px;
  }

  .secao-titulo {
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--calm);
    animation: blink 2s ease-in-out infinite;
    box-shadow: 0 0 6px rgba(74, 222, 128, 0.6);
  }

  /* CARDS DE TAREFA */
  .tarefas {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .tarefa {
    padding: 16px 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: all 0.2s;
  }

  .tarefa:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-strong);
  }

  .tarefa.sem-sinal {
    border-color: rgba(251, 191, 36, 0.35);
    background: rgba(251, 191, 36, 0.05);
  }

  .tarefa-status {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .tarefa-status.ativo {
    background: var(--calm);
    box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
    animation: blink 2s ease-in-out infinite;
  }

  .tarefa-status.sem-sinal {
    background: var(--alert);
    box-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
  }

  .tarefa-conteudo {
    flex: 1;
    min-width: 0;
  }

  .tarefa-texto {
    font-family: var(--font-humano);
    font-size: 16px;
    color: var(--text-primary);
    line-height: 1.4;
    margin-bottom: 4px;
  }

  .tarefa-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--text-muted);
  }

  .tarefa-agente {
    font-family: var(--font-body);
    font-weight: 600;
    color: var(--neutral);
    letter-spacing: 0.5px;
  }

  .tarefa-tempo {
    font-family: var(--font-body);
    color: var(--text-muted);
  }

  .tarefa-tempo.velho {
    color: var(--alert);
    font-weight: 600;
  }

  .tarefa-id {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    margin-left: auto;
  }

  /* HISTÓRICO */
  .historico-item {
    padding: 12px 16px;
    background: rgba(74, 222, 128, 0.03);
    border: 1px solid rgba(74, 222, 128, 0.1);
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .historico-item .check {
    color: var(--calm);
    font-weight: 700;
  }

  .historico-item .meta {
    margin-left: auto;
    color: var(--text-muted);
    font-size: 12px;
  }

  .historico-link {
    margin-top: 12px;
    text-align: center;
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    transition: color 0.2s;
    user-select: none;
  }

  .historico-link:hover {
    color: var(--text-secondary);
  }

  .historico-lista {
    margin-top: 12px;
    max-height: 400px;
    overflow-y: auto;
    display: none;
  }

  .historico-lista.aberto {
    display: block;
  }

  /* ESTADO VAZIO */
  .vazio {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-muted);
    font-family: var(--font-humano);
    font-size: 15px;
    font-style: italic;
  }

  /* ANIMAÇÕES */
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  @keyframes pulse-atencao {
    0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.35); }
    50% { box-shadow: 0 0 30px 0 rgba(251, 191, 36, 0.15); }
  }

  @keyframes pulse-emergencia {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.45); }
    50% { box-shadow: 0 0 40px 0 rgba(239, 68, 68, 0.25); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade-in {
    animation: fadeIn 0.4s ease-out both;
  }

  /* PROJETO VAZIO */
  .estado-inicial {
    text-align: center;
    padding: 80px 20px;
  }

  .estado-inicial-delta {
    font-family: var(--font-body);
    font-size: 100px;
    font-weight: 800;
    color: var(--text-dim);
    opacity: 0.15;
    line-height: 1;
    margin-bottom: 20px;
  }

  .estado-inicial-titulo {
    font-family: var(--font-humano);
    font-size: 22px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    font-weight: 500;
  }

  .estado-inicial-texto {
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--text-muted);
    max-width: 380px;
    margin: 0 auto 24px;
    line-height: 1.6;
  }

  .estado-inicial-codigo {
    display: inline-block;
    padding: 12px 24px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--calm);
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
</style>
</head>
<body>

<div class="container" id="container">
  <!-- conteúdo renderizado por JS -->
</div>

<script src="kanban-data.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// PAINEL DE COMANDO v5.1 — Formação Δ-11
// Filosofia: comando sem decifração.
// O comandante é passageiro num avião, não piloto.
// ═══════════════════════════════════════════════════════════════

const NOMES_AGENTES = {
  ATLAS: 'Arquiteto',
  CRONOS: 'Gerente',
  FRONT: 'Interface',
  PIXEL: 'Visual',
  FORM: 'Formulários',
  BACK: 'Servidor',
  ENGINE: 'Motor',
  VAULT: 'Banco',
  SHIELD: 'Qualidade',
  SCOUT: 'Diagnóstico'
};

const LIMITE_HEARTBEAT_MINUTOS = 5;
const LIMITE_TAREFA_VELHA_MINUTOS = 30;
const REFRESH_MS = 5000;
const HISTORICO_RECENTE_TAMANHO = 5;

// ═══════════════════════════════════════════════════════════════
// UTILITÁRIOS DE TEMPO
// ═══════════════════════════════════════════════════════════════

function parseTimestamp(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  return isNaN(d) ? null : d;
}

function tempoRelativo(iso) {
  const d = parseTimestamp(iso);
  if (!d) return null;
  const diffMs = Date.now() - d.getTime();
  const diffMin = Math.floor(diffMs / 60000);
  if (diffMin < 1) return 'agora';
  if (diffMin === 1) return 'há 1 minuto';
  if (diffMin < 60) return `há ${diffMin} minutos`;
  const diffH = Math.floor(diffMin / 60);
  if (diffH === 1) return 'há 1 hora';
  if (diffH < 24) return `há ${diffH} horas`;
  const diffD = Math.floor(diffH / 24);
  if (diffD === 1) return 'há 1 dia';
  return `há ${diffD} dias`;
}

function minutosDesde(iso) {
  const d = parseTimestamp(iso);
  if (!d) return null;
  return Math.floor((Date.now() - d.getTime()) / 60000);
}

// ═══════════════════════════════════════════════════════════════
// TRADUÇÃO AUTOMÁTICA — FALLBACK quando resumo_humano ausente
// ═══════════════════════════════════════════════════════════════

const PADROES_TRADUCAO = [
  { regex: /\[IMPACTO-MUDANCA\]/i, fala: 'Fazendo uma mudança de impacto no sistema' },
  { regex: /migration|migração|migrations/i, fala: 'Mexendo na estrutura do banco de dados' },
  { regex: /webhook|webhooks/i, fala: 'Configurando integração externa' },
  { regex: /rota|route|api\//i, fala: 'Criando uma rota do servidor' },
  { regex: /contract test|contract-tester|contract_test/i, fala: 'Testando contratos do sistema' },
  { regex: /tabela|table|schema/i, fala: 'Trabalhando na estrutura do banco' },
  { regex: /componente|component|tela|page\.tsx/i, fala: 'Construindo uma tela' },
  { regex: /formulário|formulario|form|validation/i, fala: 'Fazendo formulário' },
  { regex: /auth|autenticação|login/i, fala: 'Trabalhando na autenticação' },
  { regex: /orquestrar|orquestração/i, fala: 'Coordenando os agentes' },
  { regex: /merge|revisão/i, fala: 'Consolidando trabalho pronto' },
  { regex: /bug|error|erro|corrigir/i, fala: 'Corrigindo um problema' },
  { regex: /teste|test|spec/i, fala: 'Testando o sistema' }
];

function traduzirParaHumano(tarefa) {
  if (tarefa.resumo_humano) return tarefa.resumo_humano;

  const texto = (tarefa.desc || '').toString();
  for (const p of PADROES_TRADUCAO) {
    if (p.regex.test(texto)) return p.fala;
  }

  const limpo = texto
    .replace(/\[[^\]]+\]/g, '')
    .replace(/`[^`]+`/g, '')
    .replace(/T-[A-Z0-9-]+/gi, '')
    .replace(/\s+/g, ' ')
    .trim();
  const primeiroPonto = limpo.indexOf('.');
  const corte = primeiroPonto > 0 && primeiroPonto < 80 ? primeiroPonto : 80;
  return limpo.substring(0, corte).trim() || 'Trabalhando na próxima etapa';
}

// ═══════════════════════════════════════════════════════════════
// SELO BINÁRIO — SEGURO FECHAR / PRECISA DE VOCÊ / QUEBROU
// ═══════════════════════════════════════════════════════════════

function calcularSelo(data) {
  if (!data) return { estado: 'calmo', icone: '✓', texto: 'AGUARDANDO' };

  const bloqueados = data.bloqueado || [];
  if (bloqueados.length > 0) {
    return {
      estado: 'emergencia',
      icone: '⚠',
      texto: `${bloqueados.length} TRAVADO${bloqueados.length > 1 ? 'S' : ''}`
    };
  }

  const fazendo = data.fazendo || [];
  const heartbeats = data.heartbeats || [];

  for (const t of fazendo) {
    const hb = heartbeats.find(h => h.agente === t.agente);
    if (hb) {
      const min = minutosDesde(hb.ultima_atividade);
      if (min !== null && min > LIMITE_HEARTBEAT_MINUTOS) {
        return { estado: 'atencao', icone: '!', texto: 'AGENTE SEM SINAL' };
      }
    }
  }

  for (const t of fazendo) {
    const min = minutosDesde(t.inicio);
    if (min !== null && min > LIMITE_TAREFA_VELHA_MINUTOS) {
      return { estado: 'atencao', icone: '!', texto: 'TAREFA DEMORANDO' };
    }
  }

  if (data.mensagem_cronos && data.mensagem_cronos.precisa_comandante) {
    return { estado: 'atencao', icone: '!', texto: 'PRECISA DE VOCÊ' };
  }

  if (fazendo.length > 0) {
    return { estado: 'calmo', icone: '✓', texto: 'SEGURO FECHAR' };
  }

  return { estado: 'calmo', icone: '✓', texto: 'DESCANSANDO' };
}

// ═══════════════════════════════════════════════════════════════
// PROGRESSO
// ═══════════════════════════════════════════════════════════════

function calcularProgresso(data) {
  if (!data) return { concluidas: 0, total: 0, pct: 0 };

  const concluidas = (data.concluido || []).length;
  let pendentes = 0;
  Object.values(data.a_fazer || {}).forEach(arr => pendentes += arr.length);
  const fazendo = (data.fazendo || []).length;
  const revisao = (data.revisao || []).length;
  const bloqueado = (data.bloqueado || []).length;

  const total = concluidas + pendentes + fazendo + revisao + bloqueado;
  const pct = total > 0 ? Math.round((concluidas / total) * 100) : 0;

  return { concluidas, total, pct, pendentes, fazendo, revisao };
}

// ═══════════════════════════════════════════════════════════════
// STATUS HEARTBEAT
// ═══════════════════════════════════════════════════════════════

function statusHeartbeatTarefa(tarefa, heartbeats) {
  const hb = (heartbeats || []).find(h => h.agente === tarefa.agente);
  if (!hb) return 'sem-heartbeat';
  const min = minutosDesde(hb.ultima_atividade);
  if (min === null) return 'sem-heartbeat';
  if (min > LIMITE_HEARTBEAT_MINUTOS) return 'sem-sinal';
  return 'ativo';
}

// ═══════════════════════════════════════════════════════════════
// EXTRAÇÃO DE FASE SIMPLES
// ═══════════════════════════════════════════════════════════════

function extrairFaseSimples(faseCompleta) {
  if (!faseCompleta) return 'Sem fase definida';
  const s = faseCompleta.toString();

  const ondaMatch = s.match(/onda\s*(\d+)/i);
  const cicloMatch = s.match(/ciclo\s*([A-Z0-9]+)/i);
  const faseMatch = s.match(/fase\s*(\d+)/i);

  if (cicloMatch && ondaMatch) return `Ciclo ${cicloMatch[1]} · Onda ${ondaMatch[1]}`;
  if (ondaMatch) return `Onda ${ondaMatch[1]}`;
  if (cicloMatch) return `Ciclo ${cicloMatch[1]}`;
  if (faseMatch) return `Fase ${faseMatch[1]}`;

  const primeiroPonto = s.indexOf('.');
  const corte = primeiroPonto > 0 && primeiroPonto < 60 ? primeiroPonto : 60;
  return s.substring(0, corte).trim();
}

function escapar(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ═══════════════════════════════════════════════════════════════
// RENDER — ESTADO INICIAL
// ═══════════════════════════════════════════════════════════════

function renderEstadoInicial() {
  return `
    <div class="estado-inicial fade-in">
      <div class="estado-inicial-delta">Δ</div>
      <div class="estado-inicial-titulo">Aguardando missão</div>
      <div class="estado-inicial-texto">
        Nenhum projeto ativo no momento. Abra o Claude Code e ative a Formação Delta-11 com o comando:
      </div>
      <div class="estado-inicial-codigo">d11 + descrição do projeto</div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════════
// RENDER PRINCIPAL
// ═══════════════════════════════════════════════════════════════

function renderPainel(data) {
  if (!data || !data.projeto) return renderEstadoInicial();

  const selo = calcularSelo(data);
  const progresso = calcularProgresso(data);
  const mensagemCronos = data.mensagem_cronos;
  const fazendo = data.fazendo || [];
  const heartbeats = data.heartbeats || [];
  const concluido = data.concluido || [];
  const concluidoRecente = concluido.slice(-HISTORICO_RECENTE_TAMANHO).reverse();
  const totalConcluido = concluido.length;
  const historicoAntigo = concluido.slice(0, -HISTORICO_RECENTE_TAMANHO).reverse();

  const faseTexto = extrairFaseSimples(data.fase_atual);

  let html = '';

  // Barra de comando
  html += `
    <div class="barra-comando fade-in">
      <div class="projeto-nome">
        <span class="delta">Δ-11 · Painel de Comando</span>
        ${escapar(data.projeto)}
      </div>
      <div class="selo ${selo.estado}">
        <span class="selo-icone">${selo.icone}</span>
        ${selo.texto}
      </div>
    </div>
  `;

  // Progresso
  html += `
    <div class="progresso fade-in">
      <div class="progresso-topo">
        <div class="progresso-fase">${escapar(faseTexto)}</div>
        <div class="progresso-percent">${progresso.pct}%</div>
      </div>
      <div class="progresso-barra">
        <div class="progresso-barra-fill" style="width: ${progresso.pct}%"></div>
      </div>
      <div class="progresso-info">
        <span><strong>${progresso.concluidas}</strong> tarefas prontas de <strong>${progresso.total}</strong></span>
        <span>${progresso.fazendo} em execução${progresso.revisao > 0 ? ' · ' + progresso.revisao + ' em revisão' : ''}${progresso.pendentes > 0 ? ' · ' + progresso.pendentes + ' pendentes' : ''}</span>
      </div>
    </div>
  `;

  // Voz do CRONOS
  if (mensagemCronos && mensagemCronos.texto) {
    html += `
      <div class="voz-cronos fade-in">
        <div class="voz-cronos-texto">${escapar(mensagemCronos.texto)}</div>
        <div class="voz-cronos-assinatura">
          — <strong>CRONOS</strong> · ${tempoRelativo(mensagemCronos.timestamp) || 'sem carimbo'}
        </div>
      </div>
    `;
  } else {
    html += `
      <div class="voz-cronos fade-in" style="opacity: 0.55">
        <div class="voz-cronos-texto" style="font-style: italic; color: var(--text-muted);">
          Sem atualização recente do CRONOS.
        </div>
      </div>
    `;
  }

  // Convocação (só quando precisa)
  if (mensagemCronos && mensagemCronos.precisa_comandante) {
    html += `
      <div class="convocacao fade-in">
        <div class="convocacao-titulo">
          <span>⚠</span> Precisa de você
        </div>
        <div class="convocacao-texto">${escapar(mensagemCronos.precisa_comandante)}</div>
      </div>
    `;
  }

  // Acontecendo agora
  html += `
    <div class="secao fade-in">
      <div class="secao-titulo">
        <span class="live-dot"></span>
        Acontecendo agora
      </div>
      <div class="tarefas">
  `;

  if (fazendo.length === 0) {
    html += `<div class="vazio">Nenhuma tarefa em execução no momento.</div>`;
  } else {
    fazendo.forEach(t => {
      const statusHb = statusHeartbeatTarefa(t, heartbeats);
      const semSinal = statusHb === 'sem-sinal';
      const humano = traduzirParaHumano(t);
      const hb = heartbeats.find(h => h.agente === t.agente);
      const tempoIso = hb ? hb.ultima_atividade : t.inicio;
      const tempo = tempoRelativo(tempoIso);
      const minutosParado = minutosDesde(tempoIso);
      const tempoClasse = (minutosParado !== null && minutosParado > LIMITE_HEARTBEAT_MINUTOS) ? 'velho' : '';

      html += `
        <div class="tarefa ${semSinal ? 'sem-sinal' : ''}">
          <div class="tarefa-status ${semSinal ? 'sem-sinal' : 'ativo'}"></div>
          <div class="tarefa-conteudo">
            <div class="tarefa-texto">${escapar(humano)}</div>
            <div class="tarefa-meta">
              <span class="tarefa-agente">${escapar(t.agente || '?')}</span>
              ${NOMES_AGENTES[t.agente] ? `<span>· ${NOMES_AGENTES[t.agente]}</span>` : ''}
              <span class="tarefa-tempo ${tempoClasse}">${tempo || 'sem tempo'}${semSinal ? ' · sem sinal' : ''}</span>
              <span class="tarefa-id">${escapar(t.id || '')}</span>
            </div>
          </div>
        </div>
      `;
    });
  }

  html += `</div></div>`;

  // Histórico recente
  if (concluidoRecente.length > 0) {
    html += `
      <div class="secao fade-in">
        <div class="secao-titulo">Aconteceu há pouco</div>
    `;
    concluidoRecente.forEach(t => {
      html += `
        <div class="historico-item">
          <span class="check">✓</span>
          <span>${escapar(traduzirParaHumano(t))}</span>
          <span class="meta">${escapar(t.por || '')}${t.data ? ' · ' + escapar(t.data) : ''}</span>
        </div>
      `;
    });

    if (historicoAntigo.length > 0) {
      html += `
        <div class="historico-link" onclick="toggleHistorico(this)">
          Ver histórico completo (${historicoAntigo.length} outras tarefas) →
        </div>
        <div class="historico-lista">
          ${historicoAntigo.map(t => `
            <div class="historico-item">
              <span class="check">✓</span>
              <span>${escapar(traduzirParaHumano(t))}</span>
              <span class="meta">${escapar(t.por || '')}${t.data ? ' · ' + escapar(t.data) : ''}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    html += `</div>`;
  }

  return html;
}

function toggleHistorico(el) {
  const lista = el.nextElementSibling;
  if (!lista) return;
  const aberto = lista.classList.toggle('aberto');
  if (aberto) {
    el.textContent = '↑ Fechar histórico';
  } else {
    const total = lista.querySelectorAll('.historico-item').length;
    el.textContent = `Ver histórico completo (${total} outras tarefas) →`;
  }
}

// ═══════════════════════════════════════════════════════════════
// RENDER + AUTO-REFRESH
// ═══════════════════════════════════════════════════════════════

let ultimoHash = '';

function hashData(d) {
  try { return JSON.stringify(d); } catch { return String(Date.now()); }
}

function render() {
  const data = window.KANBAN_DATA;
  document.getElementById('container').innerHTML = renderPainel(data);
  ultimoHash = hashData(data);
}

function refreshData() {
  const scripts = document.querySelectorAll('script[src^="kanban-data.js"]');
  scripts.forEach(s => s.remove());

  const s = document.createElement('script');
  s.src = 'kanban-data.js?t=' + Date.now();
  s.onload = () => {
    const hash = hashData(window.KANBAN_DATA);
    if (hash !== ultimoHash) {
      render();
    }
  };
  s.onerror = () => console.warn('Falha ao recarregar kanban-data.js');
  document.head.appendChild(s);
}

if (window.KANBAN_DATA) {
  render();
} else {
  document.getElementById('container').innerHTML = renderEstadoInicial();
}

setInterval(refreshData, REFRESH_MS);

// Re-render a cada 30s para atualizar tempos relativos ("há 2 min" → "há 3 min")
setInterval(() => {
  if (window.KANBAN_DATA) render();
}, 30000);
</script>
</body>
</html>
