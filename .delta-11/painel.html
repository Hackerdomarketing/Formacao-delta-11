<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Δ-11 · Score de Vantagem V3.0</title>
<meta name="theme-color" content="#080808">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   PAINEL v6 · SALA DE OPERAÇÕES · Formação Δ-11
   Visão de produto do zero. Comando sem decifração.
   Steve Jobs + Analista dos 3 Vetores + preservações Δ-11.
   ═══════════════════════════════════════════════════════════════ */

/* ─── TOKENS ────────────────────────────────────────────────── */
:root {
  /* Superfícies (paleta preta Δ-11 preservada) */
  --surface-0: #050505;      /* void */
  --surface-1: #0a0a0a;      /* base */
  --surface-2: #101010;      /* elevated */
  --surface-3: #161616;      /* card */
  --surface-4: #1c1815;      /* card-hover (whisper red) */

  /* Bordas */
  --line-1: rgba(255,255,255,0.06);
  --line-2: rgba(255,255,255,0.10);
  --line-3: rgba(255,255,255,0.16);
  --line-brand: rgba(255,32,32,0.4);

  /* Δ-11 vermelho (preservado + escala) */
  --brand: #ff2020;
  --brand-strong: #ff3535;
  --brand-glow: rgba(255,32,32,0.55);
  --brand-glow-soft: rgba(255,32,32,0.12);
  --brand-wash: rgba(255,32,32,0.04);

  /* Estados semânticos (contraste AA verificado em fundo #0a0a0a) */
  --calm: #5ce68a;           /* 12.8:1 */
  --calm-soft: rgba(92,230,138,0.08);
  --calm-line: rgba(92,230,138,0.22);
  --alert: #ffb020;          /* 10.4:1 */
  --alert-soft: rgba(255,176,32,0.08);
  --alert-line: rgba(255,176,32,0.35);
  --danger: #ff2020;
  --danger-soft: rgba(255,32,32,0.08);

  /* Texto (contraste testado) */
  --ink-100: #f5f5f5;        /* 18.7:1 */
  --ink-80: #d4d4d4;         /* 13:1 */
  --ink-60: #a0a0a0;         /* 7.3:1 */
  --ink-40: #6b6b6b;         /* 4.5:1 · limite WCAG AA */
  --ink-20: #3a3a3a;         /* decorativo apenas */

  /* Tipografia — escala 1.250 Major Third */
  --font-body: 'Outfit', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  --t-2xs: 0.6875rem;   /* 11px · micro */
  --t-xs: 0.75rem;      /* 12px · meta */
  --t-sm: 0.875rem;     /* 14px · aux */
  --t-md: 1rem;         /* 16px · body */
  --t-lg: 1.25rem;      /* 20px · destaque */
  --t-xl: 1.5625rem;    /* 25px · voz do CRONOS */
  --t-2xl: 1.953rem;    /* 31px · projeto */
  --t-hero: 3.5rem;     /* 56px · selo binário */

  /* Espaçamento — múltiplos de 4 */
  --s-1: 4px;  --s-2: 8px;   --s-3: 12px;  --s-4: 16px;
  --s-5: 20px; --s-6: 24px;  --s-8: 32px;  --s-10: 40px;
  --s-12: 48px; --s-16: 64px; --s-20: 80px; --s-24: 96px;

  /* Raios */
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 14px;
  --r-xl: 20px;
  --r-full: 999px;

  /* Timing */
  --ease-out: cubic-bezier(0, 0, 0.2, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1);
  --ease-both: cubic-bezier(0.4, 0, 0.2, 1);
  --d-fast: 150ms;
  --d-base: 250ms;
  --d-slow: 400ms;

  /* Sombras / glows */
  --glow-brand: 0 0 24px var(--brand-glow-soft);
  --glow-alert: 0 0 24px rgba(255,176,32,0.15);
  --shadow-lift: 0 8px 32px rgba(0,0,0,0.5);

  /* Layout */
  --container: 720px;
}

/* ─── RESET ─────────────────────────────────────────────────── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  font-size: var(--t-md);
  line-height: 1.5;
  background: var(--surface-1);
  color: var(--ink-100);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

/* Fundo bg-delta11.png preservado, mas rebaixado — não compete mais com conteúdo */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 50% 20%, rgba(255,32,32,0.03), transparent 60%),
    linear-gradient(180deg, rgba(5,5,5,0.94), rgba(5,5,5,0.98)),
    url('bg-delta11.png') center center / cover no-repeat;
  pointer-events: none;
  z-index: 0;
}

/* Grid militar sutil — quase invisível */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 80px 80px;
  pointer-events: none;
  z-index: 0;
}

/* ─── SKIP LINK ─────────────────────────────────────────────── */
.skip {
  position: absolute;
  top: -100px;
  left: var(--s-4);
  z-index: 999;
  padding: var(--s-3) var(--s-5);
  background: var(--brand);
  color: white;
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  text-decoration: none;
  border-radius: var(--r-sm);
  transition: top var(--d-base) var(--ease-out);
}
.skip:focus { top: var(--s-4); }

:focus-visible {
  outline: 2px solid var(--brand-strong);
  outline-offset: 3px;
  border-radius: var(--r-sm);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ═══════════════════════════════════════════════════════════════
   CABEÇALHO — mínimo. Logo + identificação. Sem selo aqui.
   ═══════════════════════════════════════════════════════════════ */
.top {
  position: relative;
  z-index: 2;
  padding: var(--s-6) var(--s-8);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-6);
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-40);
}
.brand-mark {
  font-family: var(--font-body);
  font-size: 1.375rem;
  font-weight: 900;
  color: var(--brand);
  text-shadow: 0 0 18px var(--brand-glow-soft);
  line-height: 1;
  letter-spacing: -0.02em;
}
.brand-mark .num { color: var(--ink-80); }
.brand-divider { width: 1px; height: 20px; background: var(--line-2); }

.pulso {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 500;
  letter-spacing: 0.15em;
  color: var(--ink-40);
  text-transform: uppercase;
}
.pulso-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--calm);
  box-shadow: 0 0 8px rgba(92,230,138,0.6);
  animation: dot-pulse 2s ease-in-out infinite;
}
.pulso[data-old="1"] .pulso-dot {
  background: var(--alert);
  box-shadow: 0 0 8px rgba(255,176,32,0.6);
}
@keyframes dot-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

/* ═══════════════════════════════════════════════════════════════
   CONTAINER PRINCIPAL — uma coluna centralizada, respirando
   ═══════════════════════════════════════════════════════════════ */
.main {
  position: relative;
  z-index: 1;
  max-width: var(--container);
  margin: 0 auto;
  padding: var(--s-10) var(--s-6) var(--s-24);
}

/* ─── BLOCO 1 · IDENTIFICAÇÃO DO PROJETO (discreta) ─────────── */
.project {
  text-align: center;
  margin-bottom: var(--s-10);
}
.project-tag {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 600;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--brand);
  text-shadow: 0 0 12px var(--brand-glow-soft);
  margin-bottom: var(--s-3);
}
.project-name {
  font-family: var(--font-body);
  font-size: var(--t-2xl);
  font-weight: 300;
  color: var(--ink-100);
  letter-spacing: -0.02em;
  line-height: 1.15;
}

/* ─── BLOCO 2 · SELO BINÁRIO — o momento de arrepio ─────────── */
.verdict {
  margin-bottom: var(--s-12);
  text-align: center;
  animation: rise 600ms var(--ease-out) both;
}

.verdict-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--s-4);
  padding: var(--s-4) var(--s-8);
  border-radius: var(--r-full);
  border: 1.5px solid;
  font-family: var(--font-mono);
  font-size: var(--t-md);
  font-weight: 700;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  transition: all var(--d-base) var(--ease-both);
  margin-bottom: var(--s-5);
}
.verdict-badge[data-state="calm"] {
  background: var(--calm-soft);
  border-color: var(--calm-line);
  color: var(--calm);
  text-shadow: 0 0 16px rgba(92,230,138,0.6);
}
.verdict-badge[data-state="alert"] {
  background: var(--alert-soft);
  border-color: var(--alert-line);
  color: var(--alert);
  text-shadow: 0 0 16px rgba(255,176,32,0.7);
  animation: alert-breath 2.6s ease-in-out infinite;
}
.verdict-badge[data-state="danger"] {
  background: var(--danger-soft);
  border-color: var(--brand);
  color: var(--brand);
  text-shadow: 0 0 20px var(--brand-glow);
  animation: danger-breath 1.4s ease-in-out infinite;
}
.verdict-icon {
  font-size: 1.4em;
  line-height: 1;
  letter-spacing: 0;
}
@keyframes alert-breath {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,176,32,0.28); }
  50% { box-shadow: 0 0 40px 0 rgba(255,176,32,0.2); }
}
@keyframes danger-breath {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,32,32,0.4); }
  50% { box-shadow: 0 0 48px 0 rgba(255,32,32,0.3); }
}

.verdict-line {
  font-family: var(--font-body);
  font-size: var(--t-lg);
  font-weight: 300;
  color: var(--ink-80);
  line-height: 1.4;
  max-width: 480px;
  margin: 0 auto;
  letter-spacing: -0.005em;
}

/* ─── BLOCO 3 · CONVOCAÇÃO — só quando existe ───────────────── */
.summon {
  background: var(--alert-soft);
  border: 1.5px solid var(--alert-line);
  border-radius: var(--r-lg);
  padding: var(--s-6) var(--s-8);
  margin-bottom: var(--s-10);
  animation: rise 500ms var(--ease-out) both, glow-alert 3s ease-in-out infinite;
}
.summon-label {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--alert);
  margin-bottom: var(--s-3);
  display: flex;
  align-items: center;
  gap: var(--s-2);
}
.summon-text {
  font-family: var(--font-body);
  font-size: var(--t-lg);
  color: var(--ink-100);
  line-height: 1.5;
  font-weight: 400;
}
@keyframes glow-alert {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
  50% { box-shadow: var(--glow-alert); }
}

/* ─── BLOCO 4 · TRANSMISSÃO DO CRONOS ───────────────────────── */
.transmission {
  background: linear-gradient(180deg, rgba(28,20,20,0.65), rgba(20,16,16,0.65));
  border: 1px solid var(--line-1);
  border-radius: var(--r-lg);
  padding: var(--s-8);
  margin-bottom: var(--s-10);
  position: relative;
  animation: rise 500ms var(--ease-out) 150ms both;
}
.transmission::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 3px;
  background: var(--brand);
  box-shadow: 0 0 12px var(--brand-glow-soft);
  border-radius: var(--r-lg) 0 0 var(--r-lg);
}
.transmission-label {
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 600;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--brand);
  text-shadow: 0 0 10px var(--brand-glow-soft);
  margin-bottom: var(--s-4);
  display: block;
}
.transmission-text {
  font-family: var(--font-body);
  font-size: var(--t-xl);
  font-weight: 300;
  color: var(--ink-100);
  line-height: 1.5;
  letter-spacing: -0.005em;
}
.transmission-sign {
  margin-top: var(--s-5);
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  color: var(--ink-40);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
.transmission[data-state="empty"] {
  border-color: var(--line-1);
  opacity: 0.55;
  padding: var(--s-5) var(--s-8);
}
.transmission[data-state="empty"]::before { background: var(--ink-20); box-shadow: none; }
.transmission[data-state="empty"] .transmission-label { color: var(--ink-40); text-shadow: none; }
.transmission[data-state="empty"] .transmission-text {
  font-size: var(--t-md);
  font-style: italic;
  color: var(--ink-40);
}

/* ─── BLOCO 5 · MISSÃO (progresso + agentes ativos unificados) */
.mission {
  margin-bottom: var(--s-10);
  animation: rise 500ms var(--ease-out) 300ms both;
}

.section-header {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  padding-bottom: var(--s-4);
  margin-bottom: var(--s-5);
  border-bottom: 1px solid var(--line-1);
}
.section-arrow {
  color: var(--brand);
  font-family: var(--font-mono);
  font-size: var(--t-sm);
  line-height: 1;
}
.section-title {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ink-80);
}
.section-meta {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  color: var(--ink-40);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

/* Trilha de ondas — visual de mission control */
.wave-track {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--s-4);
  margin-bottom: var(--s-8);
  padding: var(--s-5) var(--s-6);
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--line-1);
  border-radius: var(--r-md);
}
.wave-line {
  display: flex;
  align-items: center;
  gap: var(--s-3);
}
.wave-node {
  display: flex;
  align-items: center;
  gap: var(--s-2);
  flex-shrink: 0;
}
.wave-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: transparent;
  border: 1.5px solid var(--ink-20);
  transition: all var(--d-base) var(--ease-out);
  flex-shrink: 0;
}
.wave-dot[data-state="done"] {
  background: var(--calm);
  border-color: var(--calm);
  box-shadow: 0 0 10px rgba(92,230,138,0.5);
}
.wave-dot[data-state="current"] {
  background: var(--brand);
  border-color: var(--brand);
  box-shadow: 0 0 14px var(--brand-glow);
  animation: current-pulse 1.6s ease-in-out infinite;
}
.wave-connector {
  flex: 1;
  height: 1.5px;
  background: linear-gradient(90deg, var(--ink-20) 0%, var(--ink-20) 100%);
  transition: background var(--d-base) var(--ease-out);
}
.wave-connector[data-state="done"] {
  background: linear-gradient(90deg, var(--calm) 0%, var(--brand) 100%);
}
.wave-label {
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  color: var(--ink-40);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  white-space: nowrap;
}
.wave-label[data-state="current"] {
  color: var(--brand);
  font-weight: 700;
}
.wave-label[data-state="done"] {
  color: var(--calm);
}
.wave-estimate {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  color: var(--ink-60);
  letter-spacing: 0.1em;
  text-align: center;
  padding-top: var(--s-3);
  border-top: 1px solid var(--line-1);
}
@keyframes current-pulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 14px var(--brand-glow); }
  50% { transform: scale(1.25); box-shadow: 0 0 22px rgba(255,32,32,0.7); }
}

/* Lista de agentes em ação — linhas de operação (Warp/Linear pattern) */
.ops {
  display: flex;
  flex-direction: column;
}
.op-line {
  display: grid;
  grid-template-columns: 90px 1fr auto;
  gap: var(--s-4);
  align-items: baseline;
  padding: var(--s-4) var(--s-2);
  border-bottom: 1px solid var(--line-1);
  transition: background var(--d-fast) var(--ease-out);
}
.op-line:last-child { border-bottom: none; }
.op-line:hover { background: rgba(255,255,255,0.015); }
.op-line[data-state="stalled"] {
  background: rgba(255,176,32,0.03);
}

.op-agent {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--brand);
  text-shadow: 0 0 8px var(--brand-glow-soft);
  display: flex;
  align-items: center;
  gap: var(--s-2);
}
.op-line[data-state="stalled"] .op-agent {
  color: var(--alert);
  text-shadow: 0 0 8px rgba(255,176,32,0.5);
}
.op-marker {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--brand);
  box-shadow: 0 0 6px var(--brand-glow);
  animation: dot-pulse 2s ease-in-out infinite;
  flex-shrink: 0;
}
.op-line[data-state="stalled"] .op-marker {
  background: var(--alert);
  box-shadow: 0 0 6px rgba(255,176,32,0.6);
  animation: none;
}

.op-action {
  font-family: var(--font-body);
  font-size: var(--t-md);
  color: var(--ink-100);
  font-weight: 400;
  line-height: 1.4;
  letter-spacing: -0.005em;
}

.op-time {
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  color: var(--ink-40);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  white-space: nowrap;
}
.op-line[data-state="stalled"] .op-time {
  color: var(--alert);
  font-weight: 700;
}

.ops-empty {
  padding: var(--s-6);
  text-align: center;
  font-family: var(--font-body);
  font-size: var(--t-md);
  color: var(--ink-40);
  font-style: italic;
}

/* Bloqueados (emergência) — mesma linha de operação, cor vermelha */
.op-line[data-state="blocked"] {
  background: var(--danger-soft);
  border-left: 3px solid var(--brand);
  padding-left: var(--s-4);
  animation: block-breath 2s ease-in-out infinite;
}
.op-line[data-state="blocked"] .op-agent {
  color: var(--brand);
}
.op-blocked-reason {
  grid-column: 2 / 4;
  font-family: var(--font-body);
  font-size: var(--t-sm);
  color: var(--brand);
  font-style: italic;
  margin-top: var(--s-2);
  padding-top: var(--s-2);
  border-top: 1px solid rgba(255,32,32,0.15);
}
@keyframes block-breath {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
  50% { box-shadow: inset 0 0 24px rgba(255,32,32,0.08); }
}

/* ─── BLOCO 6 · HISTÓRICO — sutil, colapsado ────────────────── */
.history-block {
  margin-bottom: var(--s-8);
  animation: rise 500ms var(--ease-out) 450ms both;
}
.history-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-4);
  width: 100%;
  padding: var(--s-4) var(--s-5);
  background: transparent;
  border: 1px solid var(--line-1);
  border-radius: var(--r-md);
  color: var(--ink-60);
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all var(--d-fast) var(--ease-out);
  text-align: left;
  min-height: 44px;
}
.history-toggle:hover {
  background: var(--calm-soft);
  border-color: var(--calm-line);
  color: var(--calm);
}
.history-toggle .count {
  color: var(--calm);
  font-weight: 700;
}
.history-toggle .chevron {

}

}
.history-content {
  display: none;
  margin-top: var(--s-3);

  overflow-y: auto;
  padding-right: var(--s-2);
}
.history-content[data-open="1"] {
  display: block;
  animation: rise 300ms var(--ease-out) both;
}

  display: grid;
  grid-template-columns: 20px 1fr auto;
  gap: var(--s-3);
  align-items: baseline;
  padding: var(--s-3) var(--s-4);
  border-bottom: 1px solid var(--line-1);
  font-family: var(--font-body);
  font-size: var(--t-sm);
  color: var(--ink-60);
}
.history-item:last-child { border-bottom: none; }
.history-item .check {
  color: var(--calm);
  font-weight: 700;
  line-height: 1;
}
.history-item .who {
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  color: var(--ink-40);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

/* ─── BLOCO 7 · MODO ENGENHEIRO ─────────────────────────────── */
.engineer {
  padding-top: var(--s-8);
  border-top: 1px solid var(--line-1);
  animation: rise 500ms var(--ease-out) 600ms both;
}
.engineer-toggle {
  display: block;
  width: 100%;
  padding: var(--s-3) var(--s-4);
  background: transparent;
  border: none;
  color: var(--ink-40);
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  font-weight: 500;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  cursor: pointer;
  text-align: center;
  transition: color var(--d-fast) var(--ease-out);
  min-height: 44px;
}
.engineer-toggle:hover { color: var(--ink-80); }
.engineer-content {
  display: none;
  margin-top: var(--s-4);
  background: var(--surface-0);
  border: 1px solid var(--line-1);
  border-radius: var(--r-md);
  padding: var(--s-5);
  animation: rise 300ms var(--ease-out) both;
}
.engineer-content[data-open="1"] { display: block; }
.engineer-title {
  font-family: var(--font-mono);
  font-size: var(--t-2xs);
  color: var(--ink-40);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-bottom: var(--s-4);
  display: flex;
  justify-content: space-between;
}
.engineer-row {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  color: var(--ink-60);
  padding: var(--s-2) 0;
  border-bottom: 1px solid var(--line-1);
  word-break: break-all;
  line-height: 1.6;
}
.engineer-row .key { color: var(--brand); font-weight: 700; }
.engineer-row .val { color: var(--ink-80); }

/* ─── ESTADO INICIAL VAZIO ──────────────────────────────────── */
.empty {
  min-height: calc(100vh - 200px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;

}
.empty-icon {

  font-weight: 900;
  color: var(--brand);
  opacity: 0.12;

}
.empty-title {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--ink-40);
  margin-bottom: var(--s-4);
}
.empty-desc {
  font-family: var(--font-body);
  font-size: var(--t-md);
  color: var(--ink-60);
  max-width: 400px;
  line-height: 1.6;
  margin-bottom: var(--s-6);
}
.empty-code {
  display: inline-block;
  padding: var(--s-3) var(--s-6);
  background: var(--surface-3);
  border: 1px solid var(--line-2);
  border-radius: var(--r-md);
  font-family: var(--font-mono);
  font-size: var(--t-sm);

/* ─── ANIMAÇÕES ─────────────────────────────────────────────── */
@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ─── SCROLLBAR ─────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-3); border-radius: var(--r-sm); }
::-webkit-scrollbar-thumb:hover { background: var(--brand); }

/* ─── SR-ONLY ───────────────────────────────────────────────── */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);

}

/* ─── RESPONSIVE ────────────────────────────────────────────── */
@media (max-width: 640px) {
  .top { padding: var(--s-4) var(--s-4); flex-wrap: wrap; }
  .main { padding: var(--s-6) var(--s-4) var(--s-16); }
  .project-name { font-size: 1.75rem; }
  .verdict-badge {
    font-size: var(--t-sm);
    letter-spacing: 0.2em;
    padding: var(--s-3) var(--s-5);
    gap: var(--s-3);
  }
  .verdict-line { font-size: var(--t-md); }
  .transmission-text { font-size: var(--t-lg); }
  .op-line { grid-template-columns: 70px 1fr auto; gap: var(--s-3); }
  .op-agent { font-size: 10px; }
  .op-action { font-size: var(--t-sm); }
  .wave-label { font-size: 9px; }
}
</style>
</head>
<body>

<a href="#main" class="skip">Pular para o painel</a>

<!-- CABEÇALHO — logo + pulso apenas -->
<header class="top" role="banner">
  <div class="brand" aria-label="Formação Delta-11">
    <span class="brand-mark">Δ<span class="num">-11</span></span>
    <span class="brand-divider" aria-hidden="true"></span>
    Centro de comando
  </div>
  <div class="pulso" id="pulso" aria-label="Última sincronização">
    <span class="pulso-dot" aria-hidden="true"></span>
    <span id="pulso-text">—</span>
  </div>
</header>

<main id="main" class="main">
  <!-- Renderizado por JS -->
</main>

<script src="kanban-data.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// PAINEL v6 · SALA DE OPERAÇÕES · Δ-11
// ═══════════════════════════════════════════════════════════════

const AGENT_ROLES = {
  ATLAS: 'Arquiteto', CRONOS: 'Gerente', FRONT: 'Interface',
  PIXEL: 'Visual', FORM: 'Formulários', BACK: 'Servidor',
  ENGINE: 'Motor', VAULT: 'Banco', SHIELD: 'Qualidade', SCOUT: 'Diagnóstico'
};

const HB_STALE_MIN = 5;
const TASK_OLD_MIN = 30;
const PULSE_STALE_S = 30;
const REFRESH_MS = 5000;

// ── Tempo ────────────────────────────────────────────────────
function parseTS(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  return isNaN(d) ? null : d;
}
function tempoRel(iso) {
  const d = parseTS(iso);
  if (!d) return null;
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 30) return 'agora';
  if (s < 60) return `há ${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `há ${m} min`;
  const h = Math.floor(m / 60);
  if (h < 24) return `há ${h}h`;
  const dd = Math.floor(h / 24);
  return `há ${dd}d`;
}
function minSince(iso) {
  const d = parseTS(iso);
  if (!d) return null;
  return Math.floor((Date.now() - d.getTime()) / 60000);
}

// ── Tradução automática (fallback) ───────────────────────────
const PADROES = [
  { re: /\[IMPACTO-MUDANCA\]/i, fala: 'Fazendo uma mudança de impacto' },
  { re: /migration|migração|migrations/i, fala: 'Mexendo no banco de dados' },
  { re: /webhook/i, fala: 'Configurando integração externa' },
  { re: /rota|route|api\//i, fala: 'Criando rota do servidor' },
  { re: /contract test|contract-tester/i, fala: 'Testando contratos' },
  { re: /tabela|table|schema/i, fala: 'Trabalhando na estrutura do banco' },
  { re: /componente|component|tela|page\.tsx/i, fala: 'Construindo uma tela' },
  { re: /formulário|formulario|form|validation/i, fala: 'Fazendo formulário' },
  { re: /auth|autenticação|login/i, fala: 'Trabalhando na autenticação' },
  { re: /orquestrar|orquestração/i, fala: 'Coordenando os agentes' },
  { re: /merge|revisão/i, fala: 'Consolidando trabalho' },
  { re: /bug|error|erro|corrigir/i, fala: 'Corrigindo um problema' },
  { re: /teste|test|spec/i, fala: 'Testando o sistema' }
];
function traduzir(t) {
  if (t.resumo_humano) return t.resumo_humano;
  const texto = (t.desc || '').toString();
  for (const p of PADROES) if (p.re.test(texto)) return p.fala;
  const clean = texto
    .replace(/\[[^\]]+\]/g, '').replace(/`[^`]+`/g, '')
    .replace(/T-[A-Z0-9-]+/gi, '').replace(/\s+/g, ' ').trim();
  const dot = clean.indexOf('.');
  return (dot > 0 && dot < 80 ? clean.substring(0, dot) : clean.substring(0, 80)).trim() || 'Trabalhando';
}

// ── Escape ───────────────────────────────────────────────────
function esc(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Selo binário + linha de contexto ─────────────────────────
function verdictOf(data) {
  if (!data) return {
    state: 'calm', icon: '●', text: 'AGUARDANDO',
    line: 'Nenhuma missão em execução.'
  };

  const blocked = data.bloqueado || [];
  const doing = data.fazendo || [];
  const hbs = data.heartbeats || [];

  if (blocked.length > 0) {
    return {
      state: 'danger',
      icon: '⚠',
      text: blocked.length > 1 ? `${blocked.length} TRAVADOS` : `${blocked.length} TRAVADO`,
      line: `${blocked.length > 1 ? 'Agentes' : 'Um agente'} precisa da sua decisão para destravar.`
    };
  }

  // Agente sem sinal
  for (const t of doing) {
    const hb = hbs.find(h => h.agente === t.agente);
    if (hb) {
      const m = minSince(hb.ultima_atividade);
      if (m !== null && m > HB_STALE_MIN) {
        return {
          state: 'alert',
          icon: '!',
          text: 'AGENTE SEM SINAL',
          line: `${t.agente} não dá sinal há ${m} minutos. Verifique se travou.`
        };
      }
    }
  }

  // Tarefa velha
  for (const t of doing) {
    const m = minSince(t.inicio);
    if (m !== null && m > TASK_OLD_MIN) {
      return {
        state: 'alert',
        icon: '!',
        text: 'TAREFA DEMORANDO',
        line: `Uma tarefa está aberta há mais de ${TASK_OLD_MIN} minutos. Talvez precise de você.`
      };
    }
  }

  // Precisa comandante
  if (data.mensagem_cronos && data.mensagem_cronos.precisa_comandante) {
    return {
      state: 'alert',
      icon: '!',
      text: 'PRECISA DE VOCÊ',
      line: data.mensagem_cronos.precisa_comandante
    };
  }

  if (doing.length > 0) {
    const nomes = doing.map(t => t.agente).filter(Boolean);
    const q = nomes.length;
    return {
      state: 'calm',
      icon: '●',
      text: 'SEGURO FECHAR',
      line: q === 1
        ? `${nomes[0]} está no comando. Nada requer você agora.`
        : `${q} agentes coordenados. Nada requer você agora.`
    };
  }

  return {
    state: 'calm',
    icon: '●',
    text: 'DESCANSANDO',
    line: 'Todos os agentes concluíram suas tarefas.'
  };
}

// ── Progresso + ondas ────────────────────────────────────────
function progressOf(data) {
  if (!data) return { done: 0, total: 0, pct: 0 };
  const done = (data.concluido || []).length;
  let todo = 0;
  Object.values(data.a_fazer || {}).forEach(a => todo += a.length);
  const doing = (data.fazendo || []).length;
  const rev = (data.revisao || []).length;
  const bl = (data.bloqueado || []).length;
  const total = done + todo + doing + rev + bl;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  return { done, total, pct, todo, doing, rev };
}
function wavesOf(data) {
  const fc = (data && data.fase_atual) || '';
  const s = fc.toString();
  const m1 = s.match(/onda\s*(\d+)\s*de\s*(\d+)/i);
  if (m1) return { curr: parseInt(m1[1]), total: parseInt(m1[2]) };
  const m2 = s.match(/onda\s*(\d+)/i);
  if (m2) {
    if (data && data.total_ondas) return { curr: parseInt(m2[1]), total: parseInt(data.total_ondas) };
    return { curr: parseInt(m2[1]), total: null };
  }
  return null;
}
function faseTag(fc) {
  if (!fc) return 'AGUARDANDO';
  const s = fc.toString();
  const c = s.match(/ciclo\s*([A-Z0-9]+)/i);
  const o = s.match(/onda\s*(\d+)/i);
  const f = s.match(/fase\s*(\d+)/i);
  if (c && o) return `CICLO ${c[1].toUpperCase()} · ONDA ${o[1]}`;
  if (o) return `ONDA ${o[1]}`;
  if (c) return `CICLO ${c[1].toUpperCase()}`;
  if (f) return `FASE ${f[1]}`;
  return s.substring(0, 40).toUpperCase();
}

// ── Estado dos agentes ativos (para linhas de operação) ──────
function opStatus(agent, hbs) {
  const hb = hbs.find(h => h.agente === agent);
  if (!hb) return 'active';
  const m = minSince(hb.ultima_atividade);
  if (m !== null && m > HB_STALE_MIN) return 'stalled';
  return 'active';
}

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
function renderEmpty() {
  return `
    <div class="empty">
      <div class="empty-icon" aria-hidden="true">Δ</div>
      <div class="empty-title">Aguardando missão</div>
      <p class="empty-desc">Nenhum projeto ativo. Abra o Claude Code e inicie com:</p>
      <div class="empty-code">d11 + descrição do projeto</div>
    </div>
  `;
}

function renderWaveTrack(waves) {
  if (!waves) return '';
  if (!waves.total) {
    return `
      <div class="wave-track">
        <div class="wave-line">
          <div class="wave-node">
            <span class="wave-dot" data-state="current"></span>
            <span class="wave-label" data-state="current">Onda ${esc(waves.curr)}</span>
          </div>
        </div>
      </div>
    `;
  }
  let nodes = '';
  for (let i = 1; i <= waves.total; i++) {
    let state = '';
    if (i < waves.curr) state = 'done';
    else if (i === waves.curr) state = 'current';
    const lbl = state === 'done' ? 'concluída'
              : state === 'current' ? 'em execução'
              : 'pendente';
    nodes += `
      <div class="wave-node">
        <span class="wave-dot" data-state="${state}" aria-hidden="true"></span>
        <span class="wave-label" data-state="${state}">Onda ${i} · ${lbl}</span>
      </div>
    `;
    if (i < waves.total) {
      const cs = i < waves.curr ? 'done' : '';
      nodes += `<span class="wave-connector" data-state="${cs}" aria-hidden="true"></span>`;
    }
  }
  return `
    <div class="wave-track" role="progressbar" aria-valuenow="${waves.curr}" aria-valuemin="1" aria-valuemax="${waves.total}">
      <div class="wave-line">${nodes}</div>
    </div>
  `;
}

function renderOpLine(t, hbs, forcedState) {
  const agent = t.agente || t.por || '?';
  const role = AGENT_ROLES[agent] || '';
  const state = forcedState || opStatus(agent, hbs);
  const hb = hbs.find(h => h.agente === agent);
  const tempo = tempoRel(hb ? hb.ultima_atividade : t.inicio) || '—';
  const acao = traduzir(t);
  const motivo = t.motivo ? `<div class="op-blocked-reason">⚠ ${esc(t.motivo)}</div>` : '';

  return `
    <div class="op-line" data-state="${state}">
      <div class="op-agent">
        <span class="op-marker" aria-hidden="true"></span>
        ${esc(agent)}
      </div>
      <div class="op-action">
        ${esc(acao)}
        <span class="sr-only"> — ${esc(role)}</span>
      </div>
      <div class="op-time">${esc(tempo)}</div>
      ${motivo}
    </div>
  `;
}

function renderMain(data) {
  const main = document.getElementById('main');

  if (!data || !data.projeto) {
    main.innerHTML = renderEmpty();
    return;
  }

  const verdict = verdictOf(data);
  const progress = progressOf(data);
  const waves = wavesOf(data);
  const cronos = data.mensagem_cronos;
  const doing = data.fazendo || [];
  const rev = data.revisao || [];
  const blocked = data.bloqueado || [];
  const done = data.concluido || [];
  const hbs = data.heartbeats || [];

  let html = '';

  // Projeto + Selo unificados (ponto focal do topo)
  html += `
    <section class="project" aria-label="Projeto ativo">
      <div class="project-tag">${esc(faseTag(data.fase_atual))}</div>
      <h1 class="project-name">${esc(data.projeto)}</h1>
    </section>

    <section class="verdict" aria-label="Estado da missão">
      <div class="verdict-badge" data-state="${verdict.state}" role="status" aria-live="polite">
        <span class="verdict-icon" aria-hidden="true">${verdict.icon}</span>
        ${esc(verdict.text)}
      </div>
      <p class="verdict-line">${esc(verdict.line)}</p>
    </section>
  `;

  // Convocação — só quando o CRONOS marca precisa_comandante explícito
  if (cronos && cronos.precisa_comandante && verdict.state !== 'danger') {
    html += `
      <section class="summon" role="alert">
        <div class="summon-label">
          <span aria-hidden="true">⚠</span>
          Precisa de você
        </div>
        <p class="summon-text">${esc(cronos.precisa_comandante)}</p>
      </section>
    `;
  }

  // Transmissão do CRONOS
  if (cronos && cronos.texto) {
    html += `
      <section class="transmission" aria-labelledby="tr-lbl">
        <span id="tr-lbl" class="transmission-label">CRONOS · Transmissão</span>
        <p class="transmission-text">${esc(cronos.texto)}</p>
        <div class="transmission-sign">${esc(tempoRel(cronos.timestamp) || 'sem carimbo')}</div>
      </section>
    `;
  } else {
    html += `
      <section class="transmission" data-state="empty">
        <span class="transmission-label">CRONOS · Transmissão</span>
        <p class="transmission-text">Sem transmissão recente.</p>
      </section>
    `;
  }

  // Missão atual (progresso + agentes em ação unificados)
  html += `
    <section class="mission" aria-labelledby="mis-lbl">
      <div class="section-header">
        <span class="section-arrow" aria-hidden="true">▸</span>
        <span id="mis-lbl" class="section-title">Missão atual</span>
        <span class="section-meta">${progress.done}/${progress.total} · ${progress.pct}%</span>
      </div>
      ${renderWaveTrack(waves)}
      <div class="ops" role="list">
  `;

  // Bloqueados vêm primeiro dentro da missão
  blocked.forEach(t => { html += renderOpLine(t, hbs, 'blocked'); });

  if (doing.length === 0 && blocked.length === 0) {
    html += `<div class="ops-empty">Nenhum agente em ação no momento.</div>`;
  } else {
    doing.forEach(t => { html += renderOpLine(t, hbs); });
  }

  html += `</div>`;

  // Em revisão (se houver, aparece como sub-seção discreta)
  if (rev.length > 0) {
    html += `
      <div class="section-header" style="margin-top:var(--s-6)">
        <span class="section-arrow" aria-hidden="true">▸</span>
        <span class="section-title">Em revisão do SHIELD</span>
        <span class="section-meta">${rev.length}</span>
      </div>
      <div class="ops" role="list">
    `;
    rev.forEach(t => { html += renderOpLine(t, hbs, 'review'); });
    html += `</div>`;
  }

  html += `</section>`;

  // Histórico
  if (done.length > 0) {
    html += `
      <section class="history-block">
        <button class="history-toggle" type="button" aria-expanded="false" aria-controls="hist-content" onclick="toggleHistory(this)">
          <span>Histórico · <span class="count">${done.length} tarefas prontas</span></span>
          <span class="chevron" aria-hidden="true">▾</span>
        </button>
        <div id="hist-content" class="history-content">
          ${done.slice().reverse().map(t => `
            <div class="history-item">
              <span class="check" aria-hidden="true">✓</span>
              <span>${esc(traduzir(t))}</span>
              <span class="who">${esc(t.por || '')}${t.data ? ' · ' + esc(t.data) : ''}</span>
            </div>
          `).join('')}
        </div>
      </section>
    `;
  }

  // Modo engenheiro
  html += `
    <section class="engineer">
      <button class="engineer-toggle" type="button" aria-expanded="false" aria-controls="eng-content" onclick="toggleEngineer(this)">
        · modo engenheiro ·
      </button>
      <div id="eng-content" class="engineer-content">
        <div class="engineer-title">
          <span>Dados brutos</span>
          <span>kanban-data.js</span>
        </div>
        ${renderEngineerRaw(data)}
      </div>
    </section>
  `;

  main.innerHTML = html;
}

function renderEngineerRaw(data) {
  let html = '';
  ['projeto','complexidade','fase_atual','ultima_atualizacao','agente_atualizador'].forEach(k => {
    if (data[k]) {
      html += `<div class="engineer-row"><span class="key">${esc(k)}:</span> <span class="val">${esc(data[k])}</span></div>`;
    }
  });
  const doing = data.fazendo || [];
  if (doing.length > 0) {
    html += `<div class="engineer-row" style="margin-top:8px"><span class="key">FAZENDO (${doing.length}):</span></div>`;
    doing.forEach(t => {
      html += `<div class="engineer-row" style="padding-left:12px">${esc(t.id || '?')} · ${esc(t.agente || '?')} · ${esc((t.desc || '').substring(0,120))}</div>`;
    });
  }
  const hbs = data.heartbeats || [];
  if (hbs.length > 0) {
    html += `<div class="engineer-row" style="margin-top:8px"><span class="key">HEARTBEATS:</span></div>`;
    hbs.forEach(h => {
      html += `<div class="engineer-row" style="padding-left:12px">${esc(h.agente)} · ${esc(h.ultima_atividade)} · ${esc(h.tarefa_atual || '')}</div>`;
    });
  }
  return html;
}

function toggleHistory(btn) {
  const c = document.getElementById('hist-content');
  if (!c) return;
  const open = c.dataset.open !== '1';
  c.dataset.open = open ? '1' : '0';
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}
function toggleEngineer(btn) {
  const c = document.getElementById('eng-content');
  if (!c) return;
  const open = c.dataset.open !== '1';
  c.dataset.open = open ? '1' : '0';
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}

// ── Pulso ────────────────────────────────────────────────────
let lastRefresh = Date.now();
function updatePulse() {
  const s = Math.floor((Date.now() - lastRefresh) / 1000);
  const txt = s < 5 ? 'sincronizado agora'
            : s < 60 ? `sincronizado há ${s}s`
            : `sincronizado há ${Math.floor(s/60)}min`;
  const el = document.getElementById('pulso-text');
  const wrap = document.getElementById('pulso');
  if (el) el.textContent = txt;
  if (wrap) wrap.dataset.old = s > PULSE_STALE_S ? '1' : '0';
}

// ── Refresh loop ─────────────────────────────────────────────
let lastHash = '';
function hash(d) { try { return JSON.stringify(d); } catch { return String(Date.now()); } }
function reload() {
  document.querySelectorAll('script[src^="kanban-data.js"]').forEach(s => s.remove());
  const s = document.createElement('script');
  s.src = 'kanban-data.js?t=' + Date.now();
  s.onload = () => {
    const h = hash(window.KANBAN_DATA);
    if (h !== lastHash) {
      lastHash = h;
      renderMain(window.KANBAN_DATA);
    }
    lastRefresh = Date.now();
    updatePulse();
  };
  document.head.appendChild(s);
}

if (window.KANBAN_DATA) {
  lastHash = hash(window.KANBAN_DATA);
  renderMain(window.KANBAN_DATA);
} else {
  renderMain(null);
}

setInterval(reload, REFRESH_MS);
setInterval(updatePulse, 1000);
setInterval(() => { if (window.KANBAN_DATA) renderMain(window.KANBAN_DATA); }, 30000);
</script>
</body>
</html>
