<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORMAÇÃO Δ-11 — Centro de Comando</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #080808;
    --bg-panel: #0e0e0e;
    --bg-card: #141414;
    --bg-card-hover: #1c1010;
    --border: #2a2a2a;
    --border-glow: #3a2020;
    --text-primary: #f0f0f0;
    --text-secondary: #999999;
    --text-muted: #666666;

    /* Δ-11 vermelho característico — todos os agentes */
    --atlas: #ff2020; --cronos: #ff2020; --front: #ff2020;
    --pixel: #ff2020; --form: #ff2020; --back: #ff2020;
    --engine: #ff2020; --vault: #ff2020; --shield: #ff2020; --scout: #ff2020;

    /* Estados funcionais */
    --fazendo: #ffffff;
    --revisao: #5ce68a;
    --concluido: #1b8a2a;
    --bloqueado: #ff1744;

    /* Selo binário v5.1 */
    --calmo: #5ce68a;
    --atencao: #ffb020;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Outfit', sans-serif; background: var(--bg-deep); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, rgba(8,8,8,0.82) 0%, rgba(8,8,8,0.87) 40%, rgba(8,8,8,0.92) 100%), url('bg-delta11.png') center center / cover no-repeat;
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px; pointer-events: none; z-index: 0;
  }

  /* ═══════════════════════════════════════════════════════════════
     HEADER (idêntico v4 — cinematográfico Δ-11)
     ═══════════════════════════════════════════════════════════════ */
  .header {
    position: relative; z-index: 1; padding: 24px 40px 18px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(10,10,10,0.97) 0%, rgba(5,5,5,0.85) 100%);
    backdrop-filter: blur(20px);
  }
  .header-left { display: flex; align-items: center; gap: 20px; }
  .logo { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 4px; text-transform: uppercase; color: var(--text-muted); }
  .logo .delta { font-size: 28px; font-weight: 800; letter-spacing: -1px; color: var(--atlas); text-shadow: 0 0 30px rgba(255,32,32,0.4); font-family: 'Outfit', sans-serif; }
  .logo .eleven { color: var(--text-primary); font-size: 28px; font-weight: 800; font-family: 'Outfit', sans-serif; }

  .header-status { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; justify-content: flex-end; }
  .status-item { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .status-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }
  .status-value { font-weight: 600; font-size: 15px; color: var(--text-primary); max-width: 320px; text-align: right; }
  .status-value.fase { color: var(--atlas); font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }

  /* SELO BINÁRIO no header — grande e cinematográfico */
  .selo {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 18px; border-radius: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    border: 1px solid transparent;
    transition: all 0.3s;
  }
  .selo.calmo {
    background: rgba(92,230,138,0.06);
    color: var(--calmo);
    border-color: rgba(92,230,138,0.35);
    text-shadow: 0 0 12px rgba(92,230,138,0.5);
  }
  .selo.atencao {
    background: rgba(255,176,32,0.08);
    color: var(--atencao);
    border-color: rgba(255,176,32,0.5);
    text-shadow: 0 0 12px rgba(255,176,32,0.6);
    animation: pulse-atencao 2s ease-in-out infinite;
  }
  .selo.emergencia {
    background: rgba(255,32,32,0.08);
    color: var(--atlas);
    border-color: rgba(255,32,32,0.6);
    text-shadow: 0 0 14px rgba(255,32,32,0.7);
    animation: pulse-emergencia 1s ease-in-out infinite;
  }
  .selo-icone { font-size: 14px; line-height: 1; }

  /* ═══════════════════════════════════════════════════════════════
     OPERATIVOS BAR — sprites soldados (idêntico v4)
     ═══════════════════════════════════════════════════════════════ */
  .operativos-bar {
    position: relative; z-index: 1;
    display: flex; justify-content: center; align-items: flex-end; gap: 8px;
    padding: 12px 20px 10px;
    background: linear-gradient(180deg, rgba(4,4,4,0.98), rgba(8,8,8,0.96));
    border-bottom: 1px solid #1a1a1a;
    overflow-x: auto;
  }
  .operativo { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 58px; position: relative; }
  .operativo-nome { font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase; color: #333; white-space: nowrap; }
  .operativo.ativo .operativo-nome { color: var(--atlas); text-shadow: 0 0 8px rgba(255,32,32,0.6); }
  .operativo.sem-sinal .operativo-nome { color: var(--atencao); text-shadow: 0 0 6px rgba(255,176,32,0.5); }
  .operativo-sprite-wrap { position: relative; height: 136px; display: flex; align-items: flex-end; justify-content: center; overflow: visible; }
  .operativo-sprite { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

  @keyframes soldier-fight {
    0%,100% { transform: translateY(0px) rotate(0deg); }
    15%     { transform: translateY(-7px) rotate(-6deg); }
    30%     { transform: translateY(-13px) rotate(7deg); }
    50%     { transform: translateY(-4px) rotate(0deg); }
    65%     { transform: translateY(-10px) rotate(-5deg) scaleX(-1); }
    82%     { transform: translateY(-5px) rotate(4deg) scaleX(-1); }
  }

  .zzz-wrap { position: absolute; top: 4px; right: 0px; width: 28px; height: 32px; pointer-events: none; }
  .zzz { position: absolute; font-family: 'JetBrains Mono', monospace; color: #3355aa; opacity: 0; line-height: 1; }
  .zzz:nth-child(1) { font-size: 7px; left: 2px; bottom: 0; animation: floatZ 2.6s ease-out infinite 0s; }
  .zzz:nth-child(2) { font-size: 9px; left: 7px; bottom: 0; animation: floatZ 2.6s ease-out infinite 0.87s; }
  .zzz:nth-child(3) { font-size: 12px; left: 11px; bottom: 0; animation: floatZ 2.6s ease-out infinite 1.74s; }
  @keyframes floatZ {
    0%   { opacity: 0; transform: translateY(0) translateX(0); }
    15%  { opacity: 0.85; }
    85%  { opacity: 0.2; }
    100% { opacity: 0; transform: translateY(-28px) translateX(12px); }
  }

  .operativo-status { font-family: 'JetBrains Mono', monospace; font-size: 7px; letter-spacing: 0.5px; text-transform: uppercase; }
  .operativo.ativo .operativo-status { color: var(--atlas); }
  .operativo.sem-sinal .operativo-status { color: var(--atencao); }
  .operativo:not(.ativo):not(.sem-sinal) .operativo-status { color: #282828; }

  /* ═══════════════════════════════════════════════════════════════
     PROGRESS (idêntico v4 — barra vermelha característica)
     ═══════════════════════════════════════════════════════════════ */
  .progress-bar-container { position: relative; z-index: 1; padding: 0 40px; background: var(--bg-deep); border-bottom: 1px solid var(--border); }
  .progress-track { height: 3px; background: var(--border); position: relative; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #b71c1c, #ff2020); transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 20px rgba(255,32,32,0.3); }
  .progress-info { display: flex; justify-content: space-between; padding: 8px 0; gap: 12px; flex-wrap: wrap; }
  .progress-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); letter-spacing: 1px; }
  .progress-percent { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--revisao); font-weight: 600; }

  /* ═══════════════════════════════════════════════════════════════
     LAYOUT PRINCIPAL — UMA COLUNA VERTICAL (v5.1)
     ═══════════════════════════════════════════════════════════════ */
  .painel-coluna {
    position: relative; z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 32px 40px 60px;
  }

  /* ─── Voz do CRONOS ─── */
  .voz-cronos {
    background: linear-gradient(180deg, rgba(20,20,20,0.9), rgba(14,14,14,0.9));
    border: 1px solid var(--border);
    border-left: 3px solid var(--atlas);
    border-radius: 6px;
    padding: 24px 28px;
    margin-bottom: 28px;
    position: relative;
    animation: fadeIn 0.4s ease-out both;
  }
  .voz-cronos::before {
    content: 'CRONOS · TRANSMISSÃO';
    position: absolute;
    top: -8px; left: 20px;
    background: var(--bg-deep);
    padding: 0 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--atlas);
    text-shadow: 0 0 8px rgba(255,32,32,0.5);
  }
  .voz-cronos-texto {
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: var(--text-primary);
    line-height: 1.55;
  }
  .voz-cronos-assinatura {
    margin-top: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .voz-cronos.vazio {
    opacity: 0.5;
    border-left-color: var(--text-muted);
  }
  .voz-cronos.vazio::before { color: var(--text-muted); text-shadow: none; }
  .voz-cronos.vazio .voz-cronos-texto {
    font-style: italic;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* ─── Convocação (só aparece quando precisa) ─── */
  .convocacao {
    background: rgba(255,176,32,0.06);
    border: 1px solid rgba(255,176,32,0.45);
    border-radius: 6px;
    padding: 22px 26px;
    margin-bottom: 28px;
    position: relative;
    animation: fadeIn 0.4s ease-out both, pulse-atencao 3s ease-in-out infinite;
  }
  .convocacao::before {
    content: 'PRECISA DE VOCÊ';
    position: absolute;
    top: -8px; left: 20px;
    background: var(--bg-deep);
    padding: 0 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--atencao);
    text-shadow: 0 0 8px rgba(255,176,32,0.6);
  }
  .convocacao-texto {
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    color: var(--text-primary);
    line-height: 1.5;
  }

  /* ─── Título de seção ─── */
  .secao-titulo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 32px 0 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--fazendo);
    box-shadow: 0 0 8px var(--fazendo);
    animation: blink 2s ease-in-out infinite;
  }
  .secao-count {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    background: var(--bg-card);
    padding: 2px 8px;
    border-radius: 3px;
  }

  /* ─── Cards de tarefa (estética v4 preservada) ─── */
  .tarefas {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .tarefa-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 18px;
    position: relative;
    overflow: hidden;
    transition: all 0.2s;
    animation: fadeIn 0.3s ease-out both;
  }
  .tarefa-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 3px;
    background: var(--fazendo);
  }
  .tarefa-card:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-glow);
    transform: translateY(-1px);
  }
  .tarefa-card.sem-sinal::before {
    background: var(--atencao);
    box-shadow: 0 0 8px rgba(255,176,32,0.5);
  }
  .tarefa-card.sem-sinal {
    background: rgba(255,176,32,0.03);
    border-color: rgba(255,176,32,0.25);
  }
  .tarefa-card.revisao::before { background: var(--revisao); box-shadow: 0 0 6px rgba(92,230,138,0.4); }
  .tarefa-card.revisao { border-color: rgba(92,230,138,0.15); }
  .tarefa-card.concluido::before { background: var(--concluido); }
  .tarefa-card.concluido { border-color: rgba(0,255,65,0.1); opacity: 0.85; }
  .tarefa-card.bloqueado::before { background: var(--bloqueado); box-shadow: 0 0 10px rgba(255,23,68,0.6); }
  .tarefa-card.bloqueado {
    background: rgba(255,23,68,0.03);
    border-color: rgba(255,23,68,0.3);
    animation: fadeIn 0.3s ease-out both, pulse-bloqueio 2.5s ease-in-out infinite;
  }

  .tarefa-topo {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 6px;
  }
  .tarefa-agente {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--atlas);
    text-shadow: 0 0 8px rgba(255,32,32,0.35);
  }
  .tarefa-card.revisao .tarefa-agente { color: var(--revisao); text-shadow: 0 0 6px rgba(92,230,138,0.4); }
  .tarefa-card.concluido .tarefa-agente { color: var(--concluido); text-shadow: none; }
  .tarefa-card.bloqueado .tarefa-agente { color: var(--bloqueado); text-shadow: 0 0 8px rgba(255,23,68,0.5); }

  .tarefa-agente-humano {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .tarefa-id {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-muted);
    opacity: 0.5;
    letter-spacing: 0.5px;
  }
  .tarefa-desc {
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-primary);
    line-height: 1.45;
    margin-bottom: 8px;
  }
  .tarefa-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }
  .tarefa-tempo.velho {
    color: var(--atencao);
    text-shadow: 0 0 6px rgba(255,176,32,0.5);
    font-weight: 600;
  }
  .tarefa-motivo {
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    color: var(--bloqueado);
    font-style: italic;
    margin-top: 6px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,23,68,0.15);
  }

  /* ─── Histórico colapsável ─── */
  .historico-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(27,138,42,0.04);
    border: 1px solid rgba(27,138,42,0.15);
    border-radius: 4px;
    margin-bottom: 5px;
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .historico-item .check {
    color: var(--concluido);
    font-weight: 700;
    font-size: 12px;
  }
  .historico-item .meta {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .historico-toggle {
    margin-top: 14px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    padding: 10px;
    border-radius: 4px;
    transition: all 0.2s;
    border: 1px solid transparent;
    user-select: none;
  }
  .historico-toggle:hover {
    color: var(--atlas);
    border-color: var(--border);
    text-shadow: 0 0 6px rgba(255,32,32,0.3);
  }
  .historico-lista-completa {
    margin-top: 12px;
    max-height: 480px;
    overflow-y: auto;
    display: none;
  }
  .historico-lista-completa.aberto { display: block; }

  /* ─── Vazio ─── */
  .vazio-msg {
    padding: 24px 20px;
    text-align: center;
    color: var(--text-muted);
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-style: italic;
    border: 1px dashed var(--border);
    border-radius: 6px;
  }

  /* ─── Estado inicial ─── */
  .empty-state { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 240px); text-align: center; padding: 40px; }
  .empty-delta { font-family: 'Outfit', sans-serif; font-size: 120px; font-weight: 900; color: var(--atlas); opacity: 0.08; line-height: 1; margin-bottom: -20px; }
  .empty-title { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
  .empty-desc { font-size: 15px; color: var(--text-muted); max-width: 400px; line-height: 1.6; }
  .empty-code { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--atlas); background: var(--bg-card); border: 1px solid var(--border); padding: 12px 24px; border-radius: 8px; margin-top: 24px; }

  /* ═══════════════════════════════════════════════════════════════
     ANIMAÇÕES
     ═══════════════════════════════════════════════════════════════ */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
  @keyframes pulse-atencao {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,176,32,0.35); }
    50% { box-shadow: 0 0 24px 0 rgba(255,176,32,0.15); }
  }
  @keyframes pulse-emergencia {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,32,32,0.45); }
    50% { box-shadow: 0 0 30px 0 rgba(255,32,32,0.25); }
  }
  @keyframes pulse-bloqueio {
    0%, 100% { border-color: rgba(255,23,68,0.3); }
    50% { border-color: rgba(255,23,68,0.55); }
  }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════
     HEADER (idêntico v4)
     ═══════════════════════════════════════════════════════════════ -->
<div class="header">
  <div class="header-left">
    <div class="logo">
      <span class="delta">Δ</span><span class="eleven">-11</span>
      <br>CENTRO DE COMANDO
    </div>
  </div>
  <div class="header-status">
    <div class="status-item"><span class="status-label">Projeto</span><span class="status-value" id="st-projeto">—</span></div>
    <div class="status-item"><span class="status-label">Fase</span><span class="status-value fase" id="st-fase">—</span></div>
    <div class="status-item"><span class="status-label">Última atividade</span><span class="status-value" id="st-update">—</span></div>
    <div id="st-selo-wrap"></div>
  </div>
</div>

<!-- Barra dos operativos (sprites soldados) -->
<div class="operativos-bar" id="operativos-bar"></div>

<!-- Barra de progresso vermelha -->
<div class="progress-bar-container">
  <div class="progress-info">
    <span class="progress-text" id="progress-text">Aguardando dados...</span>
    <span class="progress-percent" id="progress-percent">0%</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<!-- Coluna vertical principal -->
<div class="painel-coluna" id="painel-coluna">
  <!-- renderizado por JS -->
</div>

<script src="kanban-data.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// PAINEL v5.1 — Formação Δ-11 (estética v4 preservada)
// ═══════════════════════════════════════════════════════════════

const AGENT_NAMES = {
  ATLAS:'Arquiteto', CRONOS:'Gerente', FRONT:'Interface', PIXEL:'Visual',
  FORM:'Formulários', BACK:'Servidor', ENGINE:'Motor', VAULT:'Banco',
  SHIELD:'Qualidade', SCOUT:'Diagnóstico'
};

const AGENTS = ['ATLAS','CRONOS','FRONT','PIXEL','FORM','BACK','ENGINE','VAULT','SHIELD','SCOUT'];
const SP_W = 40, SP_H = 120;

const LIMITE_HEARTBEAT_MIN = 5;
const LIMITE_TAREFA_VELHA_MIN = 30;
const REFRESH_MS = 5000;
const HISTORICO_RECENTE_TAM = 5;

// ── Pré-carrega sprites (idêntico v4) ─────────────────────────────
const _imgs = {};
let _imgsLoaded = 0, _pendingAnim = false;
AGENTS.forEach(ag => {
  const img = new Image();
  img.onload = () => { _imgsLoaded++; if (_imgsLoaded >= AGENTS.length && _pendingAnim) { _pendingAnim = false; _loop(); } };
  img.src = 'sprites/' + ag + '.png';
  _imgs[ag] = img;
});

let _raf = null;
function _loop() {
  document.querySelectorAll('.operativo-canvas').forEach(cv => {
    const ctx = cv.getContext('2d');
    const img = _imgs[cv.dataset.ag];
    if (!img || !img.complete) return;
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.imageSmoothingEnabled = false;
    if (cv.dataset.act === '1') {
      ctx.drawImage(img, 0, 0, 96, 288, 0, 0, SP_W, SP_H);
    } else {
      ctx.save();
      ctx.translate(0, cv.height);
      ctx.rotate(-Math.PI / 2);
      ctx.drawImage(img, 0, 0, 96, 288, 0, 0, SP_W, SP_H);
      ctx.restore();
    }
  });
  _raf = requestAnimationFrame(_loop);
}
function _startAnim() {
  if (_raf) cancelAnimationFrame(_raf);
  if (_imgsLoaded >= AGENTS.length) _loop();
  else _pendingAnim = true;
}

// ═══════════════════════════════════════════════════════════════
// UTILITÁRIOS DE TEMPO
// ═══════════════════════════════════════════════════════════════

function parseTimestamp(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  return isNaN(d) ? null : d;
}

function tempoRelativo(iso) {
  const d = parseTimestamp(iso);
  if (!d) return null;
  const diffMin = Math.floor((Date.now() - d.getTime()) / 60000);
  if (diffMin < 1) return 'agora';
  if (diffMin === 1) return 'há 1 min';
  if (diffMin < 60) return `há ${diffMin} min`;
  const diffH = Math.floor(diffMin / 60);
  if (diffH === 1) return 'há 1 hora';
  if (diffH < 24) return `há ${diffH} horas`;
  const diffD = Math.floor(diffH / 24);
  if (diffD === 1) return 'há 1 dia';
  return `há ${diffD} dias`;
}

function minutosDesde(iso) {
  const d = parseTimestamp(iso);
  if (!d) return null;
  return Math.floor((Date.now() - d.getTime()) / 60000);
}

// ═══════════════════════════════════════════════════════════════
// TRADUÇÃO AUTOMÁTICA (fallback quando resumo_humano ausente)
// ═══════════════════════════════════════════════════════════════

const PADROES_TRADUCAO = [
  { regex: /\[IMPACTO-MUDANCA\]/i, fala: 'Fazendo uma mudança de impacto no sistema' },
  { regex: /migration|migração|migrations/i, fala: 'Mexendo na estrutura do banco de dados' },
  { regex: /webhook|webhooks/i, fala: 'Configurando integração externa' },
  { regex: /rota|route|api\//i, fala: 'Criando uma rota do servidor' },
  { regex: /contract test|contract-tester|contract_test/i, fala: 'Testando contratos do sistema' },
  { regex: /tabela|table|schema/i, fala: 'Trabalhando na estrutura do banco' },
  { regex: /componente|component|tela|page\.tsx/i, fala: 'Construindo uma tela' },
  { regex: /formulário|formulario|form|validation/i, fala: 'Fazendo formulário' },
  { regex: /auth|autenticação|login/i, fala: 'Trabalhando na autenticação' },
  { regex: /orquestrar|orquestração/i, fala: 'Coordenando os agentes' },
  { regex: /merge|revisão/i, fala: 'Consolidando trabalho pronto' },
  { regex: /bug|error|erro|corrigir/i, fala: 'Corrigindo um problema' },
  { regex: /teste|test|spec/i, fala: 'Testando o sistema' }
];

function traduzirParaHumano(tarefa) {
  if (tarefa.resumo_humano) return tarefa.resumo_humano;
  const texto = (tarefa.desc || '').toString();
  for (const p of PADROES_TRADUCAO) {
    if (p.regex.test(texto)) return p.fala;
  }
  const limpo = texto
    .replace(/\[[^\]]+\]/g, '')
    .replace(/`[^`]+`/g, '')
    .replace(/T-[A-Z0-9-]+/gi, '')
    .replace(/\s+/g, ' ')
    .trim();
  const ponto = limpo.indexOf('.');
  const corte = ponto > 0 && ponto < 80 ? ponto : 80;
  return limpo.substring(0, corte).trim() || 'Trabalhando na próxima etapa';
}

// ═══════════════════════════════════════════════════════════════
// SELO BINÁRIO
// ═══════════════════════════════════════════════════════════════

function calcularSelo(data) {
  if (!data) return { estado: 'calmo', icone: '●', texto: 'AGUARDANDO' };
  const bloqueados = data.bloqueado || [];
  if (bloqueados.length > 0) {
    return { estado: 'emergencia', icone: '⚠', texto: `${bloqueados.length} TRAVADO${bloqueados.length > 1 ? 'S' : ''}` };
  }
  const fazendo = data.fazendo || [];
  const heartbeats = data.heartbeats || [];
  for (const t of fazendo) {
    const hb = heartbeats.find(h => h.agente === t.agente);
    if (hb) {
      const min = minutosDesde(hb.ultima_atividade);
      if (min !== null && min > LIMITE_HEARTBEAT_MIN) {
        return { estado: 'atencao', icone: '!', texto: 'AGENTE SEM SINAL' };
      }
    }
  }
  for (const t of fazendo) {
    const min = minutosDesde(t.inicio);
    if (min !== null && min > LIMITE_TAREFA_VELHA_MIN) {
      return { estado: 'atencao', icone: '!', texto: 'TAREFA DEMORANDO' };
    }
  }
  if (data.mensagem_cronos && data.mensagem_cronos.precisa_comandante) {
    return { estado: 'atencao', icone: '!', texto: 'PRECISA DE VOCÊ' };
  }
  if (fazendo.length > 0) {
    return { estado: 'calmo', icone: '●', texto: 'SEGURO FECHAR' };
  }
  return { estado: 'calmo', icone: '●', texto: 'DESCANSANDO' };
}

// ═══════════════════════════════════════════════════════════════
// PROGRESSO
// ═══════════════════════════════════════════════════════════════

function calcularProgresso(data) {
  if (!data) return { concluidas: 0, total: 0, pct: 0 };
  const concluidas = (data.concluido || []).length;
  let pendentes = 0;
  Object.values(data.a_fazer || {}).forEach(arr => pendentes += arr.length);
  const fazendo = (data.fazendo || []).length;
  const revisao = (data.revisao || []).length;
  const bloqueado = (data.bloqueado || []).length;
  const total = concluidas + pendentes + fazendo + revisao + bloqueado;
  const pct = total > 0 ? Math.round((concluidas / total) * 100) : 0;
  return { concluidas, total, pct, pendentes, fazendo, revisao };
}

// ═══════════════════════════════════════════════════════════════
// HEARTBEAT DE AGENTE
// ═══════════════════════════════════════════════════════════════

function statusAgente(agente, heartbeats, ativos) {
  const hb = (heartbeats || []).find(h => h.agente === agente);
  if (ativos.has(agente)) {
    if (!hb) return 'ativo'; // aparece em fazendo mas sem heartbeat = assume ativo (retrocompat)
    const min = minutosDesde(hb.ultima_atividade);
    if (min !== null && min > LIMITE_HEARTBEAT_MIN) return 'sem-sinal';
    return 'ativo';
  }
  return 'rest';
}

function statusTarefa(tarefa, heartbeats) {
  const hb = (heartbeats || []).find(h => h.agente === tarefa.agente);
  if (!hb) return null;
  const min = minutosDesde(hb.ultima_atividade);
  if (min === null) return null;
  if (min > LIMITE_HEARTBEAT_MIN) return 'sem-sinal';
  return 'ativo';
}

// ═══════════════════════════════════════════════════════════════
// RENDER — OPERATIVOS BAR (sprites soldados)
// ═══════════════════════════════════════════════════════════════

function renderOperativos(data) {
  const bar = document.getElementById('operativos-bar');
  if (!bar) return;
  const ativos = new Set();
  if (data) (data.fazendo || []).forEach(t => t.agente && ativos.add(t.agente));
  const heartbeats = (data && data.heartbeats) || [];

  bar.innerHTML = AGENTS.map(ag => {
    const status = statusAgente(ag, heartbeats, ativos);
    const isAct = status === 'ativo';
    const isSemSinal = status === 'sem-sinal';
    const nome = ag + (ag === 'SHIELD' ? ' ♀' : '');

    const cw = isAct || isSemSinal ? SP_W : SP_H;
    const ch = isAct || isSemSinal ? SP_H : SP_W;

    let filt, anim, statusTxt, classe;
    if (isAct) {
      filt = 'drop-shadow(0 0 8px rgba(255,50,50,0.9)) drop-shadow(0 0 22px rgba(255,50,50,0.35))';
      anim = 'animation:soldier-fight 1.1s ease-in-out infinite;';
      statusTxt = '◉ ATIVO';
      classe = 'ativo';
    } else if (isSemSinal) {
      filt = 'drop-shadow(0 0 6px rgba(255,176,32,0.7)) saturate(0.6) brightness(0.7)';
      anim = 'opacity:0.85;';
      statusTxt = '! SEM SINAL';
      classe = 'sem-sinal';
    } else {
      filt = 'saturate(0.12) brightness(0.35)';
      anim = 'opacity:0.45;';
      statusTxt = '· rest';
      classe = '';
    }
    const style = `filter:${filt};${anim}`;

    const zzz = (!isAct && !isSemSinal)
      ? `<div class="zzz-wrap"><span class="zzz">z</span><span class="zzz">z</span><span class="zzz">Z</span></div>`
      : '';

    return `
      <div class="operativo ${classe}">
        <div class="operativo-nome">${nome}</div>
        <div class="operativo-sprite-wrap">
          ${zzz}
          <canvas class="operativo-canvas operativo-sprite"
            width="${cw}" height="${ch}"
            data-act="${isAct || isSemSinal ? '1' : '0'}"
            data-ag="${ag}"
            style="${style}"
          ></canvas>
        </div>
        <div class="operativo-status">${statusTxt}</div>
      </div>`;
  }).join('');

  _startAnim();
}

// ═══════════════════════════════════════════════════════════════
// EXTRAÇÃO DE FASE
// ═══════════════════════════════════════════════════════════════

function extrairFase(faseCompleta) {
  if (!faseCompleta) return '—';
  const s = faseCompleta.toString();
  const ondaMatch = s.match(/onda\s*(\d+)/i);
  const cicloMatch = s.match(/ciclo\s*([A-Z0-9]+)/i);
  const faseMatch = s.match(/fase\s*(\d+)/i);
  if (cicloMatch && ondaMatch) return `Ciclo ${cicloMatch[1]} · Onda ${ondaMatch[1]}`;
  if (ondaMatch) return `Onda ${ondaMatch[1]}`;
  if (cicloMatch) return `Ciclo ${cicloMatch[1]}`;
  if (faseMatch) return `Fase ${faseMatch[1]}`;
  const ponto = s.indexOf('.');
  const corte = ponto > 0 && ponto < 50 ? ponto : 50;
  return s.substring(0, corte).trim();
}

function escapar(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ═══════════════════════════════════════════════════════════════
// RENDER PRINCIPAL
// ═══════════════════════════════════════════════════════════════

function renderPainel(data) {
  renderOperativos(data);

  if (!data || !data.projeto) {
    document.getElementById('painel-coluna').innerHTML = `
      <div class="empty-state">
        <div class="empty-delta">Δ</div>
        <div class="empty-title">Aguardando missão</div>
        <div class="empty-desc">Nenhum projeto ativo. Abra o Claude Code e inicie com:</div>
        <div class="empty-code">d11 + descrição do projeto</div>
      </div>
    `;
    return;
  }

  const selo = calcularSelo(data);
  const progresso = calcularProgresso(data);
  const heartbeats = data.heartbeats || [];
  const mensagemCronos = data.mensagem_cronos;
  const fazendo = data.fazendo || [];
  const revisao = data.revisao || [];
  const bloqueado = data.bloqueado || [];
  const concluido = data.concluido || [];

  // ─── Header data ───
  document.getElementById('st-projeto').textContent = data.projeto || '—';
  document.getElementById('st-fase').textContent = extrairFase(data.fase_atual);

  // Última atividade — pega o heartbeat mais recente
  let ultimaAtividade = null;
  heartbeats.forEach(h => {
    const d = parseTimestamp(h.ultima_atividade);
    if (d && (!ultimaAtividade || d > ultimaAtividade)) ultimaAtividade = d;
  });
  if (!ultimaAtividade && mensagemCronos) {
    ultimaAtividade = parseTimestamp(mensagemCronos.timestamp);
  }
  document.getElementById('st-update').textContent = ultimaAtividade
    ? tempoRelativo(ultimaAtividade.toISOString())
    : '—';

  // Selo binário
  document.getElementById('st-selo-wrap').innerHTML = `
    <div class="selo ${selo.estado}">
      <span class="selo-icone">${selo.icone}</span>
      ${selo.texto}
    </div>
  `;

  // Progresso
  document.getElementById('progress-fill').style.width = progresso.pct + '%';
  document.getElementById('progress-percent').textContent = progresso.pct + '%';
  document.getElementById('progress-text').textContent =
    `${progresso.concluidas} de ${progresso.total} tarefas concluídas${progresso.fazendo > 0 ? ' · ' + progresso.fazendo + ' em execução' : ''}${progresso.revisao > 0 ? ' · ' + progresso.revisao + ' em revisão' : ''}${progresso.pendentes > 0 ? ' · ' + progresso.pendentes + ' pendentes' : ''}`;

  // ─── Coluna principal ───
  let html = '';

  // Voz do CRONOS
  if (mensagemCronos && mensagemCronos.texto) {
    html += `
      <div class="voz-cronos">
        <div class="voz-cronos-texto">${escapar(mensagemCronos.texto)}</div>
        <div class="voz-cronos-assinatura">CRONOS · ${tempoRelativo(mensagemCronos.timestamp) || 'sem carimbo'}</div>
      </div>
    `;
  } else {
    html += `
      <div class="voz-cronos vazio">
        <div class="voz-cronos-texto">Sem transmissão recente do CRONOS.</div>
      </div>
    `;
  }

  // Convocação (só quando precisa)
  if (mensagemCronos && mensagemCronos.precisa_comandante) {
    html += `
      <div class="convocacao">
        <div class="convocacao-texto">${escapar(mensagemCronos.precisa_comandante)}</div>
      </div>
    `;
  }

  // ─── Bloqueado (emergência — se existir, mostra primeiro) ───
  if (bloqueado.length > 0) {
    html += `
      <div class="secao-titulo">
        <span class="live-dot" style="background:var(--bloqueado);box-shadow:0 0 8px var(--bloqueado)"></span>
        Travados
        <span class="secao-count">${bloqueado.length}</span>
      </div>
      <div class="tarefas">
        ${bloqueado.map(t => renderTarefaCard(t, heartbeats, 'bloqueado')).join('')}
      </div>
    `;
  }

  // ─── Acontecendo agora ───
  html += `
    <div class="secao-titulo">
      <span class="live-dot"></span>
      Acontecendo agora
      <span class="secao-count">${fazendo.length}</span>
    </div>
  `;
  if (fazendo.length === 0) {
    html += `<div class="vazio-msg">Nenhuma tarefa em execução no momento.</div>`;
  } else {
    html += `<div class="tarefas">${fazendo.map(t => renderTarefaCard(t, heartbeats, 'fazendo')).join('')}</div>`;
  }

  // ─── Revisão ───
  if (revisao.length > 0) {
    html += `
      <div class="secao-titulo">
        <span class="live-dot" style="background:var(--revisao);box-shadow:0 0 8px var(--revisao)"></span>
        Em revisão do SHIELD
        <span class="secao-count">${revisao.length}</span>
      </div>
      <div class="tarefas">
        ${revisao.map(t => renderTarefaCard(t, heartbeats, 'revisao')).join('')}
      </div>
    `;
  }

  // ─── Histórico recente + colapsável ───
  if (concluido.length > 0) {
    const recente = concluido.slice(-HISTORICO_RECENTE_TAM).reverse();
    const antigo = concluido.slice(0, -HISTORICO_RECENTE_TAM).reverse();
    html += `
      <div class="secao-titulo">
        <span class="live-dot" style="background:var(--concluido);box-shadow:0 0 8px var(--concluido)"></span>
        Aconteceu há pouco
        <span class="secao-count">${concluido.length}</span>
      </div>
    `;
    recente.forEach(t => {
      html += `
        <div class="historico-item">
          <span class="check">✓</span>
          <span>${escapar(traduzirParaHumano(t))}</span>
          <span class="meta">${escapar(t.por || '')}${t.data ? ' · ' + escapar(t.data) : ''}</span>
        </div>
      `;
    });
    if (antigo.length > 0) {
      html += `
        <div class="historico-toggle" onclick="toggleHistorico(this)">
          ↓ Ver histórico completo (${antigo.length} outras tarefas)
        </div>
        <div class="historico-lista-completa">
          ${antigo.map(t => `
            <div class="historico-item">
              <span class="check">✓</span>
              <span>${escapar(traduzirParaHumano(t))}</span>
              <span class="meta">${escapar(t.por || '')}${t.data ? ' · ' + escapar(t.data) : ''}</span>
            </div>
          `).join('')}
        </div>
      `;
    }
  }

  document.getElementById('painel-coluna').innerHTML = html;
}

function renderTarefaCard(t, heartbeats, tipo) {
  const stTarefa = statusTarefa(t, heartbeats);
  const semSinal = stTarefa === 'sem-sinal';
  const agente = t.agente || t.por || '?';
  const humano = traduzirParaHumano(t);
  const hb = heartbeats.find(h => h.agente === agente);
  const tempoIso = hb ? hb.ultima_atividade : t.inicio;
  const tempo = tempoRelativo(tempoIso);
  const min = minutosDesde(tempoIso);
  const tempoClasse = (min !== null && min > LIMITE_HEARTBEAT_MIN) ? 'velho' : '';
  const motivoHtml = t.motivo ? `<div class="tarefa-motivo">⚠ ${escapar(t.motivo)}</div>` : '';

  const classes = ['tarefa-card'];
  if (semSinal && tipo === 'fazendo') classes.push('sem-sinal');
  if (tipo === 'revisao') classes.push('revisao');
  if (tipo === 'concluido') classes.push('concluido');
  if (tipo === 'bloqueado') classes.push('bloqueado');

  return `
    <div class="${classes.join(' ')}">
      <div class="tarefa-topo">
        <span class="tarefa-agente">${escapar(agente)}</span>
        <span class="tarefa-agente-humano">· ${AGENT_NAMES[agente] || ''}</span>
        <span class="tarefa-id">${escapar(t.id || '')}</span>
      </div>
      <div class="tarefa-desc">${escapar(humano)}</div>
      <div class="tarefa-meta">
        <span class="tarefa-tempo ${tempoClasse}">${tempo || 'sem tempo'}${semSinal ? ' · SEM SINAL' : ''}</span>
        ${t.revisor ? `<span>· revisor: ${escapar(t.revisor)}</span>` : ''}
      </div>
      ${motivoHtml}
    </div>
  `;
}

function toggleHistorico(el) {
  const lista = el.nextElementSibling;
  if (!lista) return;
  const aberto = lista.classList.toggle('aberto');
  if (aberto) {
    el.innerHTML = '↑ Fechar histórico';
  } else {
    const total = lista.querySelectorAll('.historico-item').length;
    el.innerHTML = `↓ Ver histórico completo (${total} outras tarefas)`;
  }
}

// ═══════════════════════════════════════════════════════════════
// REFRESH + INIT
// ═══════════════════════════════════════════════════════════════

let lastHash = '';
function hashData(d) { try { return JSON.stringify(d); } catch { return String(Date.now()); } }

function refreshData() {
  const oldScripts = document.querySelectorAll('script[src^="kanban-data.js"]');
  oldScripts.forEach(s => s.remove());
  const s = document.createElement('script');
  s.src = 'kanban-data.js?t=' + Date.now();
  s.onload = () => {
    const h = hashData(window.KANBAN_DATA);
    if (h !== lastHash) {
      lastHash = h;
      renderPainel(window.KANBAN_DATA);
    }
  };
  document.head.appendChild(s);
}

if (window.KANBAN_DATA) {
  lastHash = hashData(window.KANBAN_DATA);
  renderPainel(window.KANBAN_DATA);
} else {
  renderOperativos(null);
  renderPainel(null);
}

// Auto-refresh a cada 5s (mudanças nos dados)
setInterval(refreshData, REFRESH_MS);

// Re-render a cada 30s (atualiza tempos relativos)
setInterval(() => {
  if (window.KANBAN_DATA) renderPainel(window.KANBAN_DATA);
}, 30000);
</script>
